<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche formation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="commun.css?v=13">
</head>
<body>
<div id="app" aria-busy="true">
  <div class="barre">
    <input class="recherche" id="recherche" type="search" placeholder="Chercher une formation"
           aria-label="Chercher une formation" autocomplete="off">
    <div class="avance" id="avance"></div>
    <div class="nav">
      <button class="outil" id="prec" type="button" title="Formation précédente (Alt + ←)">Précédente</button>
      <button class="outil" id="suiv" type="button" title="Formation suivante (Alt + →)">Suivante</button>
    </div>
  </div>
  <div class="corps">
    <div class="rail" id="rail" role="list"></div>
    <div class="fiche" id="fiche"><p class="vide">Chargement du document…</p></div>
  </div>
</div>
<div class="etat-sauve" id="sauve" role="status" aria-live="polite"></div>

<script src="commun.js?v=13"></script>
<script>
/* =========================================================================
   Fiche formation — définition, intervenants et projections au même endroit.

   Tout ce qui décrit une formation et tout ce qui la projette tient dans un
   écran : on ouvre une formation, on la décrit, on dit combien de sessions
   et combien de places, et on passe à la suivante. Aucune référence à
   choisir ligne par ligne, aucune table à ouvrir à côté.
   ========================================================================= */
'use strict';

/* Écrit dans le bandeau du haut. Une page servie depuis le cache affiche
   l'ancien numéro : on sait tout de suite si le fichier déposé est bien
   celui qui tourne, sans avoir à lire le code source. */
var VERSION = 'v13';

var TABLES = ['Annees', 'Formations', 'Projections', 'Ventes_inter', 'Ventes_intra', 'Segments',
  'Segments_categories', 'Categories_tarifaires', 'Domaines', 'Sous_domaines', 'Typologies',
  'Gestionnaire', 'Metiers', 'Enjeux', 'Obligations', 'Intervenants', 'Intervenants_formation',
  'Besoins_salles', 'Types_salles'];

var courant = null, filtre = '', curseurGrist = null;

/* ------------------------------------------------------- accès données -- */
function projDe(idAnnee, idFormation) {
  return OF.table('Projections').filter(function (p) {
    return p.annee === idAnnee && p.formation === idFormation;
  });
}
/* Plusieurs lignes peuvent porter la même année et le même segment. La grille
   n'a qu'une case par segment : plutôt que de n'en montrer qu'une au hasard
   et de laisser les totaux paraître faux, on les compte et on le dit. */
function ventesDe(idAnnee, idFormation, idSegment) {
  return OF.table('Ventes_inter').filter(function (v) {
    return v.annee === idAnnee && v.formation === idFormation && v.segment === idSegment;
  });
}
function venteDe(idAnnee, idFormation, idSegment) {
  return ventesDe(idAnnee, idFormation, idSegment)[0] || null;
}
function colExiste(table, col) {
  var meta = OF.doc.colonnes[table];
  if (meta && Object.keys(meta).length) return !!meta[col];
  return OF.table(table).some(function (l) { return col in l; });
}
function segmentsDe(f) {
  var connus = OF.parId(OF.table('Segments'));
  return OF.refs(f.segments).filter(function (id) { return connus[id]; });
}

/* Les colonnes de la grille. Aux segments visés par la fiche s'ajoutent ceux
   qui portent déjà des ventes sans être visés : sans cela, des places saisies
   disparaissaient de l'écran dès qu'on retirait le segment du public visé, et
   elles continuaient pourtant à compter dans la recette et le remplissage. */
function segmentsAffiches(f) {
  var connus = OF.parId(OF.table('Segments'));
  var vus = segmentsDe(f);
  var dedans = {};
  vus.forEach(function (id) { dedans[id] = 1; });
  OF.table('Ventes_inter').forEach(function (v) {
    if (v.formation !== f.id || !v.segment || dedans[v.segment] || !connus[v.segment]) return;
    dedans[v.segment] = 1;
    vus.push(v.segment);
  });
  return vus;
}
function estVise(f, idSegment) {
  return segmentsDe(f).indexOf(idSegment) >= 0;
}
function nomSegment(id) {
  var s = OF.parId(OF.table('Segments'))[id];
  return s ? (OF.texte(s.intitule) || ('Segment ' + id)) : ('Segment ' + id);
}
function intervenantsDe(f) {
  return OF.table('Intervenants_formation').filter(function (i) { return i.formation === f.id; });
}
function categoriesDe(idSegment) {
  return OF.table('Segments_categories').filter(function (m) {
    return m.segment === idSegment && m.categorie;
  }).map(function (m) { return m.categorie; });
}
function categorieUnique(idSegment) {
  var cats = categoriesDe(idSegment);
  return cats.length === 1 ? cats[0] : null;
}
function nomCategorie(id) {
  var c = OF.parId(OF.table('Categories_tarifaires'))[id];
  return c ? (OF.texte(c.intitule) || ('Catégorie ' + id)) : '—';
}

/* Une vente inter se compte en places ouvertes, ou en groupes quand le tarif
   est posé au groupe — c'est le cas du CHU. La base de facturation choisie
   dans le document décide laquelle des deux colonnes porte la quantité ; on
   ne devine rien, on lit `base`. */
/* On ne propose que des listes de choix : si `base` était une référence vers
   une table de tarifs, écrire son libellé y mettrait du texte au lieu d'un
   identifiant. Dans ce cas l'écran s'abstient et le dit. */
function baseEstUneListe() {
  var t = OF.colonne('Ventes_inter', 'base').type;
  return !t || t === 'Choice';
}
function basesVente() {
  if (!baseEstUneListe()) return [];
  return OF.choixDe('Ventes_inter', 'base').filter(function (b) {
    return OF.texte(b).trim() && !/^\d+$/.test(OF.texte(b).trim());
  });
}
function estGroupe(base) { return /groupe/i.test(OF.texte(base)); }
/* « gr. » suffit tant qu'il n'y a qu'un tarif au groupe. S'il y en a deux, les
   confondre sous la même étiquette ferait croire à deux lignes identiques qui
   ne se facturent pas pareil : on ajoute alors de quoi les distinguer. */
function uniteCourte(base) {
  var racine = estGroupe(base) ? 'gr.' : 'pl.';
  var memeUnite = basesVente().filter(function (b) { return estGroupe(b) === estGroupe(base); });
  if (memeUnite.length < 2) return racine;
  var mots = OF.texte(base).trim().split(/\s+/);
  return racine + ' ' + mots[mots.length - 1].toLowerCase();
}
function colonneQuantite(v) {
  return estGroupe(v && v.base) ? 'nb_groupes' : 'nb_places';
}
function quantite(v) { return v ? (v[colonneQuantite(v)] || 0) : 0; }
function lieux() {
  var vus = {};
  OF.table('Projections').forEach(function (p) { if (OF.texte(p.localisation)) vus[p.localisation] = 1; });
  var l = OF.choixDe('Projections', 'localisation');
  return l.length ? l : (Object.keys(vus).length ? Object.keys(vus) : ['OF', 'Extérieur']);
}

/* Une année compte dès qu'elle porte des sessions ; la formation est
   complète quand, pour chacune, les places sont renseignées sur chaque
   segment visé. Sans session, rien n'est en retard : elle n'est pas vendue. */
function avancement(f) {
  var segs = segmentsDe(f), attendus = 0, remplis = 0, actives = 0;
  OF.anneesTriees().forEach(function (a) {
    var sessions = projDe(a.id, f.id).reduce(function (n, p) { return n + (p.nb_sessions || 0); }, 0);
    if (!sessions) return;
    actives++;
    segs.forEach(function (idSeg) {
      attendus++;
      var v = venteDe(a.id, f.id, idSeg);
      if (v && (v.nb_places || v.nb_groupes)) remplis++;
    });
  });
  if (!actives) return { etat: 'vide', remplis: 0, attendus: 0 };
  if (!segs.length) return { etat: 'sans-segment', remplis: 0, attendus: 0 };
  return { etat: remplis >= attendus ? 'fait' : 'partiel', remplis: remplis, attendus: attendus };
}

/* ------------------------------------------------------------ écriture -- */
var RELIRE = ['Formations', 'Projections', 'Ventes_inter', 'Intervenants_formation'];

function ecrireSessions(idAnnee, f, valeur, lieu) {
  var lignes = projDe(idAnnee, f.id);
  if (lignes.length > 1) return Promise.resolve();
  if (lignes.length === 1) {
    var maj = { nb_sessions: valeur };
    if (lieu !== undefined) maj.localisation = lieu;
    return OF.appliquer([['UpdateRecord', 'Projections', lignes[0].id, maj]], RELIRE, rafraichir);
  }
  var champs = { annee: idAnnee, formation: f.id, nb_sessions: valeur };
  if (lieu !== undefined) champs.localisation = lieu;
  return OF.appliquer([['AddRecord', 'Projections', null, champs]], RELIRE, rafraichir);
}

/* La quantité part dans la colonne que désigne la base de facturation de la
   ligne : places ouvertes, ou groupes. Une ligne neuve garde la base que le
   document lui donne par défaut. */
function ecrireQuantite(idAnnee, f, idSegment, valeur) {
  var v = venteDe(idAnnee, f.id, idSegment);
  var champs = {};
  champs[colonneQuantite(v)] = valeur;
  if (v) {
    return OF.appliquer([['UpdateRecord', 'Ventes_inter', v.id, champs]], RELIRE, rafraichir);
  }
  champs.annee = idAnnee;
  champs.formation = f.id;
  champs.segment = idSegment;
  var cat = categorieUnique(idSegment);
  if (cat) champs.categorie = cat;
  return OF.appliquer([['AddRecord', 'Ventes_inter', null, champs]], RELIRE, rafraichir);
}

/* Changer de base change l'unité. Le nombre suit — on ne le jette pas : le
   geste le plus courant est de taper une quantité puis de corriger l'unité,
   et effacer la frappe à ce moment-là est insupportable. Mais trois places ne
   font pas trois groupes : le report est annoncé, et l'on demande de vérifier.
   Un chiffre reporté et signalé se corrige ; un chiffre effacé est perdu. */
function changerBase(f, a, idSegment, nouvelle) {
  var v = venteDe(a.id, f.id, idSegment);
  var champs = { base: nouvelle };
  if (v) {
    var avant = colonneQuantite(v);
    var apres = estGroupe(nouvelle) ? 'nb_groupes' : 'nb_places';
    var dire = null;
    if (avant !== apres) {
      var ancienne = v[avant] || 0;
      champs[avant] = 0;
      champs[apres] = ancienne;
      if (ancienne) {
        dire = OF.ent(ancienne) + ' '
          + (apres === 'nb_groupes'
            ? OF.accord(ancienne, 'place devient 1 groupe', 'places deviennent '
                + OF.ent(ancienne) + ' groupes')
            : OF.accord(ancienne, 'groupe devient 1 place', 'groupes deviennent '
                + OF.ent(ancienne) + ' places'))
          + ' — à vérifier.';
      }
    }
    return OF.appliquer([['UpdateRecord', 'Ventes_inter', v.id, champs]], RELIRE, function () {
      rafraichir();
      if (dire) OF.signaler(dire);     // après l'accusé d'enregistrement, pas avant
    });
  }
  champs.annee = a.id;
  champs.formation = f.id;
  champs.segment = idSegment;
  var cat = categorieUnique(idSegment);
  if (cat) champs.categorie = cat;
  return OF.appliquer([['AddRecord', 'Ventes_inter', null, champs]], RELIRE, rafraichir);
}

function changerCategorie(f, a, idSegment, idCategorie) {
  var v = venteDe(a.id, f.id, idSegment);
  if (v) {
    return OF.appliquer([['UpdateRecord', 'Ventes_inter', v.id, { categorie: idCategorie }]],
      RELIRE, rafraichir);
  }
  return OF.appliquer([['AddRecord', 'Ventes_inter', null, {
    annee: a.id, formation: f.id, segment: idSegment, categorie: idCategorie
  }]], RELIRE, rafraichir);
}

function compterEcrasements(f, idSource) {
  var annees = OF.anneesTriees();
  var i0 = annees.findIndex(function (a) { return a.id === idSource; });
  if (i0 < 0) return 0;
  var segs = segmentsDe(f), n = 0, i, j;
  for (i = i0 + 1; i < annees.length; i++) {
    if (projDe(annees[i].id, f.id).some(function (p) { return p.nb_sessions; })) n++;
    for (j = 0; j < segs.length; j++) {
      var v = venteDe(annees[i].id, f.id, segs[j]);
      if (v && quantite(v)) n++;
    }
  }
  return n;
}

function reprendre(f, idSource, coefficient) {
  var annees = OF.anneesTriees();
  var i0 = annees.findIndex(function (a) { return a.id === idSource; });
  if (i0 < 0) return;
  var segs = segmentsDe(f), actions = [], i, j;
  var src = projDe(idSource, f.id);
  var sessionsSource = src.reduce(function (n, p) { return n + (p.nb_sessions || 0); }, 0);
  var lieuSource = src.length === 1 ? src[0].localisation : undefined;

  for (i = i0 + 1; i < annees.length; i++) {
    var idA = annees[i].id, puissance = Math.pow(coefficient, i - i0);
    var lignes = projDe(idA, f.id);
    if (lignes.length > 1) continue;
    var sessions = Math.round(sessionsSource * puissance);
    if (lignes.length === 1) {
      var maj = { nb_sessions: sessions };
      if (lieuSource !== undefined && !OF.texte(lignes[0].localisation)) maj.localisation = lieuSource;
      actions.push(['UpdateRecord', 'Projections', lignes[0].id, maj]);
    } else {
      var champs = { annee: idA, formation: f.id, nb_sessions: sessions };
      if (lieuSource !== undefined) champs.localisation = lieuSource;
      actions.push(['AddRecord', 'Projections', null, champs]);
    }
    for (j = 0; j < segs.length; j++) {
      var vs = venteDe(idSource, f.id, segs[j]);
      if (!vs) continue;
      /* on reprend la quantité dans sa propre unité, avec sa base et son
         tarif : une année reprise en groupes reste en groupes */
      var colonne = colonneQuantite(vs);
      var q = Math.round((vs[colonne] || 0) * puissance);
      if (!q) continue;
      var maj = {};
      maj[colonne] = q;
      if (OF.texte(vs.base)) maj.base = vs.base;
      if (vs.categorie) maj.categorie = vs.categorie;
      var vc = venteDe(idA, f.id, segs[j]);
      if (vc) {
        var autre = colonne === 'nb_places' ? 'nb_groupes' : 'nb_places';
        if (vc[autre]) maj[autre] = 0;
        actions.push(['UpdateRecord', 'Ventes_inter', vc.id, maj]);
      } else {
        maj.annee = idA; maj.formation = f.id; maj.segment = segs[j];
        if (!maj.categorie) {
          var cat = categorieUnique(segs[j]);
          if (cat) maj.categorie = cat;
        }
        actions.push(['AddRecord', 'Ventes_inter', null, maj]);
      }
    }
  }
  if (!actions.length) { OF.signaler('Rien à reprendre : aucune année après celle-ci'); return; }
  OF.appliquer(actions, RELIRE, rendreFiche);
}

/* ---------------------------------------------------------------- rail -- */
var ETIQUETTES = { fait: 'complète', partiel: 'à compléter', vide: 'sans session',
  'sans-segment': 'segment à définir' };
var PASTILLES = { fait: 'p-fait', partiel: 'p-partiel', vide: 'p-vide', 'sans-segment': 'p-partiel' };

function listeFiltree() {
  var q = filtre.trim().toLowerCase();
  var l = OF.formationsTriees();
  if (!q) return l;
  return l.filter(function (f) {
    return (OF.texte(f.intitule) + ' ' + OF.texte(f.code)).toLowerCase().indexOf(q) >= 0;
  });
}

/* Le rail se met à jour sur place. Le reconstruire après chaque
   enregistrement détruisait les boutons entre l'appui et le relâchement de
   la souris : le clic se perdait, la formation ne changeait pas, et la
   saisie suivante partait dans la précédente. C'est l'essentiel de ce qui
   ressemblait à « ça n'enregistre pas ». */
var dernierAffiche = null;

function majItem(b, f) {
  var a = avancement(f);
  var detail = a.etat === 'partiel' ? (a.remplis + '/' + a.attendus) : ETIQUETTES[a.etat];
  b.querySelector('.item-nom').textContent = OF.texte(f.intitule);
  b.querySelector('.item-etat').innerHTML =
    '<span class="pastille ' + PASTILLES[a.etat] + '"></span>' + OF.echappe(detail);
  if (courant === f.id) b.setAttribute('aria-current', 'true');
  else b.removeAttribute('aria-current');
}

function rendreRail() {
  var liste = listeFiltree(), rail = OF.$('rail');
  if (!liste.length) {
    rail.dataset.ids = '';
    rail.innerHTML = '<p class="rail-vide">Aucune formation ne correspond à cette recherche.</p>';
    rendreAvance();
    return;
  }
  var ids = liste.map(function (f) { return f.id; }).join(',');
  if (rail.dataset.ids === ids) {
    var boutons = rail.querySelectorAll('.item');
    for (var i = 0; i < boutons.length && i < liste.length; i++) majItem(boutons[i], liste[i]);
  } else {
    rail.dataset.ids = ids;
    rail.innerHTML = '';
    liste.forEach(function (f) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'item';
      b.setAttribute('role', 'listitem');
      b.dataset.id = f.id;
      b.innerHTML = '<span class="item-nom"></span><span class="item-etat"></span>';
      b.addEventListener('click', function () { ouvrir(f.id); });
      majItem(b, f);
      rail.appendChild(b);
    });
  }
  /* on ne ramène le rail sur la formation ouverte que lorsqu'elle change :
     sinon chaque enregistrement ferait sauter le défilement sous la main */
  if (dernierAffiche !== courant) {
    dernierAffiche = courant;
    var actif = rail.querySelector('[aria-current="true"]');
    if (actif && actif.scrollIntoViewIfNeeded) actif.scrollIntoViewIfNeeded();
  }
  rendreAvance();
}

function rendreAvance() {
  var n = { fait: 0, partiel: 0, vide: 0, 'sans-segment': 0 };
  OF.formationsTriees().forEach(function (f) { n[avancement(f).etat]++; });
  OF.$('avance').innerHTML =
    '<span><span class="pastille p-fait"></span><b>' + n.fait + '</b> complètes</span>'
    + '<span><span class="pastille p-partiel"></span><b>' + (n.partiel + n['sans-segment'])
      + '</b> à compléter</span>'
    + '<span><span class="pastille p-vide"></span><b>' + n.vide + '</b> sans session</span>'
    /* le numéro de version du fichier servi : si le navigateur ressort une
       vieille page de son cache, il se lit ici d'un coup d'œil */
    + '<span class="version" title="Version de fiche.html actuellement servie">'
      + VERSION + '</span>';
}

/* --------------------------------------------------------------- fiche -- */
function ouvrir(id) {
  if (id === courant) return;                // déjà ouverte : ne rien bousculer
  /* Ce qui vient d'être tapé part avant qu'on quitte la fiche : sinon la
     frappe en attente s'enregistrerait dans le vide, et l'on reviendrait
     plus tard sur une formation où « ça n'avait pas été pris ». */
  OF.viderDifferes();
  courant = id;
  curseurGrist = id;
  /* Si la fiche est liée à un widget Formations, on déplace aussi le curseur
     du document : sans cela, Grist nous ramènerait à sa ligne à la première
     occasion, et la formation choisie ici serait perdue. */
  try { if (grist.setCursorPos) grist.setCursorPos({ rowId: id }); } catch (e) { /* non lié */ }
  rendreRail();
  rendreFiche();
  var fiche = OF.$('fiche');
  fiche.scrollTop = 0;                       // on reprend la lecture au début
  var premier = fiche.querySelector('.champ, .saisie');
  if (premier && premier.focus) premier.focus({ preventScroll: true });
}

/* Après chaque enregistrement, Grist renvoie l'enregistrement courant de sa
   source. Sans garde, la fiche sautait à une autre formation à chaque saisie.
   Trois conditions pour qu'un changement de curseur déplace la fiche :
   il désigne bien une formation, il a vraiment changé, et la saisie n'est pas
   en cours ici — on ne déplace pas la fiche sous les doigts. */
function estUneFormation(rec) {
  var f = OF.parId(OF.table('Formations'))[rec.id];
  if (!f) return false;
  /* la source doit porter les colonnes d'une formation, avec les mêmes
     valeurs : un identifiant qui coïncide par hasard ne suffit pas */
  return rec.intitule !== undefined && OF.texte(rec.intitule) === OF.texte(f.intitule);
}

function enSaisie() {
  var a = document.activeElement;
  return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && document.hasFocus();
}

function suivreCurseur(rec) {
  if (!rec || !rec.id) return;
  if (rec.id === curseurGrist) return;        // simple renvoi après enregistrement
  if (courant !== null && enSaisie()) return; // une saisie est en cours ici
  if (!estUneFormation(rec)) { curseurGrist = rec.id; return; }
  ouvrir(rec.id);
}

function voisine(pas) {
  var liste = listeFiltree();
  var i = liste.findIndex(function (f) { return f.id === courant; });
  if (i < 0) { if (liste.length) ouvrir(liste[0].id); return; }
  var j = i + pas;
  if (j >= 0 && j < liste.length) ouvrir(liste[j].id);
}

function formationCourante() {
  return OF.table('Formations').filter(function (x) { return x.id === courant; })[0] || null;
}

/* Les sept sections de la fiche. `manque` dit si la section réclame encore
   une information — c'est ce qui allume le point ocre dans le sommaire. */
var SECTIONS = [
  { id: 'definition', titre: 'Définition', court: 'Définition', rendu: definition,
    manque: function (f) { return !!OF.texte(f.champs_manquants); } },
  { id: 'public', titre: 'Public visé', court: 'Public', rendu: publicVise,
    manque: function (f) { return !segmentsDe(f).length; } },
  { id: 'ressources', titre: 'Ressources mobilisées par session', court: 'Ressources',
    rendu: ressources,
    manque: function (f) { return f.cout_animation_ok === false || f.salles_ok === false; } },
  { id: 'cout', titre: "Coût de revient d'une session", court: 'Coût', rendu: cout,
    manque: function (f) { return !f.cout_total; } },
  { id: 'projections', titre: 'Projections', court: 'Projections', rendu: projections,
    manque: function (f) { return avancement(f).etat === 'partiel'; } },
  { id: 'intra', titre: 'Ventes intra', court: 'Intra', rendu: ventesIntra,
    manque: function () { return false; } },
  { id: 'validation', titre: 'Validation', court: 'Validation', rendu: validation,
    manque: function (f) { return !!OF.texte(f.alerte_validation); } }
];

var observateur = null;

function construireSommaire(nav, f) {
  SECTIONS.forEach(function (s, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.cible = 's-' + s.id;
    b.textContent = s.court;
    if (i === 0) b.setAttribute('aria-current', 'true');
    if (s.manque(f)) {
      var point = document.createElement('span');
      point.className = 'manque';
      point.title = 'Il manque une information dans cette section';
      b.appendChild(point);
    }
    b.addEventListener('click', function () {
      var cible = OF.$(b.dataset.cible);
      if (!cible) return;
      var doux = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      cible.scrollIntoView({ behavior: doux ? 'smooth' : 'auto', block: 'start' });
      marquer(b.dataset.cible);
      var premier = cible.querySelector('.champ, .saisie, .etiq');
      if (premier && premier.focus) premier.focus({ preventScroll: true });
    });
    nav.appendChild(b);
  });
  suivreDefilement();
}

function marquer(idCible) {
  Array.prototype.forEach.call(document.querySelectorAll('.sommaire button'), function (b) {
    if (b.dataset.cible === idCible) b.setAttribute('aria-current', 'true');
    else b.removeAttribute('aria-current');
  });
}

/* Repère la section en cours de lecture : celle dont le haut vient de passer
   sous le sommaire. */
function suivreDefilement() {
  if (observateur) observateur.disconnect();
  var fiche = OF.$('fiche');
  observateur = new IntersectionObserver(function (entrees) {
    var visibles = entrees.filter(function (e) { return e.isIntersecting; });
    if (!visibles.length) return;
    visibles.sort(function (a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
    marquer(visibles[0].target.id);
  }, { root: fiche, rootMargin: '-52px 0px -70% 0px', threshold: 0 });
  SECTIONS.forEach(function (s) {
    var el = OF.$('s-' + s.id);
    if (el) observateur.observe(el);
  });
}

function rendreFiche() {
  var fiche = OF.$('fiche'), f = formationCourante();
  if (!f) {
    fiche.innerHTML = '<div class="vide"><p>Choisissez une formation dans la liste pour la '
      + 'décrire et la projeter.</p><p>La touche <kbd>/</kbd> place le curseur dans la '
      + 'recherche.</p></div>';
    return;
  }
  fiche.innerHTML = '';

  var titre = document.createElement('h1');
  titre.textContent = OF.texte(f.intitule);
  fiche.appendChild(titre);

  var sous = document.createElement('p');
  sous.className = 'sous';
  var bouts = [];
  if (f.duree_h) bouts.push(OF.dec(f.duree_h) + ' heures');
  if (f.nb_jours) bouts.push(OF.dec(f.nb_jours) + ' jours');
  if (f.effectif_max) bouts.push(f.effectif_max + ' places par session');
  sous.textContent = (bouts.length ? bouts.join(', ') : 'Durée et effectif à renseigner')
    + (OF.texte(f.code) ? ' — code ' + f.code : '');
  fiche.appendChild(sous);

  /* ce que le document lui-même juge manquant */
  if (OF.texte(f.champs_manquants)) {
    var al = document.createElement('p');
    al.className = 'alerte-bloc';
    al.textContent = 'Le document signale comme manquant : ' + f.champs_manquants + '.';
    fiche.appendChild(al);
  }

  var sommaire = document.createElement('nav');
  sommaire.className = 'sommaire';
  sommaire.setAttribute('aria-label', 'Sections de la fiche');
  fiche.appendChild(sommaire);

  SECTIONS.forEach(function (s) {
    var section = document.createElement('section');
    section.id = 's-' + s.id;
    var h = document.createElement('h2');
    h.textContent = s.titre;
    section.appendChild(h);
    section.appendChild(s.rendu(f));
    fiche.appendChild(section);
  });
  fiche.appendChild(aide());
  construireSommaire(sommaire, f);
  /* les cellules calculées sont posées vides par le rendu : on les remplit
     tout de suite, sinon elles restent blanches jusqu'au premier
     enregistrement — ce qu'on voyait en changeant de formation */
  rafraichir();
}

function champ(f, colonne, options) {
  options = options || {};
  return OF.editeur({
    table: 'Formations', colonne: colonne, ligne: f,
    libelle: options.libelle, multiligne: options.multiligne,
    manquant: options.manquant, relire: RELIRE,
    apres: options.leger ? rafraichir : rendreTout
  });
}

/* Un champ n'est proposé que si le type de sa colonne est connu : écrire du
   texte dans une colonne de référence abîmerait la donnée. */
function ajouterChamps(zone, f, liste, options) {
  var ignores = [];
  liste.forEach(function (c) {
    if (f[c[0]] === undefined) return;
    if (!OF.typeConnu('Formations', c[0])) { ignores.push(c[1]); return; }
    zone.appendChild(champ(f, c[0], Object.assign({ libelle: c[1] }, options || {},
      { manquant: estManquant(f, c[1]) })));
  });
  return ignores;
}
function estManquant(f, libelle) {
  return OF.texte(f.champs_manquants).toLowerCase().indexOf(libelle.toLowerCase()) >= 0;
}
function noteIgnores(ignores) {
  var p = document.createElement('p');
  p.className = 'note';
  p.style.marginTop = '10px';
  p.textContent = 'Non modifiables ici faute de connaître leur type : ' + ignores.join(', ')
    + '. Elles restent accessibles dans la table Formations.';
  return p;
}

function definition(f) {
  var zone = document.createElement('div');
  if (!OF.doc.metaOk) {
    var al = document.createElement('p');
    al.className = 'alerte-bloc grave';
    al.textContent = 'Les métadonnées de colonnes n\'ont pas pu être lues : la définition reste '
      + 'en lecture seule pour ne pas risquer d\'écrire une valeur du mauvais type. Vérifiez que '
      + 'le widget a l\'accès complet au document.';
    zone.appendChild(al);
    return zone;
  }
  var g = document.createElement('div');
  g.className = 'grille';
  var ignores = ajouterChamps(g, f, [
    ['code', 'Code'], ['intitule', 'Intitulé'], ['domaine', 'Domaine'],
    ['sous_domaine', 'Sous-domaine'], ['typologie', 'Typologie'], ['duree_h', 'Durée en heures'],
    ['effectif_max', 'Effectif maximum'], ['modalite', 'Modalité'], ['mode_vente', 'Mode de vente'],
    ['statut', 'Statut'], ['gestionnaire', 'Gestionnaire'], ['type_salle', 'Type de salle']
  ], { leger: true });
  zone.appendChild(g);

  var large = document.createElement('div');
  large.className = 'grille';
  large.style.gridTemplateColumns = '1fr';
  large.style.marginTop = '14px';
  ignores = ignores.concat(ajouterChamps(large, f, [
    ['contenu', 'Programme, séquences séparées par des points-virgules'],
    ['commentaire', 'Commentaire']
  ], { multiligne: true, leger: true }));
  zone.appendChild(large);
  if (ignores.length) zone.appendChild(noteIgnores(ignores));
  return zone;
}

function publicVise(f) {
  var zone = document.createElement('div');
  if (!OF.doc.metaOk) return zone;
  var g = document.createElement('div');
  g.className = 'grille';
  var ignores = ajouterChamps(g, f, [
    ['segments', 'Segments de marché visés'], ['metiers', 'Métiers concernés'],
    ['enjeux', 'Enjeux'], ['obligations', 'Obligations réglementaires']
  ]);                                   // re-rendu complet : change les colonnes projetées
  zone.appendChild(g);
  if (ignores.length) zone.appendChild(noteIgnores(ignores));
  return zone;
}

/* --------------------------------------------- ressources mobilisées -- */
/* Les deux ressources qui font le coût d'une session : qui anime, et dans
   quelle salle. L'une alimente cout_animation, l'autre les jours-salle et
   la capacité de l'organisme. */
function ressources(f) {
  var zone = document.createElement('div');

  if (f.cout_animation_ok === false || f.salles_ok === false) {
    var al = document.createElement('p');
    al.className = 'alerte-bloc';
    var quoi = [];
    if (f.cout_animation_ok === false) quoi.push('les intervenants');
    if (f.salles_ok === false) quoi.push('les besoins en salles');
    /* « les intervenants » et « les besoins en salles » sont tous deux
       pluriels : l'accord ne dépend pas du nombre d'éléments listés */
    al.textContent = 'Le document considère que ' + quoi.join(' et ')
      + ' ne sont pas complètement décrits : le coût de revient est sous-estimé.';
    zone.appendChild(al);
  }

  var h3a = document.createElement('h3');
  h3a.textContent = 'Qui anime';
  zone.appendChild(h3a);
  if (!OF.optionsRef('Intervenants').length) {
    var vi = document.createElement('p');
    vi.className = 'note';
    vi.textContent = 'La table Intervenants est vide : aucun profil à attacher.';
    zone.appendChild(vi);
  } else {
    zone.appendChild(OF.sousTable({
      table: 'Intervenants_formation',
      lignes: intervenantsDe(f),
      colonnes: [
        { col: 'ressource', libelle: 'Profil', type: 'ref', ref: 'Intervenants' },
        { col: 'nb_heures', libelle: 'Heures par session', type: 'num' },
        { col: 'nb_intervenants', libelle: 'Nombre', type: 'num' },
        { col: 'commentaire', libelle: 'Commentaire', type: 'texte' },
        { col: 'cout', libelle: 'Coût', type: 'calcul', format: OF.eur }
      ],
      nouveau: { formation: f.id, nb_intervenants: 1 },
      relire: RELIRE, apres: rendreTout,
      libelleAjout: 'Ajouter un profil',
      vide: "Sans intervenant décrit, le coût d'animation vaut zéro et la charge de ce "
        + 'profil reste invisible dans le plan de charge.'
    }));
  }

  var h3b = document.createElement('h3');
  h3b.textContent = 'Dans quelle salle';
  zone.appendChild(h3b);
  if (OF.texte(f.modalite) === 'E-learning' || OF.texte(f.modalite) === 'Distanciel') {
    var nd = document.createElement('p');
    nd.className = 'note';
    nd.textContent = 'Formation à distance : aucun besoin de salle.';
    zone.appendChild(nd);
  } else if (!OF.optionsRef('Types_salles').length) {
    var vs = document.createElement('p');
    vs.className = 'note';
    vs.textContent = 'La table Types_salles est vide : aucun type de salle à attacher.';
    zone.appendChild(vs);
  } else {
    zone.appendChild(OF.sousTable({
      table: 'Besoins_salles',
      lignes: OF.table('Besoins_salles').filter(function (b) { return b.formation === f.id; }),
      colonnes: [
        { col: 'type_salle', libelle: 'Type de salle', type: 'ref', ref: 'Types_salles' },
        { col: 'nb_salles', libelle: 'Salles', type: 'num' },
        /* laissé vide, le document reprend la durée de la formation — encore
           faut-il qu'elle soit renseignée, sinon un « 0 » en filigrane
           laisserait croire à une valeur saisie */
        { col: 'nb_jours', libelle: 'Jours', type: 'num',
          placeholder: f.nb_jours ? OF.dec(f.nb_jours) : '—' },
        { col: 'commentaire', libelle: 'Commentaire', type: 'texte' },
        { col: 'jours_salle_par_session', libelle: 'Jours-salle', type: 'calcul', format: OF.dec }
      ],
      nouveau: { formation: f.id, nb_salles: 1 },
      relire: RELIRE, apres: rendreTout,
      libelleAjout: 'Ajouter une salle',
      vide: 'Sans besoin déclaré, cette formation ne consomme aucun jour de salle dans le '
        + "calcul de capacité de l'organisme. Laisser les jours vides reprend la durée de "
        + 'la formation.'
    }));
  }
  return zone;
}

/* ------------------------------------------------------ coût de revient */
/* Rien n'est calculé ici : toutes ces valeurs sont des colonnes formules de
   la table Formations, affichées pour que la construction du coût soit
   lisible pendant qu'on décrit les ressources. */
function cout(f) {
  var zone = document.createElement('div');
  var lignes = [
    ['Animation', f.cout_animation, 'Les intervenants ci-dessus, à leur taux horaire chargé'],
    ['Support et gestion', f.cout_support,
      'Gestion administrative, logistique, locaux, matériels — au tarif horaire du document'],
    ['Coût total', f.cout_total, 'Pour une session'],
    ['Par jour', f.cout_par_jour, ''],
    ['Par heure', f.cout_par_heure, ''],
    ['Tarif plancher par jour et par apprenant', f.tarif_plancher_jour, 'Session complète'],
    ['Tarif plancher au taux de remplissage de référence', f.tarif_plancher_jour_reel, '']
  ].filter(function (l) { return l[1] !== undefined; });

  if (!lignes.length) {
    zone.innerHTML = '<p class="note">Les colonnes de coût ne sont pas présentes dans la table '
      + 'Formations.</p>';
    return zone;
  }

  var t = document.createElement('table');
  t.className = 'matrice';
  var corps = document.createElement('tbody');
  lignes.forEach(function (l, i) {
    var tr = document.createElement('tr');
    var td = document.createElement('td');
    td.className = 'gauche libelle';
    td.textContent = l[0];
    if (l[0] === 'Coût total') td.style.fontWeight = '600';
    if (l[2]) {
      var s = document.createElement('div');
      s.className = 'second';
      s.textContent = l[2];
      td.appendChild(s);
    }
    tr.appendChild(td);
    var tdv = document.createElement('td');
    tdv.className = 'calcul calcule';
    tdv.style.fontSize = l[0] === 'Coût total' ? '15px' : '';
    if (l[0] === 'Coût total') { tdv.style.fontWeight = '600'; tdv.style.color = 'var(--encre)'; }
    tdv.textContent = (l[1] || l[1] === 0) ? OF.eur(l[1]) : '—';
    tr.appendChild(tdv);
    corps.appendChild(tr);
  });
  t.appendChild(corps);
  zone.appendChild(t);

  var n = document.createElement('p');
  n.className = 'note';
  n.style.marginTop = '12px';
  n.textContent = "C'est un coût direct : les charges indirectes de structure — logistique "
    + 'médicale, prestations hôtelières, informatique, ressources humaines — restent au budget '
    + "global de l'organisme. Le tarif plancher est le prix en dessous duquel une session ne "
    + 'couvre plus son propre coût.';
  zone.appendChild(n);
  return zone;
}

/* --------------------------------------------------------- projections -- */
function projections(f) {
  var zone = document.createElement('div');
  var segs = segmentsAffiches(f), annees = OF.anneesTriees();

  if (!annees.length) {
    zone.innerHTML = '<p class="note">Aucune année dans la table Annees.</p>';
    return zone;
  }
  if (!segs.length) {
    var al = document.createElement('p');
    al.className = 'alerte-bloc';
    al.textContent = 'Aucun segment de marché visé : choisissez-en au moins un plus haut pour '
      + 'pouvoir saisir les places vendues. Le nombre de sessions reste saisissable.';
    zone.appendChild(al);
  }

  var t = document.createElement('table');
  t.className = 'matrice';
  var entete = '<thead><tr><th class="gauche">Année</th><th>Sessions</th><th></th>';
  segs.forEach(function (id) {
    var hors = !estVise(f, id);
    entete += '<th' + (hors ? ' class="hors-cible" title="Segment non visé par cette fiche, '
      + 'mais des ventes y sont saisies"' : '') + '>' + OF.echappe(nomSegment(id))
      + (hors ? ' <span class="pastille p-partiel"></span>' : '') + '</th>';
  });
  entete += '<th class="calcule">Remplissage</th><th>Recette</th><th>Résultat</th></tr></thead>';
  t.innerHTML = entete;

  var corps = document.createElement('tbody');
  var choixLieu = lieux();

  annees.forEach(function (a, iAn) {
    var lignes = projDe(a.id, f.id);
    var sessions = lignes.reduce(function (n, p) { return n + (p.nb_sessions || 0); }, 0);
    var tr = document.createElement('tr');
    tr.dataset.ligne = iAn;
    if (sessions) tr.className = 'remplie';

    var tdAn = document.createElement('td');
    tdAn.className = 'an';
    tdAn.textContent = a.annee;
    tr.appendChild(tdAn);

    if (lignes.length > 1) {
      var tdM = document.createElement('td');
      var inM = document.createElement('input');
      inM.className = 'champ'; inM.value = sessions; inM.disabled = true;
      inM.title = 'Plusieurs lignes de projection pour cette année';
      tdM.appendChild(inM);
      tr.appendChild(tdM);
      /* Signaler le doublon ne suffit pas : il faut pouvoir aller le corriger. */
      var tdD = document.createElement('td');
      var bD = document.createElement('button');
      bD.type = 'button';
      bD.className = 'doublon lien';
      bD.textContent = lignes.length + ' lignes';
      bD.title = 'Cette année porte ' + lignes.length + ' lignes de session : en retirer une '
        + 'pour rendre la saisie directe';
      bD.addEventListener('click', function () {
        detailSessionsOuvert = true;
        var d = OF.$('detail-sessions');
        if (!d) return;
        d.open = true;
        d.scrollIntoView({ block: 'nearest' });
      });
      tdD.appendChild(bD);
      tr.appendChild(tdD);
    } else {
      tr.appendChild(cellSessions(f, a, iAn, sessions));
      var tdL = document.createElement('td');
      var bL = document.createElement('button');
      bL.type = 'button'; bL.className = 'lieu';
      bL.textContent = (lignes.length === 1 && OF.texte(lignes[0].localisation)) || choixLieu[0];
      bL.addEventListener('click', function () {
        var i = choixLieu.indexOf(bL.textContent.trim());
        var suivant = choixLieu[(i + 1) % choixLieu.length];
        bL.textContent = suivant;
        var l = projDe(a.id, f.id);
        ecrireSessions(a.id, f, l.length === 1 ? (l[0].nb_sessions || 0) : 0, suivant);
      });
      tdL.appendChild(bL);
      tr.appendChild(tdL);
    }

    segs.forEach(function (idSeg, iSeg) {
      tr.appendChild(cellPlaces(f, a, idSeg, iAn, iSeg + 1, sessions));
    });

    ['remplissage', 'recette', 'resultat'].forEach(function (quoi) {
      var td = document.createElement('td');
      td.className = 'calcul' + (quoi === 'remplissage' ? ' calcule' : '');
      td.dataset.calc = quoi;
      tr.appendChild(td);
    });
    corps.appendChild(tr);
  });
  t.appendChild(corps);
  zone.appendChild(t);
  zone.appendChild(noteUnites(f, segs));
  zone.appendChild(detailProjections(f));
  zone.appendChild(detailVentes(f, annees));
  zone.appendChild(outilsReprise(f, annees));
  zone.appendChild(bilan(f));
  return zone;
}

/* Toutes les lignes de vente inter de la formation, modifiables. La grille
   au-dessus ne montre qu'une case par segment et par année : dès qu'une année
   en porte deux, ou une ligne sur un segment que la formation ne vise plus,
   la case ne peut pas la montrer. Ici si, et on peut la corriger.

   Les ventes intra ont leur propre section plus bas : elles n'entrent pas
   dans la recette des projections, qui ne compte que l'inter. */
var detailOuvert = false, detailSessionsOuvert = false;

/* Les lignes de session, modifiables elles aussi. La grille n'a qu'une case
   par année : quand une année en porte deux — ce qui arrive — elle ne peut
   que le signaler. C'est ici qu'on en retire une. */
function detailProjections(f) {
  var d = document.createElement('details');
  d.className = 'chiffres';
  d.id = 'detail-sessions';
  d.style.marginTop = '14px';
  d.open = detailSessionsOuvert;
  d.addEventListener('toggle', function () { detailSessionsOuvert = d.open; });

  var rang = OF.parId(OF.table('Annees'));
  var lignes = OF.table('Projections')
    .filter(function (p) { return p.formation === f.id; })
    .sort(function (x, y) {
      return ((rang[x.annee] && rang[x.annee].annee) || 0)
        - ((rang[y.annee] && rang[y.annee].annee) || 0);
    });

  /* une année qui porte plus d'une ligne, c'est ce qu'on vient corriger ici */
  var parAnnee = {};
  lignes.forEach(function (p) { parAnnee[p.annee] = (parAnnee[p.annee] || 0) + 1; });
  var doubles = Object.keys(parAnnee).filter(function (k) { return parAnnee[k] > 1; }).length;

  var s = document.createElement('summary');
  s.textContent = 'Le détail des ' + OF.plur(lignes.length, 'ligne') + ' de session'
    + (doubles ? ' — ' + OF.plur(doubles, 'année') + ' en double' : '');
  if (doubles) s.classList.add('alerte-texte');
  d.appendChild(s);

  var colonnes = [
    { col: 'annee', libelle: 'Année', type: 'ref', ref: 'Annees' },
    { col: 'nb_sessions', libelle: 'Sessions', type: 'num' },
    { col: 'localisation', libelle: 'Lieu', type: 'choice' },
    { col: 'commentaire', libelle: 'Commentaire', type: 'texte', large: true }
  ];
  [['places', 'Places', OF.ent], ['recette', 'Recette', OF.eur],
   ['resultat', 'Résultat', OF.eur], ['alerte_tarif', 'Ce que dit le document', OF.texte]
  ].forEach(function (c) {
    if (colExiste('Projections', c[0])) {
      colonnes.push({ col: c[0], libelle: c[1], type: 'calcul', format: c[2] });
    }
  });

  var cadre = document.createElement('div');
  cadre.className = 'defilant';
  cadre.appendChild(OF.sousTable({
    table: 'Projections',
    lignes: lignes,
    colonnes: colonnes,
    nouveau: { formation: f.id },
    relire: RELIRE,
    apres: rendreTout,
    libelleAjout: 'Ajouter une ligne de session',
    vide: 'Aucune ligne de session pour cette formation.'
  }));
  d.appendChild(cadre);

  var n = document.createElement('p');
  n.className = 'note';
  n.style.marginTop = '10px';
  n.textContent = doubles
    ? 'Deux lignes sur la même année additionnent leurs sessions, et la case de la grille '
      + 'passe en lecture seule pour ne pas écrire dans l\'une au hasard. Retirer celle de '
      + 'trop rend la saisie directe.'
    : 'Une ligne par année suffit. La grille au-dessus écrit directement dedans ; ce tableau '
      + 'sert à corriger les doublons et à supprimer une année devenue inutile.';
  d.appendChild(n);
  return d;
}

function detailVentes(f, annees) {
  var d = document.createElement('details');
  d.className = 'chiffres';
  d.style.marginTop = '14px';
  d.open = detailOuvert;
  d.addEventListener('toggle', function () { detailOuvert = d.open; });

  var rang = OF.parId(OF.table('Annees'));
  var lignes = OF.table('Ventes_inter')
    .filter(function (v) { return v.formation === f.id; })
    .sort(function (x, y) {
      var ax = (rang[x.annee] && rang[x.annee].annee) || 0;
      var ay = (rang[y.annee] && rang[y.annee].annee) || 0;
      return ax - ay || OF.texte(nomSegment(x.segment))
        .localeCompare(OF.texte(nomSegment(y.segment)), 'fr');
    });

  var s = document.createElement('summary');
  s.textContent = lignes.length
    ? 'Le détail des ' + OF.plur(lignes.length, 'ligne') + ' de vente inter'
    : 'Le détail des lignes de vente inter';
  d.appendChild(s);

  var colonnes = [
    { col: 'annee', libelle: 'Année', type: 'ref', ref: 'Annees' },
    { col: 'segment', libelle: 'Segment', type: 'ref', ref: 'Segments' },
    { col: 'base', libelle: 'Base de facturation', type: 'choice' },
    { col: 'categorie', libelle: 'Tarif', type: 'ref', ref: 'Categories_tarifaires' },
    { col: 'nb_places', libelle: 'Places', type: 'num' },
    { col: 'nb_groupes', libelle: 'Groupes', type: 'num' }
  ];
  if (colExiste('Ventes_inter', 'participants_par_groupe')) {
    colonnes.push({ col: 'participants_par_groupe', libelle: 'Par groupe', type: 'num' });
  }
  if (colExiste('Ventes_inter', 'places')) {
    colonnes.push({ col: 'places', libelle: 'Places occupées', type: 'calcul', format: OF.ent });
  }
  colonnes.push({ col: 'recette', libelle: 'Recette', type: 'calcul', format: OF.eur });
  if (colExiste('Ventes_inter', 'alerte')) {
    colonnes.push({ col: 'alerte', libelle: 'Ce que dit le document', type: 'calcul',
      format: OF.texte });
  }

  var cadre = document.createElement('div');
  cadre.className = 'defilant';
  cadre.appendChild(OF.sousTable({
    table: 'Ventes_inter',
    lignes: lignes,
    colonnes: colonnes,
    nouveau: { formation: f.id },
    relire: RELIRE,
    apres: rendreTout,
    libelleAjout: 'Ajouter une ligne de vente',
    vide: 'Aucune ligne de vente inter pour cette formation.'
  }));
  d.appendChild(cadre);

  var n = document.createElement('p');
  n.className = 'note';
  n.style.marginTop = '10px';
  n.textContent = 'Deux années qui portent les mêmes nombres dans la grille mais pas la même '
    + 'recette ont forcément une ligne de plus, un autre tarif ou une autre base : elle est '
    + 'dans ce tableau. « Retirer » demande confirmation avant de supprimer la ligne.';
  d.appendChild(n);
  return d;
}

/* Ce que disent les pastilles, et ce qu'il manque dans le document pour
   pouvoir vendre en groupes. */
function noteUnites(f, segs) {
  var p = document.createElement('p');
  p.className = 'note';
  p.style.margin = '10px 0 0';
  var bases = basesVente();
  var plusieursTarifs = segs.some(function (id) { return categoriesDe(id).length > 1; });

  if (bases.length > 1) {
    p.innerHTML = 'Sous chaque nombre, <b>pl.</b> ou <b>gr.</b> dit s\'il compte des places '
      + 'ouvertes ou des groupes — un clic change la base de facturation. Les ventes au '
      + 'groupe, comme celles du CHU, se comptent en groupes au tarif groupe. Le nombre déjà '
      + 'saisi suit le changement d\'unité et le widget le signale : trois places ne font pas '
      + 'trois groupes, c\'est à vérifier.'
      + (segs.some(function (id) { return !estVise(f, id); })
        ? ' Une colonne marquée d\'un point ocre porte des ventes sur un segment que la fiche '
          + 'ne vise plus : elles comptent toujours dans la recette, elles sont donc montrées.'
        : '')
      + (plusieursTarifs ? ' La seconde pastille est la catégorie tarifaire, quand le segment '
        + 'en autorise plusieurs : c\'est elle qui pose le prix.' : '');
  } else if (!baseEstUneListe()) {
    p.innerHTML = 'Les nombres comptent des places ouvertes. La colonne <b>base</b> de la table '
      + 'Ventes_inter n\'est pas une liste de choix : cet écran ne la manipule pas, elle se '
      + 'règle dans la table.';
  } else {
    p.innerHTML = 'Les nombres comptent des places ouvertes. Pour vendre en groupes, la colonne '
      + '<b>base</b> de la table Ventes_inter doit proposer un tarif au groupe : les choix de '
      + 'cette colonne sont ce que cet écran propose, il n\'en invente pas.';
  }
  return p;
}

function cellSessions(f, a, iAn, sessions) {
  var td = document.createElement('td');
  var el = document.createElement('input');
  el.className = 'champ';
  el.inputMode = 'numeric';
  el.placeholder = '—';
  el.value = sessions || '';
  el.dataset.role = 'sessions';
  el.dataset.ligne = iAn;
  el.dataset.col = 0;
  el.setAttribute('aria-label', 'Sessions en ' + a.annee);
  brancherCellule(el, function (v) { return ecrireSessions(a.id, f, v); });
  td.appendChild(el);
  return td;
}

function cellPlaces(f, a, idSeg, iAn, iCol, sessions) {
  var td = document.createElement('td');
  var toutes = ventesDe(a.id, f.id, idSeg);
  var v = toutes[0] || null;

  var rangee = document.createElement('div');
  rangee.className = 'quantite';

  /* on ne réclame une valeur que sur les segments que la fiche vise */
  var attendu = sessions && estVise(f, idSeg);
  var el = document.createElement('input');
  el.className = 'champ' + (attendu && !quantite(v) ? ' vide-attendu' : '');
  el.inputMode = 'numeric';
  el.placeholder = '—';
  el.value = quantite(v) || '';
  el.dataset.role = 'places';
  el.dataset.attendu = attendu ? '1' : '';
  el.dataset.segment = idSeg;
  el.dataset.ligne = iAn;
  el.dataset.col = iCol;
  el.setAttribute('aria-label', 'Places ou groupes ' + nomSegment(idSeg) + ' en ' + a.annee);
  if (toutes.length > 1) {
    el.disabled = true;
    el.title = toutes.length + ' lignes de vente sur ce segment : à corriger dans la table';
  } else {
    brancherCellule(el, function (val) { return ecrireQuantite(a.id, f, idSeg, val); });
  }
  rangee.appendChild(el);

  /* « 1 groupe de 8 » : le nombre de groupes, puis leur taille. Le second
     champ n'apparaît que sur les lignes facturées au groupe, et seulement si
     le document sait où ranger la réponse. */
  if (v && estGroupe(v.base) && colExiste('Ventes_inter', 'participants_par_groupe')) {
    var fois = document.createElement('span');
    fois.className = 'fois';
    fois.textContent = '×';
    rangee.appendChild(fois);

    var t = document.createElement('input');
    t.className = 'champ taille';
    t.inputMode = 'numeric';
    t.dataset.role = 'taille';
    t.dataset.segment = idSeg;
    t.dataset.ligne = iAn;          /* sans quoi toutes les années partagent une clé */
    t.placeholder = f.effectif_max || '—';
    t.title = 'Participants par groupe. Laissé vide, le groupe prend l\'effectif maximum de '
      + 'la formation' + (f.effectif_max ? ' (' + OF.ent(f.effectif_max) + ')' : '') + '.';
    t.value = v.participants_par_groupe || '';
    t.setAttribute('aria-label', 'Participants par groupe, ' + nomSegment(idSeg)
      + ' en ' + a.annee);
    brancherCellule(t, function (val) {
      return OF.appliquer([['UpdateRecord', 'Ventes_inter', v.id,
        { participants_par_groupe: val || null }]], RELIRE, rafraichir);
    });
    rangee.appendChild(t);
  }
  td.appendChild(rangee);

  var unites = unitesVente(f, a, idSeg);
  if (unites) td.appendChild(unites);

  var ennui = document.createElement('div');
  ennui.className = 'ennui';
  ennui.dataset.segment = idSeg;
  poserEnnui(ennui, toutes);
  td.appendChild(ennui);
  return td;
}

/* Ce que le document reproche à la ligne : sa propre colonne `alerte`, que
   personne ne lisait, et le cas des lignes en double. */
function poserEnnui(el, toutes) {
  var texte = '';
  if (toutes.length > 1) {
    texte = OF.plur(toutes.length, 'ligne') + ' sur ce segment';
  } else if (toutes.length === 1 && OF.texte(toutes[0].alerte)) {
    texte = OF.texte(toutes[0].alerte);
  }
  el.textContent = texte ? (texte.length > 26 ? texte.slice(0, 25) + '…' : texte) : '';
  el.title = texte;
  el.style.display = texte ? '' : 'none';
}

/* Sous le nombre : ce qu'il compte, et à quel tarif. Deux pastilles qui
   défilent au clic — rien n'est proposé que le document n'autorise. */
function unitesVente(f, a, idSeg) {
  var zone = document.createElement('div');
  zone.className = 'unites';
  var bases = basesVente();
  var cats = categoriesDe(idSeg);

  if (bases.length > 1) {
    var bB = document.createElement('button');
    bB.type = 'button';
    bB.dataset.chip = 'base';
    bB.dataset.segment = idSeg;
    poserBase(bB, venteDe(a.id, f.id, idSeg));
    bB.addEventListener('click', function () {
      var v = venteDe(a.id, f.id, idSeg);
      var i = bases.indexOf((v && OF.texte(v.base)) || '');
      changerBase(f, a, idSeg, bases[(i + 1) % bases.length]);
    });
    zone.appendChild(bB);
  }

  if (cats.length > 1) {
    var bC = document.createElement('button');
    bC.type = 'button';
    bC.dataset.chip = 'categorie';
    bC.dataset.segment = idSeg;
    poserCategorie(bC, venteDe(a.id, f.id, idSeg));
    bC.addEventListener('click', function () {
      var v = venteDe(a.id, f.id, idSeg);
      var i = cats.indexOf(v && v.categorie);
      changerCategorie(f, a, idSeg, cats[(i + 1) % cats.length]);
    });
    zone.appendChild(bC);
  }
  return zone.children.length ? zone : null;
}

function poserBase(b, v) {
  var base = (v && OF.texte(v.base)) || '';
  b.textContent = base ? uniteCourte(base) : 'pl.';
  b.title = base
    ? 'Facturé en « ' + base +' » — cliquer pour changer de base'
    : 'Base de facturation non posée — cliquer pour en choisir une';
  b.className = 'unite' + (estGroupe(base) ? ' groupe' : '') + (v ? '' : ' absent');
}

/* On affiche la catégorie qui tarife vraiment la ligne — `categorie_appliquee`
   quand le document la calcule — et non le seul choix explicite : sinon une
   ligne correctement tarifée par le défaut du segment s'affichait « tarif ? ». */
function poserCategorie(b, v) {
  var explicite = v && v.categorie;
  var appliquee = (v && v.categorie_appliquee) || explicite;
  b.textContent = appliquee ? nomCategorie(appliquee) : 'tarif ?';
  b.title = appliquee
    ? 'Catégorie tarifaire : ' + nomCategorie(appliquee)
      + (explicite ? '' : ', héritée du segment') + ' — cliquer pour changer'
    : 'Aucune catégorie tarifaire — cliquer pour en choisir une';
  b.className = 'unite' + (appliquee ? (explicite ? '' : ' herite') : ' absent');
}

/* La clé identifie la case de façon unique dans tout le document : formation,
   année, segment, rôle. Sans la formation ni l'année, deux cases de même
   position se partageaient la même clé et la seconde frappe annulait
   l'enregistrement de la première — en changeant de formation, la saisie
   précédente disparaissait. */
function brancherCellule(el, ecrire) {
  var origine = el.value;
  var cle = [courant, el.dataset.role, el.dataset.ligne || '',
    el.dataset.segment || ''].join(':');
  var enregistrer = function () {
    var v = el.value.trim() === '' ? 0 : Math.round(OF.nombre(el.value));
    if (v < 0) {
      el.classList.add('erreur');
      OF.signaler('Un nombre négatif n\'a pas de sens ici', true);
      return;
    }
    ecrire(v).then(function () {
      /* la case s'éclaire une seconde : l'enregistrement se voit là où l'œil
         est posé, et pas seulement dans un coin de l'écran */
      el.classList.remove('enregistre');
      void el.offsetWidth;                   // pour rejouer l'animation
      el.classList.add('enregistre');
    }).catch(function () { el.classList.add('erreur'); });
  };
  el.addEventListener('input', function () {
    el.classList.remove('erreur');
    el.classList.remove('enregistre');
    OF.differer(cle, enregistrer);
  });
  el.addEventListener('blur', function () { if (OF.forcer(cle)) enregistrer(); });
  el.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { el.value = origine; el.blur(); return; }
    if (ev.key === 'ArrowDown' || ev.key === 'Enter') { ev.preventDefault(); deplacer(el, 1); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); deplacer(el, -1); }
  });
}

function deplacer(el, pas) {
  var cible = OF.$('fiche').querySelector(
    '.champ[data-ligne="' + (+el.dataset.ligne + pas) + '"][data-col="' + el.dataset.col + '"]');
  if (cible) { cible.focus(); cible.select(); } else el.blur();
}

function outilsReprise(f, annees) {
  var zone = document.createElement('div');
  zone.className = 'outils';
  zone.innerHTML = '<span>Reprendre</span>';
  var sel = document.createElement('select');
  sel.className = 'lieu';
  sel.setAttribute('aria-label', 'Année à reprendre');
  annees.forEach(function (a) { sel.appendChild(new Option(a.annee, a.id)); });
  zone.appendChild(sel);
  var t1 = document.createElement('span');
  t1.textContent = 'sur les années suivantes, en multipliant par';
  zone.appendChild(t1);
  var coef = document.createElement('input');
  coef.className = 'coef'; coef.value = '1'; coef.inputMode = 'decimal';
  coef.setAttribute('aria-label', 'Coefficient par an');
  zone.appendChild(coef);
  var t2 = document.createElement('span');
  t2.textContent = 'chaque année';
  zone.appendChild(t2);

  var b = document.createElement('button');
  b.type = 'button'; b.className = 'outil'; b.textContent = 'Reprendre';
  var arme = false, minuteur = null;
  var desarmer = function () {
    arme = false; clearTimeout(minuteur);
    b.textContent = 'Reprendre'; b.classList.remove('attention');
  };
  b.addEventListener('click', function () {
    var c = OF.nombre(coef.value) || 1;
    if (c <= 0) { OF.signaler('Le coefficient doit être supérieur à zéro', true); return; }
    var ecrases = compterEcrasements(f, +sel.value);
    if (ecrases && !arme) {            // on ne remplace jamais une saisie sans le dire
      arme = true;
      b.textContent = 'Confirmer : ' + OF.plur(ecrases, 'valeur') + ' '
        + OF.accord(ecrases, 'remplacée', 'remplacées');
      b.classList.add('attention');
      minuteur = setTimeout(desarmer, 6000);
      return;
    }
    desarmer();
    reprendre(f, +sel.value, c);
  });
  sel.addEventListener('change', desarmer);
  coef.addEventListener('input', desarmer);
  zone.appendChild(b);
  return zone;
}

function bilan(f) {
  var dl = document.createElement('dl');
  dl.className = 'bilan';
  [['tot-sessions', 'Sessions, toutes années'], ['tot-recette', 'Recettes'],
   ['tot-resultat', 'Résultat'], ['tot-cout', 'Coût d\'une session']
  ].forEach(function (c) {

    dt.textContent = c[1];
    var dd = document.createElement('dd');
    dd.id = c[0];
    d.appendChild(dt);
    d.appendChild(dd);
    dl.appendChild(d);

function aide() {
  var p = document.createElement('p');
  p.className = 'aide';
  p.innerHTML = '<kbd>↑</kbd> <kbd>↓</kbd> passent d\'une année à l\'autre dans la même colonne, '
    + '<kbd>Entrée</kbd> descend d\'une ligne, <kbd>Échap</kbd> annule la frappe en cours. '
    + '<kbd>Alt</kbd> + <kbd>←</kbd> <kbd>→</kbd> changent de formation, <kbd>/</kbd> va à la '
    + 'recherche. Remplissage, recette, résultat et coût sont ceux que calcule le document : '
    + 'ils arrivent après l\'enregistrement, et non pendant la frappe.';

}

/* -------------------------------------------------------- ventes intra -- */
/* Une vente intra est un groupe vendu à un établissement : elle porte son
   année, son segment et son nombre de sessions, indépendamment du calendrier
   inter. D'où une liste de lignes plutôt qu'une matrice. */
function ventesIntra(f) {
  var zone = document.createElement('div');
  var lignes = OF.table('Ventes_intra').filter(function (v) { return v.formation === f.id; })
    .sort(function (a, b) {
      var aa = OF.parId(OF.table('Annees'))[a.annee], bb = OF.parId(OF.table('Annees'))[b.annee];
      return ((aa && aa.annee) || 0) - ((bb && bb.annee) || 0);
    });

  var colonnes = [
    { col: 'annee', libelle: 'Année', type: 'ref', ref: 'Annees' },
    { col: 'segment', libelle: 'Segment', type: 'ref', ref: 'Segments' },
    { col: 'nb_sessions', libelle: 'Sessions', type: 'num' },
    { col: 'participants_par_session', libelle: 'Participants', type: 'num' }
  ];
  if (OF.table('Ventes_intra').some(function (v) { return v.localisation !== undefined; })) {
    colonnes.push({ col: 'localisation', libelle: 'Lieu', type: 'choice' });
  }
  if (OF.optionsRef('Categories_tarifaires').length) {
    colonnes.push({ col: 'categorie', libelle: 'Catégorie', type: 'ref',
      ref: 'Categories_tarifaires' });
  }
  colonnes.push({ col: 'recette', libelle: 'Recette', type: 'calcul', format: OF.eur });

  var pilotee = OF.anneePilotee();
  zone.appendChild(OF.sousTable({
    table: 'Ventes_intra',
    lignes: lignes,
    colonnes: colonnes,
    nouveau: { formation: f.id, annee: pilotee ? pilotee.id : null, nb_sessions: 1 },
    relire: RELIRE, apres: rendreTout,
    libelleAjout: 'Ajouter une vente intra',
    vide: "Aucun groupe vendu en intra pour cette formation. L'intra se compte en sessions "
      + "vendues à un établissement, pas en places ouvertes."
  }));
  return zone;
}

/* --------------------------------------------------------- validation -- */
/* Deux états que le document connaît déjà, et qu'il vaut mieux poser ici,
   au moment où l'on vient de relire la fiche, qu'en retournant dans la table. */
function validation(f) {
  var zone = document.createElement('div');
  if (!OF.doc.metaOk) return zone;

  var etat = document.createElement('p');
  etat.className = 'note';
  var parts = [];
  if (OF.texte(f.etat_fiche)) parts.push('Définition : ' + f.etat_fiche.toLowerCase());
  if (OF.texte(f.etat_projections)) parts.push('projections : ' + f.etat_projections.toLowerCase());
  if (f.taux_completude || f.taux_completude === 0) {
    parts.push('complétude ' + Math.round(100 * f.taux_completude) + ' %');
  }
  etat.textContent = parts.length ? ('Où en est cette fiche — ' + parts.join(', ') + '.') : '';
  if (parts.length) zone.appendChild(etat);

  if (OF.texte(f.alerte_validation)) {
    var al = document.createElement('p');
    al.className = 'alerte-bloc';
    al.textContent = f.alerte_validation;
    zone.appendChild(al);
  }

  var g = document.createElement('div');
  g.className = 'grille';
  var ignores = ajouterChamps(g, f, [
    ['validation_definition', 'Validation de la définition'],
    ['validation_projections', 'Validation des projections']
  ]);
  zone.appendChild(g);

  var large = document.createElement('div');
  large.className = 'grille';
  large.style.gridTemplateColumns = '1fr';
  large.style.marginTop = '14px';
  ignores = ignores.concat(ajouterChamps(large, f, [
    ['remarque_validation', 'Remarque de validation']
  ], { multiligne: true, leger: true }));
  zone.appendChild(large);
  if (ignores.length) zone.appendChild(noteIgnores(ignores));
  return zone;
}

/* ----------------------------------------- rafraîchissement sans re-rendu */
function rafraichir() {
  var f = formationCourante();
  if (!f) return;
  var fiche = OF.$('fiche'), segs = segmentsAffiches(f), actif = document.activeElement;

  OF.anneesTriees().forEach(function (a, iAn) {
    var tr = fiche.querySelector('tr[data-ligne="' + iAn + '"]');
    if (!tr) return;
    var lignes = projDe(a.id, f.id);
    var sessions = lignes.reduce(function (n, p) { return n + (p.nb_sessions || 0); }, 0);
    var recette = lignes.reduce(function (n, p) { return n + (p.recette || 0); }, 0);
    var resultat = lignes.reduce(function (n, p) { return n + (p.resultat || 0); }, 0);
    var capacite = sessions * (f.effectif_max || 0), places = 0;

    tr.classList.toggle('remplie', !!sessions);
    var chS = tr.querySelector('.champ[data-role="sessions"]');
    if (chS && chS !== actif && !chS.disabled) chS.value = sessions || '';

    segs.forEach(function (idSeg) {
      var toutes = ventesDe(a.id, f.id, idSeg);
      var v = toutes[0] || null;
      places += (v && (v.places || v.nb_places)) || 0;
      var chB = tr.querySelector('[data-chip="base"][data-segment="' + idSeg + '"]');
      if (chB) poserBase(chB, v);
      var chC = tr.querySelector('[data-chip="categorie"][data-segment="' + idSeg + '"]');
      if (chC) poserCategorie(chC, v);
      var en = tr.querySelector('.ennui[data-segment="' + idSeg + '"]');
      if (en) poserEnnui(en, toutes);
      var t = tr.querySelector('.taille[data-segment="' + idSeg + '"]');
      if (t && t !== actif) t.value = (v && v.participants_par_groupe) || '';
      var ch = tr.querySelector('.champ[data-role="places"][data-segment="' + idSeg + '"]');
      if (!ch) return;
      if (ch !== actif) ch.value = quantite(v) || '';
      ch.classList.toggle('vide-attendu', !!sessions && !!ch.dataset.attendu && !ch.value);
    });

    /* Le remplissage se mesure en places occupées : un groupe en apporte
       plusieurs. C'est le document qui sait combien — on lit sa colonne
       plutôt que d'additionner nous-mêmes des unités différentes. */
    if (lignes.some(function (p) { return p.places !== undefined; })) {
      places = lignes.reduce(function (n, p) { return n + (p.places || 0); }, 0);
    }

    var poser = function (quoi, valeur, classe) {
      var td = tr.querySelector('[data-calc="' + quoi + '"]');
      if (!td) return;
      td.textContent = valeur;
      td.className = 'calcul' + (quoi === 'remplissage' ? ' calcule' : '') + (classe ? ' ' + classe : '');
    };
    poser('remplissage', capacite ? OF.pourcent(places, capacite) : '—');
    poser('recette', recette ? OF.eur(recette) : '—');
    poser('resultat', resultat ? OF.eur(resultat) : '—',
      resultat > 0 ? 'positif' : (resultat < 0 ? 'negatif' : ''));
  });

  var toutes = OF.table('Projections').filter(function (p) { return p.formation === f.id; });
  var poser = function (id, v, classe) {
    var el = OF.$(id);
    if (!el) return;
    el.textContent = v;
    el.className = classe || '';
  };
  poser('tot-sessions', OF.ent(toutes.reduce(function (n, p) { return n + (p.nb_sessions || 0); }, 0)));
  poser('tot-recette', OF.eur(toutes.reduce(function (n, p) { return n + (p.recette || 0); }, 0)));
  var res = toutes.reduce(function (n, p) { return n + (p.resultat || 0); }, 0);
  poser('tot-resultat', OF.eur(res), res > 0 ? 'positif' : (res < 0 ? 'negatif' : ''));
  var frais = formationCourante();
  poser('tot-cout', frais && frais.cout_total ? OF.eur(frais.cout_total) : '—');

  rendreRail();
}

/* Après une écriture, on reconstruit la fiche — mais on rend sa place au
   lecteur : rien n'est plus désagréable qu'un écran qui remonte en haut
   parce qu'on vient de retirer une ligne tout en bas. */
function rendreTout() {
  var fiche = OF.$('fiche');
  var y = fiche ? fiche.scrollTop : 0;
  rendreFiche();
  rendreRail();
  if (fiche) fiche.scrollTop = y;
}

/* ------------------------------------------------------------- montage -- */
OF.$('recherche').addEventListener('input', function (ev) { filtre = ev.target.value; rendreRail(); });
/* quitter l'onglet, replier la fenêtre : ce qui attend part aussi */
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') OF.viderDifferes();
});
window.addEventListener('pagehide', function () { OF.viderDifferes(); });
OF.$('prec').addEventListener('click', function () { voisine(-1); });
OF.$('suiv').addEventListener('click', function () { voisine(1); });
document.addEventListener('keydown', function (ev) {
  var dansChamp = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (ev.key === '/' && !dansChamp) { ev.preventDefault(); OF.$('recherche').focus(); return; }
  if (ev.altKey && ev.key === 'ArrowLeft') { ev.preventDefault(); voisine(-1); }
  if (ev.altKey && ev.key === 'ArrowRight') { ev.preventDefault(); voisine(1); }
});

function demarrer() {
  if (!OF.anneesTriees().length) { OF.echouer('Aucune année dans la table Annees.'); return; }
  if (!OF.formationsTriees().length) {
    OF.echouer('Aucune formation avec un intitulé dans la table Formations.');
    return;
  }
  rendreRail();
  rendreFiche();
  if (grist.onRecord) {
    grist.onRecord(suivreCurseur);       // suit la sélection si le widget est lié
  }
  rafraichir();
}

if (typeof window.TEST_SANS_DEMARRAGE === 'undefined') OF.initialiser(TABLES, demarrer);
window.__fiche = { ouvrir: ouvrir, demarrer: function () { OF.initialiser(TABLES, demarrer); },
  avancement: avancement, rendreFiche: rendreFiche, rafraichir: rafraichir };
</script>
