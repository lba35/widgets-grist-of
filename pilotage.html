<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilotage — projection pluriannuelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="commun.css?v=35">
<style>
  /* propre au pilotage : la grille de saisie des objectifs */
  .objectifs th.gauche { padding-left: 0; }
  .objectifs td .champ { width: 96px; }
  .objectifs .an { font-size: 15px; }
</style>
</head>
<body>
<div id="app" aria-busy="true">
  <div class="barre">
    <div class="onglets" id="onglets" role="tablist"></div>
    <div class="avance" id="avance"></div>
  </div>
  <div class="corps">
    <div class="page" id="page"><p class="vide">Chargement du document…</p></div>
  </div>
</div>
<div class="etat-sauve" id="sauve" role="status" aria-live="polite"></div>

<script src="commun.js?v=35"></script>
<script src="graphes.js?v=35"></script>
<script>
/* =========================================================================
   Pilotage — les deux tableaux de bord.

   Onglet Recrutement : combien d'intervenants recruter, de quel profil,
   dans quel ordre, et ce qui empêche encore de décider.
   Onglet Projection : la trajectoire pluriannuelle — recettes face aux
   objectifs, résultat, composition par domaine, remplissage — en
   graphiques, en chiffres, et les objectifs à fixer année par année.

   Aucun calcul n'est refait ici : tout vient des colonnes formules du
   document, pour que l'écran et le document ne puissent pas diverger. Les
   objectifs sont la seule chose que cet écran écrit, parce qu'ils ne se
   déduisent de rien : ce sont des décisions.
   ========================================================================= */
'use strict';

/* Affiché dans le bandeau : une page sortie du cache montre l'ancien numéro. */
var VERSION = 'v35';

var TABLES = ['Annees', 'Formations', 'Projections', 'Ventes_inter', 'Ventes_intra',
  'SmartOF_sessions',
  'Parametres', 'Domaines', 'Categories_tarifaires', 'Typologies'];

/* Les objectifs que l'écran sait tenir. Chacun n'apparaît que si la colonne
   de réalisé existe dans la table Annees ; la colonne d'objectif, elle, peut
   être créée depuis l'écran. */
var OBJECTIFS = [
  { col: 'objectif_ca', libelle: 'Recettes', titre: 'Objectif de recettes',
    reel: 'recettes', format: OF.eur },
  { col: 'objectif_resultat', libelle: 'Résultat', titre: 'Objectif de résultat',
    reel: 'resultat', format: OF.eur, signe: true },
  { col: 'objectif_sessions', libelle: 'Sessions', titre: 'Objectif de sessions',
    reel: 'sessions_total', format: OF.ent },
  { col: 'objectif_heures_stagiaires', libelle: 'Heures stagiaires',
    titre: 'Objectif d\'heures stagiaires', reel: 'heures_stagiaires', format: OF.ent }
];

var idAnnee = null, focusARendre = null;
/* 'synthese', ou l'identifiant d'une année */
var vue = 'synthese';

function nom(t, id, defaut) {
  var l = OF.parId(OF.table(t))[id];
  return (l && OF.texte(l.intitule)) || defaut;
}
function parametre(cle) {
  var p = OF.table('Parametres').filter(function (x) { return x.cle === cle; })[0];
  return p ? (p.valeur || 0) : 0;
}
function somme(L, c) { return L.reduce(function (n, v) { return n + (v[c] || 0); }, 0); }

/* Une colonne existe-t-elle ? D'abord les métadonnées, sinon les données. */
function colonneExiste(t, c) {
  var meta = OF.doc.colonnes[t];
  if (meta && Object.keys(meta).length) return !!meta[c];
  return OF.table(t).some(function (l) { return c in l; });
}
function objectifsPossibles() {
  return OBJECTIFS.filter(function (o) { return colonneExiste('Annees', o.reel); });
}
function objectifsTenus() {
  return objectifsPossibles().filter(function (o) { return colonneExiste('Annees', o.col); });
}

/* L'horizon affiché : toutes les années déclarées, fenêtrées à huit pour que
   les graphiques restent lisibles. */
function anneesAffichees() {
  var toutes = OF.anneesTriees();
  if (toutes.length <= 8) return toutes;
  var i = 0;
  toutes.forEach(function (a, k) { if (a.id === idAnnee) i = k; });
  var debut = Math.min(Math.max(0, i - 1), toutes.length - 8);
  return toutes.slice(debut, debut + 8);
}

/* ------------------------------------------------- tuiles et sections --- */
function tuile(libelle, valeur, contexte, classe) {
  var d = document.createElement('div');
  d.className = 'tuile';
  d.innerHTML = '<div class="tuile-lib">' + OF.echappe(libelle) + '</div>'
    + '<div class="tuile-val' + (classe ? ' ' + classe : '') + '">' + OF.echappe(valeur) + '</div>'
    + '<div class="tuile-ctx">' + (contexte || '') + '</div>';
  return d;
}
/* Un intertitre de section : l'écran est long, il lui faut une colonne
   vertébrale visible plutôt qu'une suite de blocs de même poids. */
function section(t, sous) {
  var d = document.createElement('div');
  d.className = 'section-pilotage';
  var h = document.createElement('h2');
  h.textContent = t;
  d.appendChild(h);
  if (sous) {
    var p = document.createElement('p');
    p.className = 'note';
    p.textContent = sous;
    d.appendChild(p);
  }
  return d;
}

function titre(t) {
  var h = document.createElement('h2');
  h.textContent = t;
  return h;
}

/* -------------------------------------------------------- projection --- */
function pageProjection() {
  var zone = document.createElement('div');
  var annees = anneesAffichees();

  var h1 = document.createElement('h1');
  h1.textContent = 'Projection pluriannuelle';
  zone.appendChild(h1);

  if (!annees.length) {
    var v = document.createElement('p');
    v.className = 'alerte-bloc';
    v.textContent = 'Aucune année dans la table Annees : il n\'y a pas encore d\'horizon à projeter.';
    zone.appendChild(v);
    return zone;
  }
  if (!annees.some(function (a) { return a.sessions_total || a.recettes; })) {
    var w = document.createElement('p');
    w.className = 'alerte-bloc';
    w.textContent = 'Aucune session projetée pour l\'instant. La fiche formation permet de saisir '
      + 'les sessions et les places, formation par formation. Les objectifs, en bas de cet écran, '
      + 'peuvent être posés dès maintenant : c\'est à eux que la projection se comparera.';
    zone.appendChild(w);
  }

  /* L'écran raconte quatre choses, dans cet ordre : où en est l'année, où va
     la trajectoire, de quoi elle est faite, et ce qui peut encore bouger. Les
     objectifs ferment la marche : on les pose une fois, on les relit rarement.
     L'ordre précédent mêlait les quatre — chaque bloc était juste, l'ensemble
     ne se lisait pas. */
  bandeauAnnee(zone);

  zone.appendChild(section('La trajectoire',
    'Ce que les projections donnent, année par année, face aux objectifs posés.'));
  grapheRecettes(zone, annees);
  grapheResultat(zone, annees);
  tableauAnnees(zone, annees);

  zone.appendChild(section('De quoi elle est faite',
    'Quels domaines portent la recette, et quelles formations couvrent leurs coûts.'));
  grapheDomaines(zone, annees);
  rentabilite(zone);

  zone.appendChild(section('Ce qui s\'est vraiment vendu',
    'Le réalisé venu de SmartOF, face à la projection : ce qui est engagé, ce qui est '
    + 'facturé, et ce qui reste à facturer.'));
  realiseSection(zone, annees);

  zone.appendChild(section('Pour qui',
    'Ce que portent les formations vendues à l\'extérieur, et ce que portent celles '
    + 'qui ne servent que le CHU.'));
  perimetreSection(zone, annees);

  zone.appendChild(section('Ce qui peut encore bouger',
    'Ce qui est déjà attribué à un segment, ce qui reste à vendre, et ce que '
    + 'donne l\'année si tout ne se vend pas.'));
  grapheAffectation(zone, annees);
  hypotheses(zone, annees);

  zone.appendChild(section('Scénarios',
    'Ce que donnerait une année sans avoir à lui affecter les places une à une : '
    + 'on part d\'une année réelle et on la fait progresser.'));
  scenarios(zone, annees);

  zone.appendChild(section('Ce que l\'on vise',
    'Les objectifs de l\'organisme, saisis ici et comparés plus haut.'));
  editeurObjectifs(zone, annees);

  var note = document.createElement('p');
  note.className = 'aide';
  note.textContent = 'Tous ces chiffres sont lus dans les colonnes calculées du document : '
    + 'ils ne sont pas recalculés ici, et ne peuvent donc pas en diverger. Le résultat est un '
    + 'résultat sur coûts directs — les charges indirectes de structure restent au budget global. '
    + 'Seuls les objectifs sont saisis : ils ne se déduisent de rien.';
  zone.appendChild(note);
  return zone;
}

/* L'année pilotée en quatre ou cinq chiffres, avant tout graphique. */
function bandeauAnnee(zone) {
  var a = OF.parId(OF.table('Annees'))[idAnnee];
  if (!a) return;

  /* La synthèse couvre plusieurs années, mais certaines de ses sections n'en
     montrent qu'une : ce sélecteur dit laquelle. Les onglets, eux, ouvrent
     la page détaillée d'une année. */
  var choix = document.createElement('div');
  choix.className = 'bloc';
  choix.style.maxWidth = '220px';
  choix.style.marginBottom = '14px';
  var lab = document.createElement('label');
  lab.textContent = 'Année détaillée dans cette synthèse';
  lab.htmlFor = 'annee';
  choix.appendChild(lab);
  var sel = document.createElement('select');
  sel.id = 'annee';
  sel.className = 'champ';
  sel.style.width = '100%';
  sel.style.textAlign = 'left';
  sel.innerHTML = OF.anneesTriees().map(function (x) {
    return '<option value="' + x.id + '"' + (x.id === idAnnee ? ' selected' : '') + '>'
      + x.annee + '</option>';
  }).join('');
  sel.addEventListener('change', function (ev) { idAnnee = +ev.target.value; rendre(); });
  choix.appendChild(sel);
  zone.appendChild(choix);

  var t = document.createElement('div');
  t.className = 'tuiles';

  var ecart = a.objectif_ca ? (a.recettes || 0) - a.objectif_ca : null;
  t.appendChild(tuile('Recettes ' + a.annee, OF.eur(a.recettes || 0),
    ecart === null
      ? '<span>objectif non fixé</span>'
      : '<span class="' + (ecart >= 0 ? 'positif' : 'negatif') + '">'
        + (ecart >= 0 ? '+' : '') + OF.eur(ecart) + '</span> sur ' + OF.eur(a.objectif_ca)));

  t.appendChild(tuile('Résultat', OF.eur(a.resultat || 0),
    a.recettes ? Math.round(100 * (a.resultat || 0) / a.recettes) + ' % de marge'
      : 'pas de recettes projetées',
    (a.resultat || 0) < 0 ? 'negatif' : 'positif'));

  t.appendChild(tuile('Sessions', OF.ent(a.sessions_total || 0),
    OF.ent(a.sessions_inter || 0) + ' inter · ' + OF.ent(a.sessions_intra || 0) + ' intra'));

  t.appendChild(tuile('Remplissage inter',
    a.remplissage_inter ? Math.round(100 * a.remplissage_inter) + ' %' : '—',
    OF.plur(a.places || 0, 'place') + ' ' + OF.accord(a.places || 0, 'projetée', 'projetées')));

  zone.appendChild(t);
}

/* ------------------------------------------- hypothèses de réalisation */
/* Les places sont affectées aux segments comme si tout se vendait : la
   projection n'est donc pas une prévision de remplissage, c'est un plafond.
   Le levier utile n'est pas « quelle part de la capacité sera remplie » mais
   « quelle part de ce que j'ai projeté se concrétisera ».

   Et tout ne se concrétise pas de la même façon :
   - une vente inter à la place reste à vendre, place par place : elle varie ;
   - une vente inter au groupe est un engagement pris sur un groupe entier ;
   - une vente intra est un groupe vendu à un établissement ;
   - le coût est engagé par les sessions ouvertes, il ne varie jamais.
   Appliquer le taux au ferme ferait douter d'engagements déjà pris. */
function assiette(idA) {
  var formations = OF.parId(OF.table('Formations'));
  var proj = OF.table('Projections').filter(function (p) { return p.annee === idA; });
  var intra = OF.table('Ventes_intra').filter(function (v) { return v.annee === idA; });

  var ouvertes = proj.reduce(function (n, p) {
    var f = formations[p.formation];
    return n + (p.capacite || (p.nb_sessions || 0) * ((f && f.effectif_max) || 0));
  }, 0);

  var aVendre = { places: 0, recette: 0 };       // inter à la place : varie
  var ferme = { places: 0, recette: 0 };          // groupes inter et intra : engagé
  OF.table('Ventes_inter').forEach(function (v) {
    if (v.annee !== idA) return;
    var cible = /groupe/i.test(OF.texte(v.base)) ? ferme : aVendre;
    cible.places += (v.places || v.nb_places || 0);
    cible.recette += v.recette || 0;
  });
  var intraPlaces = 0, intraRecette = 0;
  intra.forEach(function (v) {
    intraPlaces += v.places || 0;
    intraRecette += v.recette || 0;
  });
  ferme.places += intraPlaces;
  ferme.recette += intraRecette;

  var cout = proj.reduce(function (n, p) { return n + (p.cout || 0); }, 0)
    + intra.reduce(function (n, v) { return n + (v.cout || 0); }, 0);

  return {
    ouvertes: ouvertes, aVendre: aVendre, ferme: ferme, cout: cout,
    intraPlaces: intraPlaces, intraRecette: intraRecette,
    projetees: aVendre.places + ferme.places,
    recette: aVendre.recette + ferme.recette
  };
}

/* À taux t, seule la part « à vendre » se réduit. Le reste est engagé. */
function auTaux(a, taux) {
  return {
    taux: taux,
    places: Math.round(a.ferme.places + a.aVendre.places * taux),
    recette: a.ferme.recette + a.aVendre.recette * taux,
    resultat: a.ferme.recette + a.aVendre.recette * taux - a.cout
  };
}

function ecrireParametre(cle, valeur) {
  var p = OF.table('Parametres').filter(function (x) { return x.cle === cle; })[0];
  var action = p
    ? ['UpdateRecord', 'Parametres', p.id, { valeur: valeur }]
    : ['AddRecord', 'Parametres', null, { cle: cle, valeur: valeur }];
  return OF.appliquer([action], TABLES, rendre);
}

function champTaux(cle, defaut, libelle) {
  var el = document.createElement('input');
  el.className = 'champ';
  el.id = 'taux-' + cle;
  el.inputMode = 'decimal';
  el.placeholder = String(defaut);
  el.setAttribute('aria-label', libelle);
  var p = OF.table('Parametres').filter(function (x) { return x.cle === cle; })[0];
  var v = p ? p.valeur : null;
  el.value = (v || v === 0) ? Math.round(v * 100) : '';
  var origine = el.value;
  el.addEventListener('change', function () {
    var brut = el.value.trim();
    if (brut === '' || brut === origine) return;
    var n = OF.nombre(brut);
    if (n <= 0 || n > 100) {
      el.classList.add('erreur');
      OF.signaler('Un taux de réalisation se situe entre 1 et 100 %', true);
      return;
    }
    el.classList.remove('erreur');
    focusARendre = el.id;
    ecrireParametre(cle, n / 100).catch(function () {
      el.classList.add('erreur'); focusARendre = null;
    });
  });
  el.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { el.value = origine; el.blur(); }
    if (ev.key === 'Enter') el.blur();
  });
  return el;
}

function hypotheses(zone, annees) {
  var a = assiette(idAnnee);
  var annee = OF.parId(OF.table('Annees'))[idAnnee];
  if (!a.projetees && !a.ouvertes) return;

  zone.appendChild(titre('Et si tout ne se vendait pas'));

  /* D'abord lever l'ambiguïté : ouvertes, projetées, fermes, à vendre.
     Sans ces quatre nombres côte à côte, un pourcentage ne veut rien dire. */
  var def = document.createElement('table');
  def.className = 'matrice';
  def.style.marginBottom = '16px';
  var lignesDef = [
    ['Places ouvertes', 'sessions × effectif maximum', OF.ent(a.ouvertes), true],
    ['Places projetées', 'ce que vous avez affecté aux segments'
      + (a.ouvertes ? ', soit ' + Math.round(100 * a.projetees / a.ouvertes)
        + ' % des places ouvertes' : ''), OF.ent(a.projetees), true],
    ['dont engagées', 'groupes inter et ventes intra : un groupe est pris en entier',
      OF.ent(a.ferme.places), false],
    ['dont encore à vendre', 'ventes inter à la place — c\'est la seule part qui varie',
      OF.ent(a.aVendre.places), false]
  ];
  var corpsDef = document.createElement('tbody');
  lignesDef.forEach(function (l) {
    var tr = document.createElement('tr');
    var td = document.createElement('td');
    td.className = 'gauche libelle';
    td.textContent = l[0];
    if (l[3]) td.style.fontWeight = '600';
    var s2 = document.createElement('div');
    s2.className = 'second';
    s2.textContent = l[1];
    td.appendChild(s2);
    tr.appendChild(td);
    var tdv = document.createElement('td');
    tdv.className = 'calcul calcule';
    if (l[3]) { tdv.style.fontWeight = '600'; tdv.style.color = 'var(--encre)'; }
    tdv.textContent = l[2];
    tr.appendChild(tdv);
    corpsDef.appendChild(tr);
  });
  def.appendChild(corpsDef);
  zone.appendChild(defilant(def));

  if (!a.aVendre.places) {
    var rien = document.createElement('p');
    rien.className = 'note';
    rien.textContent = 'Toutes les places projetées sont engagées : des groupes inter ou des '
      + 'ventes intra. Il n\'y a rien qui dépende encore d\'un taux de réalisation.';
    zone.appendChild(rien);
    return;
  }

  var bas = parametre('realisation_pessimiste');
  var haut = parametre('realisation_optimiste');

  var reglages = document.createElement('div');
  reglages.className = 'outils';
  reglages.appendChild(document.createTextNode(
    'Part des places encore à vendre qui se concrétise — hypothèse basse'));
  reglages.appendChild(champTaux('realisation_pessimiste', 70, 'Taux de réalisation pessimiste'));
  reglages.appendChild(document.createTextNode('%  ·  haute'));
  reglages.appendChild(champTaux('realisation_optimiste', 100, 'Taux de réalisation optimiste'));
  reglages.appendChild(document.createTextNode('%'));
  zone.appendChild(reglages);

  if (!bas && !haut) {
    var vide = document.createElement('p');
    vide.className = 'note';
    vide.textContent = 'Posez au moins un des deux taux. Ils sont enregistrés dans la table '
      + 'Parametres, sous realisation_pessimiste et realisation_optimiste : tout le document '
      + 'en dispose, pas seulement cet écran. À 100 %, on retrouve la projection telle quelle.';
    zone.appendChild(vide);
    return;
  }
  if (bas && haut && bas > haut) {
    var ordre = document.createElement('p');
    ordre.className = 'alerte-bloc';
    ordre.textContent = 'L\'hypothèse basse dépasse l\'hypothèse haute : les deux sont '
      + 'affichées telles quelles, mais la fourchette n\'a plus de sens.';
    zone.appendChild(ordre);
  }

  var colonnes = [];
  if (bas) colonnes.push({ nom: Math.round(100 * bas) + ' %', h: auTaux(a, bas) });
  colonnes.push({ nom: 'Projection (100 %)', h: auTaux(a, 1) });
  if (haut && haut < 1) colonnes.push({ nom: Math.round(100 * haut) + ' %', h: auTaux(a, haut) });

  var t = document.createElement('table');
  t.className = 'matrice';
  t.innerHTML = '<thead><tr><th class="gauche"></th>'
    + colonnes.map(function (c) { return '<th>' + OF.echappe(c.nom) + '</th>'; }).join('')
    + '</tr></thead>';
  var corps = document.createElement('tbody');
  var ligne = function (libelle, detail, lire, fort) {
    var tr = document.createElement('tr');
    var td = document.createElement('td');
    td.className = 'gauche libelle';
    td.textContent = libelle;
    if (fort) td.style.fontWeight = '600';
    if (detail) {
      var s2 = document.createElement('div');
      s2.className = 'second';
      s2.textContent = detail;
      td.appendChild(s2);
    }
    tr.appendChild(td);
    colonnes.forEach(function (c) {
      var cel = document.createElement('td');
      cel.className = 'calcul';
      var v = lire(c);
      cel.textContent = v.texte;
      if (fort) { cel.style.fontWeight = '600'; cel.style.color = 'var(--encre)'; }
      if (v.classe) {
        cel.style.color = v.classe === 'positif' ? 'var(--fait)' : 'var(--alerte)';
        cel.style.fontWeight = '600';
      }
      tr.appendChild(cel);
    });
    corps.appendChild(tr);
  };

  ligne('Places réalisées', OF.ent(a.ferme.places) + ' engagées + la part vendue des '
    + OF.ent(a.aVendre.places) + ' à vendre', function (c) {
    return { texte: OF.ent(c.h.places) };
  });
  ligne('Recettes', 'inter et intra', function (c) {
    return { texte: OF.eur(c.h.recette) };
  }, true);
  ligne('Coûts', 'engagés par les sessions ouvertes, identiques dans les trois cas',
    function () { return { texte: OF.eur(a.cout) }; });
  ligne('Résultat', 'sur coûts directs', function (c) {
    return { texte: OF.eur(c.h.resultat),
      classe: c.h.resultat > 0 ? 'positif' : (c.h.resultat < 0 ? 'negatif' : '') };
  }, true);
  if (annee && annee.objectif_ca) {
    ligne('Écart à l\'objectif', OF.eur(annee.objectif_ca) + ' visés', function (c) {
      var e = c.h.recette - annee.objectif_ca;
      return { texte: (e >= 0 ? '+' : '') + OF.eur(e), classe: e >= 0 ? 'positif' : 'negatif' };
    });
  }
  t.appendChild(corps);
  zone.appendChild(defilant(t));

  /* le point de bascule : à partir de quel taux l'année passe dans le vert */
  if (a.aVendre.recette) {
    var bascule = (a.cout - a.ferme.recette) / a.aVendre.recette;
    var mot = document.createElement('p');
    mot.className = 'alerte-bloc';
    if (bascule <= 0) {
      mot.style.background = 'var(--fait-pale)';
      mot.style.borderLeftColor = 'var(--fait)';
      mot.innerHTML = 'Les seuls engagements fermes — groupes inter et ventes intra — couvrent '
        + 'déjà les coûts de l\'année. Tout ce qui se vendra à la place est du résultat.';
    } else if (bascule > 1) {
      mot.className = 'alerte-bloc grave';
      mot.innerHTML = 'Même en vendant <b>100 %</b> des places projetées, l\'année reste en '
        + 'perte de <b>' + OF.eur(a.cout - a.recette) + '</b>. Ce n\'est pas une question de '
        + 'réalisation : les tarifs ou les coûts sont à revoir.';
    } else {
      mot.innerHTML = 'L\'année passe à l\'équilibre à partir de <b>'
        + Math.ceil(100 * bascule) + ' %</b> des places encore à vendre, soit <b>'
        + OF.plur(Math.ceil(a.aVendre.places * bascule), 'place') + '</b> sur les '
        + OF.ent(a.aVendre.places) + ' qui restent.';
    }
    zone.appendChild(mot);
  }

  /* la fourchette sur toutes les années */
  if (bas && annees.length > 1) {
    var hautEffectif = haut || 1;
    var valeurs = annees.map(function (an) {
      var ai = assiette(an.id);
      if (!ai.projetees) return { libelle: String(an.annee), bas: null, haut: null, central: null };
      var b = auTaux(ai, bas), o = auTaux(ai, hautEffectif), p = auTaux(ai, 1);
      return {
        libelle: String(an.annee), bas: b.resultat, haut: o.resultat, central: p.resultat,
        bulle: '<b>' + an.annee + '</b> — projection entière ' + OF.eur(p.resultat)
          + '<span class="second">à ' + Math.round(100 * bas) + ' % : ' + OF.eur(b.resultat)
          + '</span><span class="second">coûts engagés ' + OF.eur(ai.cout) + '</span>'
          + '<span class="second">dont ' + OF.eur(ai.ferme.recette) + ' de recettes fermes</span>'
      };
    });
    G.figure(zone, {
      titre: 'Résultat selon ce qui se vend, par année',
      sous: 'La bande va de ' + Math.round(100 * bas) + ' % à '
        + Math.round(100 * hautEffectif) + ' % des places encore à vendre ; le trait marque la '
        + 'projection entière.',
      haut: 215,
      chiffres: G.chiffres('Les chiffres',
        ['', 'Hypothèse basse', 'Projection entière'],
        valeurs.map(function (v) {
          return [v.libelle, v.bas === null ? '—' : OF.eur(v.bas),
            v.central === null ? '—' : OF.eur(v.central)];
        })),
      dessin: function (larg, hauteur) {
        return G.fourchettes({
          larg: larg, haut: hauteur, valeurs: valeurs, unite: 'en €',
          description: 'Résultat de chaque année selon la part des places à vendre qui se '
            + 'concrétise.'
        });
      }
    });
  }

  /* Le total recalculé doit retomber sur la recette du document. */
  if (annee && (annee.recettes || annee.recettes === 0)
      && Math.abs(a.recette - annee.recettes) > 1) {
    var ecart = document.createElement('p');
    ecart.className = 'alerte-bloc';
    ecart.innerHTML = 'À vérifier : le total des lignes de vente de ' + annee.annee + ', <b>'
      + OF.eur(a.recette) + '</b>, ne retombe pas sur la recette que le document donne pour '
      + 'l\'année, <b>' + OF.eur(annee.recettes) + '</b>. Une ligne de vente porte sans doute '
      + 'une année sans projection. Tant que l\'écart subsiste, la fourchette repose sur une '
      + 'assiette incomplète.';
    zone.appendChild(ecart);
  }
}


/* --------------------------------------------------------- scénarios --- */
/* Affecter les places formation par formation pour chaque année à venir est
   un travail considérable, et prématuré : avant de savoir si 2028 tient la
   route, on veut l'ordre de grandeur. Un scénario part donc d'une année
   réellement projetée et lui applique une progression annuelle.

   Ce que la progression multiplie, et pourquoi tout ensemble : dans ce
   document la recette suit les places vendues et le coût suit les sessions
   ouvertes. Faire croître l'activité de 10 %, c'est ouvrir 10 % de sessions
   en plus et vendre 10 % de places en plus — recette, coût et résultat
   suivent donc le même coefficient. Ouvrir des sessions SANS vendre
   davantage est une autre question : c'est le bloc « Et si tout ne se
   vendait pas » qui y répond, et il ne faut pas mélanger les deux. */
function anneeDeBase(annees) {
  var choisie = parametre('scenario_annee_base');
  var reelles = annees.filter(function (a) { return assiette(a.id).recette > 0; });
  if (!reelles.length) return null;
  var parAnnee = reelles.filter(function (a) { return a.annee === choisie; })[0];
  return parAnnee || reelles[reelles.length - 1];
}

function scenarios(zone, annees) {
  var base = anneeDeBase(annees);
  if (!base) {
    var rien = document.createElement('p');
    rien.className = 'note';
    rien.textContent = 'Aucune année ne porte encore de recette : il n\'y a pas d\'année '
      + 'réelle sur laquelle appuyer un scénario.';
    zone.appendChild(rien);
    return;
  }
  var aBase = assiette(base.id);
  var sessionsBase = OF.table('Projections').filter(function (p) { return p.annee === base.id; })
    .reduce(function (n, p) { return n + (p.nb_sessions || 0); }, 0)
    + OF.table('Ventes_intra').filter(function (v) { return v.annee === base.id; })
      .reduce(function (n, v) { return n + (v.nb_sessions || 0); }, 0);

  /* les réglages : l'année de départ, et la progression annuelle */
  var reglages = document.createElement('div');
  reglages.className = 'outils';
  reglages.appendChild(document.createTextNode('À partir de'));
  var sel = document.createElement('select');
  sel.className = 'lieu';
  sel.id = 'scenario-base';
  sel.setAttribute('aria-label', 'Année de base du scénario');
  annees.filter(function (a) { return assiette(a.id).recette > 0; }).forEach(function (a) {
    sel.appendChild(new Option(a.annee, a.annee, false, a.annee === base.annee));
  });
  sel.addEventListener('change', function () {
    focusARendre = 'scenario-base';
    ecrireParametre('scenario_annee_base', OF.nombre(sel.value));
  });
  reglages.appendChild(sel);
  reglages.appendChild(document.createTextNode(', progression de'));
  reglages.appendChild(champProgression());
  reglages.appendChild(document.createTextNode('% par an'));
  zone.appendChild(reglages);

  var pct = parametre('scenario_progression');
  if (!pct) {
    var vide = document.createElement('p');
    vide.className = 'note';
    vide.textContent = 'Posez une progression pour voir le scénario. Elle est enregistrée dans '
      + 'Parametres, sous scenario_progression. Une progression de 0 % reprend l\'année de '
      + 'base à l\'identique ; une progression négative la fait décroître.';
    zone.appendChild(vide);
    return;
  }
  var k = 1 + pct;

  /* le tableau : réel là où il existe, simulé ailleurs, et jamais confondus */
  var t = document.createElement('table');
  t.className = 'matrice';
  t.innerHTML = '<thead><tr><th class="gauche">Année</th><th>Sessions</th><th>Places</th>'
    + '<th>Recettes</th><th>Coûts</th><th>Résultat</th>'
    + '<th class="calcule">Objectif</th><th>Écart</th></tr></thead>';
  var corps = document.createElement('tbody');
  var apres = annees.filter(function (a) { return a.annee >= base.annee; });

  apres.forEach(function (a, i) {
    var reelle = assiette(a.id);
    var estReel = reelle.recette > 0;
    var coef = Math.pow(k, i);
    var sessions = estReel
      ? OF.table('Projections').filter(function (p) { return p.annee === a.id; })
          .reduce(function (n, p) { return n + (p.nb_sessions || 0); }, 0)
        + OF.table('Ventes_intra').filter(function (v) { return v.annee === a.id; })
          .reduce(function (n, v) { return n + (v.nb_sessions || 0); }, 0)
      : sessionsBase * coef;
    var places = estReel ? reelle.projetees : aBase.projetees * coef;
    var recette = estReel ? reelle.recette : aBase.recette * coef;
    var cout = estReel ? reelle.cout : aBase.cout * coef;

    var tr = document.createElement('tr');
    if (!estReel) tr.className = 'simule';
    var cellules = [
      [String(a.annee) + (estReel ? '' : '  simulé'), 'gauche libelle'],
      [OF.dec(sessions), 'calcul'], [OF.ent(places), 'calcul'],
      [OF.eur(recette), 'calcul'], [OF.eur(cout), 'calcul'],
      [OF.eur(recette - cout), 'calcul', recette - cout >= 0 ? 'positif' : 'negatif'],
      [a.objectif_ca ? OF.eur(a.objectif_ca) : '—', 'calcul calcule'],
      [a.objectif_ca ? ((recette - a.objectif_ca >= 0 ? '+' : '') + OF.eur(recette - a.objectif_ca))
        : '—', 'calcul', a.objectif_ca ? (recette >= a.objectif_ca ? 'positif' : 'negatif') : '']
    ];
    cellules.forEach(function (c) {
      var td = document.createElement('td');
      td.className = c[1];
      td.textContent = c[0];
      if (c[2]) { td.style.color = c[2] === 'positif' ? 'var(--fait)' : 'var(--alerte)';
        td.style.fontWeight = '600'; }
      tr.appendChild(td);
    });
    corps.appendChild(tr);
  });
  t.appendChild(corps);
  zone.appendChild(defilant(t));

  var n = document.createElement('p');
  n.className = 'note';
  n.innerHTML = 'Les années <b>déjà projetées</b> affichent leurs chiffres réels — un scénario '
    + 'ne les écrase pas. Les autres sont <b>simulées</b> à partir de ' + base.annee
    + ' : sessions, places, recettes et coûts croissent ensemble de ' + Math.round(100 * pct)
    + ' % par an, parce que dans ce document la recette suit les places et le coût suit les '
    + 'sessions. Rien n\'est écrit : c\'est un ordre de grandeur pour décider, pas une '
    + 'projection saisie.';
  zone.appendChild(n);

  var suite = document.createElement('p');
  suite.className = 'note';
  suite.innerHTML = 'Pour transformer un scénario en vraie projection, la fiche de chaque '
    + 'formation porte « Reprendre une année sur les suivantes, en multipliant par » : c\'est '
    + 'le même calcul, formation par formation, et qui écrit cette fois.';
  zone.appendChild(suite);
}

function champProgression() {
  var el = document.createElement('input');
  el.className = 'coef';
  el.id = 'scenario-progression';
  el.inputMode = 'decimal';
  el.placeholder = '10';
  el.setAttribute('aria-label', 'Progression annuelle en pourcentage');
  var p = OF.table('Parametres').filter(function (x) { return x.cle === 'scenario_progression'; })[0];
  var v = p ? p.valeur : null;
  el.value = (v || v === 0) ? Math.round(v * 100) : '';
  var origine = el.value;
  el.addEventListener('change', function () {
    var brut = el.value.trim();
    if (brut === origine) return;
    var n = brut === '' ? 0 : OF.nombre(brut);
    if (n < -100 || n > 500) {
      el.classList.add('erreur');
      OF.signaler('Une progression annuelle se situe entre −100 et 500 %', true);
      return;
    }
    el.classList.remove('erreur');
    focusARendre = el.id;
    ecrireParametre('scenario_progression', n / 100)
      .catch(function () { el.classList.add('erreur'); focusARendre = null; });
  });
  el.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { el.value = origine; el.blur(); }
    if (ev.key === 'Enter') el.blur();
  });
  return el;
}

/* ------------------------------------------------------- rentabilité --- */
/* Dans ce document, le coût d'une session ne dépend ni du nombre de sessions
   ni du nombre d'inscrits : animation et support sont facturés par session.
   Une session est donc rentable ou non par elle-même, et le signe du résultat
   d'une formation ne change pas avec le volume. Le seuil est ailleurs : dans
   le nombre de places vendues par session. */
function comptesFormation(idA) {
  var par = {};
  var prendre = function (l) {
    if (!l.formation || l.annee !== idA) return;
    var c = par[l.formation] = par[l.formation] || {
      formation: l.formation, sessions: 0, recette: 0, cout: 0, resultat: 0, places: 0
    };
    c.sessions += l.nb_sessions || 0;
    c.recette += l.recette || 0;
    c.cout += l.cout || 0;
    c.resultat += l.resultat || 0;
    c.places += l.places || 0;
  };
  OF.table('Projections').forEach(prendre);
  OF.table('Ventes_intra').forEach(prendre);
  return Object.keys(par).map(function (k) { return par[k]; })
    .filter(function (c) { return c.sessions; });
}

function rentabilite(zone) {
  var annee = OF.parId(OF.table('Annees'))[idAnnee];
  var comptes = comptesFormation(idAnnee);
  if (!comptes.length) return;

  /* le document ne donne un résultat que si les coûts sont calculables */
  var tousChiffres = comptes.filter(function (c) { return c.cout || c.recette; });
  if (!tousChiffres.length) return;

  /* Une formation purement interne n'a pas vocation à couvrir ses coûts : elle
     n'est pas vendue. La compter parmi les déficitaires ferait passer une
     mission de service pour un échec commercial. On la met de côté, et on dit
     combien on en a mises de côté. */
  var parF = OF.parId(OF.table('Formations'));
  var estInterne = function (c) {
    var f = parF[c.formation];
    return !!f && OF.texte(f.perimetre) === 'Interne';
  };
  var internes = perimetreDisponible() ? tousChiffres.filter(estInterne) : [];
  var chiffres = perimetreDisponible()
    ? tousChiffres.filter(function (c) { return !estInterne(c); })
    : tousChiffres;
  if (!chiffres.length) return;

  var gagnantes = chiffres.filter(function (c) { return c.resultat > 0; });
  var perdantes = chiffres.filter(function (c) { return c.resultat < 0; });
  var neutres = chiffres.filter(function (c) { return c.resultat === 0; });
  var projetees = {};
  chiffres.forEach(function (c) { projetees[c.formation] = 1; });
  internes.forEach(function (c) { projetees[c.formation] = 1; });
  var sansSession = OF.table('Formations').filter(function (f) {
    return OF.texte(f.intitule).trim() && !projetees[f.id];
  }).length;

  zone.appendChild(titre('Rentabilité des formations en ' + (annee ? annee.annee : '')));

  var t = document.createElement('div');
  t.className = 'tuiles';
  t.appendChild(tuile('Couvrent leurs coûts', OF.ent(gagnantes.length),
    gagnantes.length ? '+' + OF.eur(somme(gagnantes, 'resultat')) : 'aucune', 'positif'));
  t.appendChild(tuile('À perte', OF.ent(perdantes.length),
    perdantes.length ? OF.eur(somme(perdantes, 'resultat')) : 'aucune',
    perdantes.length ? 'negatif' : ''));
  if (neutres.length) {
    t.appendChild(tuile('À l\'équilibre', OF.ent(neutres.length), 'résultat nul'));
  }
  t.appendChild(tuile('Sans session projetée', OF.ent(sansSession),
    'ni gain ni perte cette année'));
  if (internes.length) {
    t.appendChild(tuile('Internes, mises de côté', OF.ent(internes.length),
      OF.eur(somme(internes, 'cout')) + ' de coûts, hors jugement de rentabilité'));
  }
  zone.appendChild(t);

  /* le classement : les plus gros écarts, dans les deux sens */
  var classees = chiffres.slice().sort(function (a, b) { return b.resultat - a.resultat; });
  var garde = 14;
  var montrees = classees.length <= garde ? classees
    : classees.slice(0, Math.ceil(garde / 2))
        .concat(classees.slice(classees.length - Math.floor(garde / 2)));

  var valeurs = montrees.map(function (c) {
    var parSession = c.sessions ? c.resultat / c.sessions : 0;
    return {
      libelle: nom('Formations', c.formation, 'Sans titre'),
      valeur: c.resultat,
      bulle: '<b>' + OF.echappe(nom('Formations', c.formation, 'Sans titre')) + '</b>'
        + '<span class="second">' + OF.plur(c.sessions, 'session') + ' · '
        + OF.plur(c.places, 'place') + '</span>'
        + '<span class="second">recette ' + OF.eur(c.recette)
        + ' − coûts ' + OF.eur(c.cout) + '</span>'
        + '<span class="second ' + (parSession >= 0 ? 'positif' : 'negatif') + '">'
        + OF.eur(parSession) + ' par session</span>'
    };
  });

  G.figure(zone, {
    titre: 'Résultat sur coûts directs, par formation',
    sous: classees.length > garde
      ? 'Les ' + Math.ceil(garde / 2) + ' plus rentables et les ' + Math.floor(garde / 2)
        + ' plus déficitaires, sur ' + OF.plur(classees.length, 'formation') + ' projetée'
        + (classees.length >= 2 ? 's' : '') + '.'
      : 'Toutes les formations vendues qui portent des sessions cette année.',
    chiffres: G.chiffres('Toutes les formations',
      ['Formation', 'Sessions', 'Places', 'Recette', 'Coûts', 'Résultat', 'Par session'],
      classees.map(function (c) {
        return [nom('Formations', c.formation, 'Sans titre'), OF.ent(c.sessions),
          OF.ent(c.places), OF.eur(c.recette), OF.eur(c.cout), OF.eur(c.resultat),
          OF.eur(c.sessions ? c.resultat / c.sessions : 0)];
      })),
    dessin: function (larg) {
      return G.barresHorizontales({
        larg: larg, valeurs: valeurs, polarite: true, formatVal: OF.eur,
        description: 'Résultat sur coûts directs de chaque formation, positif ou négatif.'
      });
    }
  });

  var n = document.createElement('p');
  n.className = 'note';
  n.textContent = 'Dans ce document, animation et support sont facturés par session : le coût '
    + 'd\'une session ne dépend ni du nombre de sessions ni du nombre d\'inscrits. Une '
    + 'formation à perte ne le devient donc pas moins en ouvrant des sessions — elle perd '
    + 'davantage. Le seuil se joue sur le nombre de places vendues par session, et la fiche '
    + 'de chaque formation l\'indique sous son coût de revient.'
    + (internes.length
       ? ' ' + OF.plur(internes.length, 'formation') + ' purement '
         + OF.accord(internes.length, 'interne', 'internes') + ' '
         + OF.accord(internes.length, 'ne figure', 'ne figurent') + ' pas ici : '
         + OF.accord(internes.length, 'elle n\'est pas vendue', 'elles ne sont pas vendues')
         + ', et ' + OF.accord(internes.length, 'son résultat', 'leur résultat')
         + ' n\'aurait pas de sens. '
         + OF.accord(internes.length, 'Son coût reste compté', 'Leurs coûts restent comptés')
         + ' dans la section « Pour qui ».'
       : '');
  zone.appendChild(n);
}

function grapheRecettes(zone, annees) {
  var avecObjectif = annees.some(function (a) { return a.objectif_ca; });
  var valeurs = annees.map(function (a) {
    var ecart = a.objectif_ca ? (a.recettes || 0) - a.objectif_ca : null;
    return {
      libelle: String(a.annee),
      valeur: (a.recettes || a.recettes === 0) ? a.recettes : null,
      objectif: a.objectif_ca || null,
      bulle: '<b>' + a.annee + '</b> — recettes ' + OF.eur(a.recettes || 0)
        + (a.objectif_ca
          ? '<span class="second">objectif ' + OF.eur(a.objectif_ca) + '</span>'
            + '<span class="second ' + (ecart >= 0 ? 'positif' : 'negatif') + '">'
            + (ecart >= 0 ? '+' : '') + OF.eur(ecart) + '</span>'
          : '<span class="second">objectif non fixé</span>')
        + '<span class="second">coûts ' + OF.eur(a.couts || 0) + '</span>'
    };
  });

  G.figure(zone, {
    titre: 'Recettes projetées par année',
    sous: avecObjectif
      ? 'Le trait pointillé marque l\'objectif de recettes de l\'année.'
      : 'Aucun objectif n\'est encore fixé — ils se saisissent en bas de cet écran.',
    haut: 215,
    chiffres: G.chiffres('Les chiffres',
      ['', 'Recettes', 'Objectif', 'Écart'].slice(0, avecObjectif ? 4 : 2),
      annees.map(function (a) {
        var L = [String(a.annee), (a.recettes || a.recettes === 0) ? OF.eur(a.recettes) : '—'];
        if (avecObjectif) {
          L.push(a.objectif_ca ? OF.eur(a.objectif_ca) : '—');
          var e = a.objectif_ca ? (a.recettes || 0) - a.objectif_ca : null;
          L.push(e === null ? '—' : (e >= 0 ? '+' : '') + OF.eur(e));
        }
        return L;
      })),
    dessin: function (larg, haut) {
      return G.barres({
        larg: larg, haut: haut, valeurs: valeurs, unite: 'en €',
        description: 'Recettes projetées par année, comparées à l\'objectif de chaque année.'
      });
    }
  });
}

function grapheResultat(zone, annees) {
  var valeurs = annees.map(function (a) {
    return {
      libelle: String(a.annee),
      valeur: (a.resultat || a.resultat === 0) ? a.resultat : null,
      bulle: '<b>' + a.annee + '</b> — résultat ' + OF.eur(a.resultat || 0)
        + '<span class="second">recettes ' + OF.eur(a.recettes || 0)
        + ' − coûts ' + OF.eur(a.couts || 0) + '</span>'
        + (a.recettes ? '<span class="second">taux de marge '
          + Math.round(100 * (a.resultat || 0) / a.recettes) + ' %</span>' : '')
    };
  });
  if (!valeurs.some(function (v) { return v.valeur !== null; })) return;

  G.figure(zone, {
    titre: 'Résultat sur coûts directs, par année',
    sous: 'Recettes moins coûts directs. Une barre sous la ligne est une année en perte.',
    haut: 200,
    chiffres: G.chiffres('Les chiffres', ['', 'Recettes', 'Coûts', 'Résultat', 'Marge'],
      annees.map(function (a) {
        return [String(a.annee), OF.eur(a.recettes || 0), OF.eur(a.couts || 0),
          OF.eur(a.resultat || 0),
          a.recettes ? Math.round(100 * (a.resultat || 0) / a.recettes) + ' %' : '—'];
      })),
    dessin: function (larg, haut) {
      return G.barres({
        larg: larg, haut: haut, valeurs: valeurs, polarite: true, unite: 'en €',
        description: 'Résultat sur coûts directs par année, positif ou négatif.'
      });
    }
  });
}

/* Recettes par domaine et par année : la composition de la trajectoire. */
function grapheDomaines(zone, annees) {
  var parDomaine = {};
  OF.table('Projections').concat(OF.table('Ventes_intra')).forEach(function (p) {
    if (!p.formation || !p.annee) return;
    var f = OF.parId(OF.table('Formations'))[p.formation];
    var d = (f && f.domaine) || 0;
    (parDomaine[d] = parDomaine[d] || {})[p.annee] = (parDomaine[d][p.annee] || 0) + (p.recette || 0);
  });

  var cles = Object.keys(parDomaine);
  var totalDe = function (k) {
    return annees.reduce(function (n, a) { return n + (parDomaine[k][a.id] || 0); }, 0);
  };
  cles = cles.filter(totalDe);
  if (!cles.length) return;
  cles.sort(function (x, y) { return totalDe(y) - totalDe(x); });

  /* Au-delà de cinq teintes, on ne distingue plus : les plus petits domaines
     se regroupent plutôt que de recevoir une couleur de plus. */
  var series = [], colonnes = [];
  var garde = cles.length > 5 ? 4 : cles.length;
  cles.slice(0, garde).forEach(function (k) {
    series.push(nom('Domaines', +k, 'Domaine non renseigné'));
    colonnes.push(function (a) { return parDomaine[k][a.id] || 0; });
  });
  if (cles.length > garde) {
    var reste = cles.slice(garde);
    series.push('Autres domaines (' + reste.length + ')');
    colonnes.push(function (a) {
      return reste.reduce(function (n, k) { return n + (parDomaine[k][a.id] || 0); }, 0);
    });
  }

  var pilotee = OF.parId(OF.table('Annees'))[idAnnee];
  var groupes = annees.map(function (a) {
    var parts = colonnes.map(function (f) { return f(a); });
    var total = parts.reduce(function (n, v) { return n + v; }, 0);
    return {
      libelle: String(a.annee), parts: parts,
      bulle: '<b>' + a.annee + '</b> — ' + OF.eur(total)
        + series.map(function (s, i) {
          return parts[i] ? '<span class="second">' + OF.echappe(s) + ' : ' + OF.eur(parts[i])
            + ' · ' + Math.round(100 * parts[i] / total) + ' %</span>' : '';
        }).join('')
    };
  });

  G.figure(zone, {
    titre: 'Recettes par domaine, année par année',
    sous: 'La hauteur totale est la recette de l\'année ; chaque aplat est un domaine.',
    haut: 230,
    series: series.map(function (s, i) {
      return { nom: s, valeur: pilotee
        ? OF.eur(colonnes[i](pilotee)) + ' en ' + pilotee.annee : '' };
    }),
    chiffres: G.chiffres('Les chiffres',
      ['Domaine'].concat(annees.map(function (a) { return String(a.annee); })),
      series.map(function (s, i) {
        return [s].concat(annees.map(function (a) {
          return colonnes[i](a) ? OF.eur(colonnes[i](a)) : '—';
        }));
      }).concat([['Total'].concat(annees.map(function (a) {
        var t = colonnes.reduce(function (n, f) { return n + f(a); }, 0);
        return t ? OF.eur(t) : '—';
      }))])),
    dessin: function (larg, haut) {
      return G.empilees({
        larg: larg, haut: haut, groupes: groupes, series: series,
        total: true, unite: 'en €',
        description: 'Recettes par année, réparties par domaine de formation.'
      });
    }
  });
}

/* ====================================================== la page d'une année */
/* La synthèse répond « où va-t-on ? » sur plusieurs années. Cette page-ci
   répond « où en est-on ? » sur une seule, et c'est une autre question :
   elle se juge au rythme écoulé, pas à la trajectoire. */
function pageAnnee(a) {
  var zone = document.createElement('div');
  var h1 = document.createElement('h1');
  h1.textContent = 'Année ' + a.annee;
  zone.appendChild(h1);

  var r = rythme(a.annee);
  var sous = document.createElement('p');
  sous.className = 'sous';
  sous.textContent = r.future
    ? 'Année à venir : il n\'y a encore rien à réaliser, seulement à projeter.'
    : (r.revolue
      ? 'Année révolue : le réalisé est définitif.'
      : 'Année en cours : ' + r.ecoule + ' jours utiles écoulés sur ' + r.total
        + ', ' + r.libelleCreux + ' non comptés.');
  zone.appendChild(sous);

  zone.appendChild(tuilesAnnee(a));

  if (realiseDisponible()) {
    normaliserAnnee(a);
    zone.appendChild(section('Où en est l\'année',
      'Trois taux sur la même échelle : ce que le calendrier laisse attendre, ce qui est '
      + 'vendu, ce qui est facturé.'));
    zone.appendChild(tauxAnnee(a, r));
    grapheAnnee(zone, a);
    detailFormations(zone, a);
  } else {
    zone.appendChild(section('Où en est l\'année', ''));
    realiseAbsent(zone);
  }
  return zone;
}

function tuilesAnnee(a) {
  var t = document.createElement('div');
  t.className = 'tuiles';
  t.appendChild(tuile('Projeté', OF.eur(a.recettes),
    OF.plur(a.sessions_total, 'session') + ' · ' + OF.plur(a.places, 'place')));
  if (realiseDisponible()) {
    normaliserAnnee(a);
    t.appendChild(tuile('Vendu', OF.eur(a.realise_vendu),
      OF.plur(a.realise_sessions, 'session') + ' · ' + OF.plur(a.realise_places, 'place')));
    t.appendChild(tuile('Facturé', OF.eur(a.realise_facture), 'net d\'avoirs'));
    t.appendChild(tuile('Reste à facturer', OF.eur(a.reste_a_facturer),
      'vendu non encore émis', (a.reste_a_facturer || 0) > 0 ? 'negatif' : ''));
  } else {
    t.appendChild(tuile('Résultat', OF.eur(a.resultat),
      a.recettes ? OF.pourcent(a.resultat, a.recettes) + ' de marge' : '—'));
    t.appendChild(tuile('Objectif', OF.eur(a.objectif_ca),
      a.objectif_ca ? OF.eur((a.recettes || 0) - a.objectif_ca) + ' d\'écart' : 'non fixé'));
  }
  return t;
}

/* Les trois taux, sur une échelle commune. L'attendu est un repère, pas une
   quatrième barre : il dit où l'on devrait être, pas ce qu'on a fait. */
function tauxAnnee(a, r) {
  /* À quoi rapporter le vendu : la projection d'abord, l'objectif à défaut.
     Beaucoup d'années ont un objectif sans projection détaillée — l'année en
     cours notamment, quand le plan commence l'année suivante. */
  var base = a.recettes || 0;
  var origine = 'la projection';
  if (!base && a.objectif_ca) { base = a.objectif_ca; origine = 'l\'objectif de recettes'; }
  var zone = document.createElement('div');

  if (!base) {
    /* Sans dénominateur, les taux n'existent pas — mais l'avancement du
       calendrier, lui, se dit quand même, et les montants aussi. */
    var p = document.createElement('p');
    p.className = 'alerte-bloc';
    p.innerHTML = '<b>' + a.annee + ' n\'a ni projection ni objectif de recettes</b>, donc '
      + 'les trois taux n\'ont rien à quoi se rapporter : « ' + OF.eur(a.realise_vendu)
      + ' vendus sur 0 € prévus » ne voudrait rien dire. Les montants ci-dessous restent '
      + 'justes, seule la comparaison manque.';
    zone.appendChild(p);

    var q = document.createElement('p');
    q.className = 'note';
    q.innerHTML = 'C\'est le cas normal d\'une année antérieure au plan. Pour la comparer '
      + 'malgré tout, deux chemins : poser un <b>objectif de recettes</b> pour ' + a.annee
      + ' dans la section « Ce que l\'on vise » de la synthèse — c\'est une seule case à '
      + 'remplir — ou projeter ses formations comme les autres années.';
    zone.appendChild(q);

    if (!r.future) {
      var o = document.createElement('p');
      o.className = 'note';
      o.textContent = 'À titre indicatif, ' + Math.round(100 * r.part) + ' % de l\'année '
        + 'utile ' + a.annee + ' est écoulée (' + r.ecoule + ' jours sur ' + r.total
        + ', hors ' + r.libelleCreux + ').';
      zone.appendChild(o);
    }
    return zone;
  }

  /* Seul le vendu se juge au rythme attendu. Le facturé suit le vendu avec
     un décalage normal — l'alarmer sur le même repère ferait passer le délai
     d'émission d'une facture pour un retard commercial. */
  var taux = [
    { nom: 'Attendu au ' + new Date().toLocaleDateString('fr-FR'), part: r.part, repere: true,
      detail: r.future ? 'l\'année n\'a pas commencé'
        : (r.revolue ? 'année révolue'
          : r.ecoule + ' jours utiles sur ' + r.total + ', hors ' + r.libelleCreux) },
    { nom: 'Vendu', part: (a.realise_vendu || 0) / base, juge: true,
      detail: OF.eur(a.realise_vendu) + ' sur ' + OF.eur(base) + ' — ' + origine },
    { nom: 'Facturé', part: (a.realise_facture || 0) / base,
      detail: OF.eur(a.realise_facture) + ' émis, soit '
        + (a.realise_vendu ? Math.round(100 * (a.realise_facture || 0) / a.realise_vendu) + ' %'
           : '—') + ' du vendu' },
  ];

  var barres = document.createElement('div');
  barres.className = 'barres';
  taux.forEach(function (x) {
    var pc = Math.round(100 * x.part);
    var l = document.createElement('div');
    l.className = 'barre-ligne';
    var cible = Math.round(100 * r.part);
    var classe = x.repere ? 'repere'
      : (x.juge && !r.future ? (pc < cible - 10 ? 'grave' : (pc < cible ? 'tendu' : '')) : '');
    l.innerHTML = '<span>' + OF.echappe(x.nom) + '</span>'
      + '<span class="jauge"><span class="' + classe + '" style="width:'
      + Math.min(100, Math.max(0, pc)) + '%"></span></span>'
      + '<span class="calcul">' + pc + ' %</span>';
    l.title = x.detail;
    barres.appendChild(l);
  });
  zone.appendChild(barres);

  /* la lecture, en une phrase : c'est l'écart au repère qui se pilote */
  var ecart = Math.round(100 * ((a.realise_vendu || 0) / base - r.part));
  var v = document.createElement('p');
  v.className = 'verdict' + (ecart < -5 ? ' tendu' : '');
  v.innerHTML = r.future
    ? 'Année à venir : rien à comparer encore.'
    : (Math.abs(ecart) <= 5
      ? 'Le vendu suit le rythme attendu, à ' + Math.abs(ecart) + ' point'
        + (Math.abs(ecart) > 1 ? 's' : '') + ' près.'
      : (ecart < 0
        ? '<b>' + Math.abs(ecart) + ' points de retard</b> sur le rythme attendu, soit '
          + OF.eur(base * (r.part - (a.realise_vendu || 0) / base)) + ' qui manquent à ce jour.'
        : '<b>' + ecart + ' points d\'avance</b> sur le rythme attendu, soit '
          + OF.eur(base * ((a.realise_vendu || 0) / base - r.part)) + ' de mieux que prévu.'));
  zone.appendChild(v);

  if (origine !== 'la projection') {
    var src = document.createElement('p');
    src.className = 'note';
    src.innerHTML = a.annee + ' n\'a pas de projection détaillée : les taux se rapportent à '
      + '<b>' + OF.eur(base) + '</b>, l\'objectif de recettes fixé pour cette année.';
    zone.appendChild(src);
  }

  var n = document.createElement('p');
  n.className = 'aide';
  n.textContent = 'L\'attendu compte les jours écoulés de l\'année utile — celle qui exclut '
    + r.libelleCreux + ', où l\'organisme ne forme pas. Au 30 juin, le calendrier civil dirait '
    + '49 % quand six des dix mois utiles sont faits : juger sur l\'année civile flatterait '
    + 'le vendu de dix points. Les mois exclus se règlent dans Parametres, sous '
    + 'mois_sans_activite.';
  zone.appendChild(n);
  return zone;
}

/* Le vendu décomposé, face au projeté. Une seule année : des barres
   horizontales se lisent mieux que trois piles isolées. */
function grapheAnnee(zone, a) {
  var lignes = [
    { libelle: 'Projeté', valeur: a.recettes || 0 },
    { libelle: 'Vendu', valeur: a.realise_vendu || 0 },
    { libelle: 'dont facturé', valeur: a.realise_facture || 0 },
    { libelle: 'dont à facturer', valeur: (a.reste_a_facturer || 0) },
  ].filter(function (l) { return l.valeur; });
  if (lignes.length < 2) return;

  G.figure(zone, {
    titre: 'Ce que porte ' + a.annee,
    sous: 'Le vendu se partage entre ce qui est déjà facturé et ce qui reste à émettre.',
    chiffres: G.chiffres('Les chiffres', ['Mesure', 'Montant', 'Part du projeté'],
      lignes.map(function (l) {
        return [l.libelle, OF.eur(l.valeur),
          a.recettes ? Math.round(100 * l.valeur / a.recettes) + ' %' : '—'];
      })),
    dessin: function (larg) {
      return G.barresHorizontales({
        larg: larg,
        valeurs: lignes.map(function (l) {
          return { libelle: l.libelle, valeur: l.valeur,
            bulle: '<b>' + OF.echappe(l.libelle) + '</b><span class="second">' + OF.eur(l.valeur)
              + (a.recettes ? ' · ' + Math.round(100 * l.valeur / a.recettes) + ' % du projeté' : '')
              + '</span>' };
        }),
        formatVal: OF.eur,
        description: 'Projeté, vendu, facturé et reste à facturer pour ' + a.annee + '.'
      });
    }
  });
}

/* Le détail par formation : c'est là qu'on voit laquelle décroche. */
function detailFormations(zone, a) {
  var T = tableSessions() || 'SmartOF_sessions';
  var par = {};
  OF.table(T).forEach(function (s) {
    if (champDe(s, T, 'annee') !== a.id) return;
    var f = champDe(s, T, 'formation') || 0;
    var c = par[f] = par[f] || { formation: f, sessions: 0, places: 0, vendu: 0, facture: 0 };
    c.sessions++;
    c.places += champDe(s, T, 'places_vendues') || 0;
    c.vendu += champDe(s, T, 'vendu') || 0;
    c.facture += champDe(s, T, 'facture_ht') || 0;
  });
  var lignes = Object.keys(par).map(function (k) { return par[k]; });
  if (!lignes.length) return;

  /* le projeté de chaque formation, pour l'année */
  var projete = {};
  OF.table('Projections').concat(OF.table('Ventes_intra')).forEach(function (p) {
    if (p.annee !== a.id || !p.formation) return;
    projete[p.formation] = (projete[p.formation] || 0) + (p.recette || 0);
  });

  lignes.sort(function (x, y) { return y.vendu - x.vendu; });

  zone.appendChild(titre('Formation par formation'));
  var t = document.createElement('table');
  t.className = 'matrice';
  t.innerHTML = '<thead><tr><th class="gauche">Formation</th>'
    + '<th class="calcule">Sessions</th><th>Places</th>'
    + '<th>Projeté</th><th>Vendu</th><th>Réalisation</th>'
    + '<th>Facturé</th><th>Reste à facturer</th></tr></thead>';
  var corps = document.createElement('tbody');
  lignes.forEach(function (c) {
    var tr = document.createElement('tr');
    var td = document.createElement('td');
    td.className = 'gauche libelle';
    td.textContent = c.formation ? nom('Formations', c.formation, 'Formation inconnue')
      : 'Produit non rapproché';
    if (!c.formation) {
      var s2 = document.createElement('div');
      s2.className = 'second negatif';
      s2.textContent = 'à rapprocher dans le widget SmartOF';
      td.appendChild(s2);
    }
    tr.appendChild(td);
    var pr = projete[c.formation] || 0;
    [[OF.ent(c.sessions), true], [OF.ent(c.places), false],
     [pr ? OF.eur(pr) : '—', false], [OF.eur(c.vendu), false],
     [pr ? Math.round(100 * c.vendu / pr) + ' %' : '—', false],
     [OF.eur(c.facture), false], [OF.eur(c.vendu - c.facture), false]
    ].forEach(function (x) {
      var tdc = document.createElement('td');
      tdc.className = 'calcul' + (x[1] ? ' calcule' : '');
      tdc.textContent = x[0];
      tr.appendChild(tdc);
    });
    corps.appendChild(tr);
  });
  t.appendChild(corps);
  zone.appendChild(defilant(t));
}

/* ---------------------------------------------- le rythme d'une année --- */
/* POURQUOI « AMPUTÉE DE JUILLET ET AOÛT »
   L'organisme ne forme pas l'été : son année utile fait dix mois, pas douze.
   Le repère n'en devient pas systématiquement plus indulgent — il devient
   juste. Au 30 juin, le calendrier civil dit 49 % alors que six des dix mois
   utiles sont faits, soit 59 % : juger sur 49 % flatte le vendu de dix
   points. Au 1er novembre, c'est l'inverse — 83 % en civil, 80 % en utile —
   parce que les deux mois sautés sont déjà derrière.

   Ce calcul est fait ici et non dans le document : il ne lit aucune donnée
   métier, seulement le calendrier et la date du jour. */
function moisCreux() {
  var p = OF.table('Parametres').filter(function (x) {
    return OF.texte(x.cle) === 'mois_sans_activite';
  })[0];
  var brut = p ? (OF.texte(p.texte) || OF.texte(p.valeur)) : '';
  if (!brut) return [7, 8];                       // juillet, août
  var l = brut.split(/[^0-9]+/).map(Number).filter(function (m) { return m >= 1 && m <= 12; });
  return l.length ? l : [7, 8];
}

var NOMS_MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet',
  'août', 'septembre', 'octobre', 'novembre', 'décembre'];

/* Jours utiles de l'année, et jours utiles écoulés à une date donnée. On
   compte en jours et non en mois : un 15 novembre n'est pas un 1er. */
function rythme(an, aujourdhui) {
  var creux = moisCreux();
  var ignore = {};
  creux.forEach(function (m) { ignore[m] = 1; });
  var d = aujourdhui || new Date();
  var total = 0, ecoule = 0;
  for (var m = 1; m <= 12; m++) {
    if (ignore[m]) continue;
    var jours = new Date(Date.UTC(an, m, 0)).getUTCDate();
    total += jours;
    var finDuMois = new Date(Date.UTC(an, m, 1));
    if (d >= finDuMois) ecoule += jours;
    else {
      var debutDuMois = new Date(Date.UTC(an, m - 1, 1));
      if (d > debutDuMois) ecoule += Math.min(jours, Math.floor((d - debutDuMois) / 86400000));
    }
  }
  return {
    total: total, ecoule: ecoule,
    part: total ? Math.min(1, ecoule / total) : 0,
    creux: creux,
    libelleCreux: creux.map(function (m) { return NOMS_MOIS[m - 1]; }).join(' et '),
    revolue: d >= new Date(Date.UTC(an + 1, 0, 1)),
    future: d < new Date(Date.UTC(an, 0, 1)),
  };
}

/* ------------------------------------------------- le réalisé SmartOF --- */
/* DEUX CHOSES QUI NE SE COMPARENT PAS NAÏVEMENT
   Le projeté couvre l'année entière ; le réalisé ne couvre que ce que le
   widget SmartOF a rapatrié. Comparer un réalisé partiel à une projection
   complète fait lire une catastrophe là où il n'y a qu'un import incomplet.
   La période réellement chargée est donc dite en toutes lettres, avant les
   chiffres, et l'écart n'est montré que pour les années qui ont les deux. */
/* EN GRIST, LE LIBELLÉ ET L'IDENTIFIANT SONT DEUX CHOSES
   Une colonne affichée « Année » peut porter l'identifiant `annee`, `Ann_e`,
   `A` ou tout autre chose selon la façon dont elle a été créée ou renommée.
   Chercher l'identifiant exact fait donc déclarer absente une colonne qui est
   sous les yeux. On la retrouve par son identifiant, à défaut par son
   libellé, accents et casse mis de côté. */
function sansAccent(t) {
  return String(t === null || t === undefined ? '' : t)
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^a-z0-9]/g, '');
}
/* Les libellés que le script pose sur ses colonnes : un identifiant renommé
   se retrouve par là, quand le libellé ne ressemble pas à l'identifiant. */
var LIBELLES_CONNUS = {
  realise_sessions: 'Sessions réalisées',
  realise_places: 'Places vendues (réalisé)',
  realise_vendu: 'Vendu (réalisé)',
  realise_facture: 'Facturé HT (réalisé)',
  reste_a_facturer: 'Reste à facturer',
  ecart_vendu: 'Écart vendu − projeté',
  taux_realisation: 'Taux de réalisation',
  annee: 'Année',
  formation: 'Formation',
  date_debut: 'Début',
  objectif_ca: 'Objectif de CA',
  recettes: 'CA projeté (ventes saisies)',
};
var COLS_RESOLUES = {};
function colonneReelle(table, attendu) {
  var cle = table + '.' + attendu;
  if (Object.prototype.hasOwnProperty.call(COLS_RESOLUES, cle)) return COLS_RESOLUES[cle];
  var meta = OF.doc.colonnes[table] || {};
  var trouve = meta[attendu] ? attendu : null;
  if (!trouve) {
    var cibles = [sansAccent(attendu)];
    if (LIBELLES_CONNUS[attendu]) cibles.push(sansAccent(LIBELLES_CONNUS[attendu]));
    Object.keys(meta).forEach(function (c) {
      if (trouve) return;
      if (cibles.indexOf(sansAccent(c)) >= 0
          || cibles.indexOf(sansAccent(meta[c].libelle)) >= 0) trouve = c;
    });
  }
  /* dernier recours : les données elles-mêmes, si les métadonnées manquent */
  if (!trouve && !Object.keys(meta).length) {
    var l = OF.table(table)[0];
    if (l && attendu in l) trouve = attendu;
  }
  COLS_RESOLUES[cle] = trouve;
  return trouve;
}
function champDe(ligne, table, attendu) {
  var c = colonneReelle(table, attendu);
  return c ? ligne[c] : undefined;
}

/* UNE FORMULE EN ERREUR NE VAUT PAS ZÉRO
   Grist renvoie l'erreur d'une cellule sous la forme ['E', 'TypeDErreur', …].
   Additionnée naïvement, elle disparaît en un zéro qui se lit « rien vendu »
   alors qu'il faut lire « la colonne ne calcule pas ». On la reconnaît. */
function estErreur(v) {
  return Array.isArray(v) && v.length && v[0] === 'E';
}
function messageErreur(v) {
  return estErreur(v) ? (v[1] || 'erreur') + (v[2] ? ' : ' + String(v[2]).slice(0, 120) : '') : '';
}

/* Les colonnes du réalisé qui seraient en erreur dans le document. */
function colonnesEnErreur() {
  var out = [];
  var T = tableSessions();
  var voir = function (table, lignes, champs) {
    champs.forEach(function (c) {
      var reel = colonneReelle(table, c);
      if (!reel) return;
      for (var i = 0; i < lignes.length && i < 200; i++) {
        if (estErreur(lignes[i][reel])) {
          out.push({ table: table, colonne: reel, message: messageErreur(lignes[i][reel]) });
          return;
        }
      }
    });
  };
  voir('Annees', OF.table('Annees'), CHAMPS_ANNEE);
  if (T) voir(T, OF.table(T), ['annee', 'formation', 'places_vendues', 'vendu', 'facture_ht']);
  return out;
}

/* Grist dérive l'identifiant d'une table de son libellé : exiger une casse
   exacte ferait déclarer absente une table qui est là. */
function tableSessions() {
  var connues = Object.keys(OF.doc.colonnes || {});
  if (connues.indexOf('SmartOF_sessions') >= 0) return 'SmartOF_sessions';
  return connues.filter(function (t) {
    return t.toLowerCase() === 'smartof_sessions';
  })[0] || null;
}

/* Deux conditions, et dire laquelle manque vaut mieux que dire « pas prêt ».
   Un script lancé en essai à blanc n'écrit rien : c'est son réglage par
   défaut, et c'est la cause la plus fréquente d'un écran qui ne change pas. */
function diagnosticRealise() {
  var t = tableSessions();
  if (!t) {
    var voisines = Object.keys(OF.doc.colonnes || {})
      .filter(function (x) { return /smartof/i.test(x); }).sort();
    return { pret: false, cause: 'table',
      detail: 'La table <b>SmartOF_sessions</b> est introuvable.'
        + (voisines.length ? ' Le document contient : <b>' + OF.echappe(voisines.join(', '))
            + '</b> — la casse compte.'
          : ' Aucune table du document n\'évoque SmartOF : le widget SmartOF n\'a pas '
            + 'encore rapatrié quoi que ce soit.') };
  }
  var manque = [];
  if (!colonneReelle(t, 'annee')) manque.push(t + '.annee');
  if (!colonneReelle('Annees', 'realise_vendu')) manque.push('Annees.realise_vendu');
  if (!manque.length) return { pret: true };
  return { pret: false, cause: 'colonnes',
    detail: 'La table ' + OF.echappe(t) + ' est bien là, mais '
      + OF.accord(manque.length, 'la colonne', 'les colonnes') + ' <b>'
      + OF.echappe(manque.join(', ')) + '</b> ' + OF.accord(manque.length, 'manque', 'manquent')
      + '.' };
}

function realiseDisponible() { return diagnosticRealise().pret; }

function couverture() {
  var dates = [], T = tableSessions() || 'SmartOF_sessions';
  OF.table(T).forEach(function (s) {
    var d = champDe(s, T, 'date_debut');
    if (typeof d === 'number' && d > 1000000000) dates.push(d * 1000);
    else if (OF.texte(d)) { var t = Date.parse(OF.texte(d)); if (!isNaN(t)) dates.push(t); }
  });
  if (!dates.length) return null;
  var fmt = function (ms) { return new Date(ms).toLocaleDateString('fr-FR'); };
  return { debut: fmt(Math.min.apply(null, dates)), fin: fmt(Math.max.apply(null, dates)),
    sessions: OF.table(T).length };
}

function realiseSection(zone, annees) {
  if (!realiseDisponible()) { realiseAbsent(zone); return; }
  var a = OF.parId(OF.table('Annees'))[idAnnee];
  if (!a) return;
  annees.concat([a]).forEach(normaliserAnnee);

  var fautives = colonnesEnErreur();
  if (fautives.length) {
    var e = document.createElement('p');
    e.className = 'alerte-bloc';
    e.innerHTML = '<b>' + OF.plur(fautives.length, 'colonne') + ' du document '
      + OF.accord(fautives.length, 'est en erreur', 'sont en erreur') + '</b>, et '
      + OF.accord(fautives.length, 'sa valeur', 'leurs valeurs')
      + ' ne vaut donc pas zéro : rien n\'est calculé. '
      + fautives.map(function (f) {
          return '<br><code>' + OF.echappe(f.table + '.' + f.colonne) + '</code> — '
            + OF.echappe(f.message);
        }).join('');
    zone.appendChild(e);
    var e2 = document.createElement('p');
    e2.className = 'note';
    e2.innerHTML = 'Une formule en erreur référence presque toujours un champ sous un nom '
      + 'qu\'il n\'a pas. Relancer <code>realise_smartof_grist.js</code> corrige les formules '
      + 'qu\'il pose : il résout chaque nom avant d\'écrire, et refuse de tourner si un champ '
      + 'manque.';
    zone.appendChild(e2);
  }

  var c = couverture();
  if (c) {
    var p = document.createElement('p');
    p.className = 'note';
    p.innerHTML = 'Ce qui est chargé dans le document : <b>' + OF.plur(c.sessions, 'session')
      + '</b> SmartOF, du <b>' + OF.echappe(c.debut) + '</b> au <b>' + OF.echappe(c.fin)
      + '</b>. Tout ce qui est hors de cette période n\'apparaît pas ci-dessous — ce serait '
      + 'alors un import incomplet, pas un retard.';
    zone.appendChild(p);
  }

  var T = tableSessions() || 'SmartOF_sessions';
  var sansAnnee = OF.table(T).filter(function (s) { return !champDe(s, T, 'annee'); }).length;
  var sansFormation = OF.table(T).filter(function (s) { return !champDe(s, T, 'formation'); }).length;

  var t = document.createElement('div');
  t.className = 'tuiles';
  t.appendChild(tuile('Vendu en ' + a.annee, OF.eur(a.realise_vendu),
    OF.plur(a.realise_sessions, 'session') + ' · ' + OF.plur(a.realise_places, 'place')));
  t.appendChild(tuile('Facturé en ' + a.annee, OF.eur(a.realise_facture),
    a.realise_vendu
      ? Math.round(100 * (a.realise_facture || 0) / a.realise_vendu) + ' % du vendu'
      : 'rien de vendu'));
  t.appendChild(tuile('Reste à facturer', OF.eur(a.reste_a_facturer),
    'vendu non encore émis', (a.reste_a_facturer || 0) > 0 ? 'negatif' : ''));
  if (a.recettes) {
    var ecart = a.ecart_vendu || 0;
    t.appendChild(tuile('Face au projeté', (ecart >= 0 ? '+' : '') + OF.eur(ecart),
      OF.pourcent(a.realise_vendu, a.recettes) + ' de ' + OF.eur(a.recettes) + ' projetés',
      ecart >= 0 ? 'positif' : 'negatif'));
  }
  zone.appendChild(t);

  realiseGraphe(zone, annees);
  realiseTableau(zone, annees);

  var aFaire = [];
  if (sansAnnee) {
    /* Une session hors plan n'est pas forcément une anomalie : les années
       antérieures à la première année déclarée sont le plus souvent des
       essais qu'on ne veut justement pas compter. Le dire autrement qu'un
       défaut évite de chercher à réparer ce qui va bien. */
    var premiere = OF.anneesTriees()[0];
    var anciennes = 0;
    OF.table(T).forEach(function (s) {
      if (champDe(s, T, 'annee')) return;
      var d = champDe(s, T, 'date_debut');
      var an = 0;
      if (typeof d === 'number' && d > 1000000000) an = new Date(d * 1000).getFullYear();
      else if (OF.texte(d)) an = parseInt(String(d).slice(0, 4), 10) || 0;
      if (premiere && an && an < premiere.annee) anciennes++;
    });
    aFaire.push(anciennes === sansAnnee
      ? '<b>' + OF.plur(sansAnnee, 'session') + '</b> ' + OF.accord(sansAnnee, 'est antérieure',
          'sont antérieures') + ' à ' + (premiere ? premiere.annee : 'votre première année')
        + ' et ne ' + OF.accord(sansAnnee, 'compte', 'comptent') + ' nulle part. '
        + 'Si ce sont des essais, c\'est le comportement voulu : rien à faire.'
      : '<b>' + OF.plur(sansAnnee, 'session') + '</b> sans année : '
        + OF.accord(sansAnnee, 'sa date de début tombe', 'leur date de début tombe')
        + ' sur une année absente de la table Annees'
        + (anciennes ? ', dont ' + anciennes + ' avant ' + premiere.annee : '')
        + '. ' + OF.accord(sansAnnee, 'Elle ne compte', 'Elles ne comptent') + ' nulle part ici.');
  }
  if (sansFormation) {
    aFaire.push('<b>' + OF.plur(sansFormation, 'session') + '</b> sans formation : '
      + OF.accord(sansFormation, 'son produit SmartOF n\'est pas rapproché',
          'leurs produits SmartOF ne sont pas rapprochés')
      + ' du catalogue. Le widget SmartOF permet de trancher, dans « La liaison avec le '
      + 'catalogue ».');
  }
  if (aFaire.length) {
    var ul = document.createElement('ul');
    ul.className = 'a-faire';
    ul.style.marginTop = '16px';
    ul.innerHTML = aFaire.map(function (x) { return '<li>' + x + '</li>'; }).join('');
    zone.appendChild(ul);
  }

  var note = document.createElement('p');
  note.className = 'aide';
  note.textContent = 'Le vendu est la somme des budgets des commanditaires : ce qui est '
    + 'engagé. Le facturé est la somme des factures émises, nette des avoirs : ce qui est '
    + 'parti au client. L\'écart entre les deux est ce qui reste à facturer, et il ne se '
    + 'verrait pas si on les confondait.';
  zone.appendChild(note);
}

/* Les colonnes du réalisé peuvent elles aussi porter un identifiant inattendu.
   Plutôt que de truffer l'écran d'appels à champDe, on recopie une fois les
   valeurs sous les noms que le reste du code attend. */
var CHAMPS_ANNEE = ['realise_sessions', 'realise_places', 'realise_vendu',
  'realise_facture', 'reste_a_facturer', 'ecart_vendu', 'taux_realisation',
  'objectif_ca', 'recettes'];
function normaliserAnnee(a) {
  if (!a || a.__realiseNormalise) return;
  CHAMPS_ANNEE.forEach(function (c) {
    if (a[c] === undefined) {
      var v = champDe(a, 'Annees', c);
      if (v !== undefined) a[c] = v;
    }
  });
  a.__realiseNormalise = true;
}

function realiseAbsent(zone) {
  var d = diagnosticRealise();
  var p = document.createElement('p');
  p.className = 'alerte-bloc';
  p.innerHTML = d.detail;
  zone.appendChild(p);

  var q = document.createElement('p');
  q.className = 'note';
  q.innerHTML = d.cause === 'colonnes'
    ? 'Ces colonnes sont posées par le script <code>realise_smartof_grist.js</code>. '
      + 'S\'il a déjà tourné sans rien changer, c\'est presque toujours qu\'il était en '
      + '<b>essai à blanc</b> — son réglage par défaut. Sa dernière ligne dit alors '
      + '« ESSAI À BLANC — rien n\'a été écrit ». Repasser <code>ESSAI_A_BLANC</code> à '
      + '<code>false</code> en tête du script, puis le recoller.'
    : 'Le widget <b>SmartOF</b> rapatrie d\'abord les sessions, les commanditaires et les '
      + 'factures ; le script <code>realise_smartof_grist.js</code> leur pose ensuite '
      + 'l\'année et la formation.';
  zone.appendChild(q);

  var r = document.createElement('p');
  r.className = 'note';
  r.innerHTML = 'Après avoir appliqué le script, <b>rechargez cette page</b> : les types de '
    + 'colonnes sont lus une fois au démarrage du widget.';
  zone.appendChild(r);
}

/* La pile n'est pas un artifice : facturé + reste à facturer = vendu, donc
   l'empilement est exact. Le projeté, lui, n'est pas une quatrième part — il
   ne s'additionne à rien — c'est un repère sur la même échelle, dessiné comme
   l'objectif l'est plus haut. */
function realiseGraphe(zone, annees) {
  var series = ['Facturé', 'Reste à facturer'];
  var parts = [
    function (a) { return a.realise_facture || 0; },
    function (a) { return Math.max(0, (a.realise_vendu || 0) - (a.realise_facture || 0)); },
  ];
  if (!annees.some(function (a) { return a.realise_vendu; })) return;

  var pilotee = OF.parId(OF.table('Annees'))[idAnnee];
  var groupes = annees.map(function (a) {
    var v = parts.map(function (f) { return f(a); });
    var vendu = v[0] + v[1];
    return {
      libelle: String(a.annee), parts: v, repere: a.recettes || 0,
      bulle: '<b>' + a.annee + '</b>'
        + '<span class="second">vendu : ' + OF.eur(vendu) + '</span>'
        + series.map(function (s, i) {
            return v[i] ? '<span class="second">' + OF.echappe(s) + ' : ' + OF.eur(v[i])
              + '</span>' : '';
          }).join('')
        + (a.recettes ? '<span class="second">projeté : ' + OF.eur(a.recettes)
            + ' · réalisation ' + Math.round(100 * vendu / a.recettes) + ' %</span>' : '')
    };
  });

  G.figure(zone, {
    titre: 'Le vendu face au projeté, année par année',
    sous: 'La hauteur totale est le vendu ; le trait pointillé est la projection, sur la '
      + 'même échelle. La part claire est ce qui reste à facturer.',
    haut: 230,
    series: series.map(function (s, i) {
      return { nom: s, valeur: pilotee ? OF.eur(parts[i](pilotee)) + ' en ' + pilotee.annee : '' };
    }),
    chiffres: G.chiffres('Les chiffres',
      ['Mesure'].concat(annees.map(function (a) { return String(a.annee); })),
      [['Projeté'].concat(annees.map(function (a) { return a.recettes ? OF.eur(a.recettes) : '—'; })),
       ['Vendu'].concat(annees.map(function (a) { return a.realise_vendu ? OF.eur(a.realise_vendu) : '—'; })),
       ['Facturé'].concat(annees.map(function (a) { return a.realise_facture ? OF.eur(a.realise_facture) : '—'; })),
       ['Reste à facturer'].concat(annees.map(function (a) {
         var r = (a.realise_vendu || 0) - (a.realise_facture || 0);
         return r ? OF.eur(r) : '—';
       })),
       ['Réalisation'].concat(annees.map(function (a) {
         return a.recettes ? Math.round(100 * (a.realise_vendu || 0) / a.recettes) + ' %' : '—';
       }))]),
    dessin: function (larg, haut) {
      return G.empilees({
        larg: larg, haut: haut, groupes: groupes, series: series,
        total: true, formatVal: OF.eur, unite: 'en €',
        description: 'Vendu par année, réparti entre facturé et reste à facturer, '
          + 'avec la projection en repère.'
      });
    }
  });
}

function realiseTableau(zone, annees) {
  var t = document.createElement('table');
  t.className = 'matrice';
  t.innerHTML = '<thead><tr><th class="gauche">Année</th>'
    + '<th class="calcule">Sessions</th><th>Places</th>'
    + '<th>Projeté</th><th>Vendu</th><th>Réalisation</th>'
    + '<th>Facturé</th><th>Reste à facturer</th></tr></thead>';
  var corps = document.createElement('tbody');
  annees.forEach(function (a) {
    if (!a.realise_sessions && !a.recettes) return;
    var tr = document.createElement('tr');
    if (a.id === idAnnee) tr.className = 'courante';
    var td = document.createElement('td');
    td.className = 'gauche libelle';
    td.textContent = String(a.annee);
    tr.appendChild(td);
    [[OF.ent(a.realise_sessions), true], [OF.ent(a.realise_places), false],
     [a.recettes ? OF.eur(a.recettes) : '—', false],
     [OF.eur(a.realise_vendu), false],
     [a.recettes ? OF.pourcent(a.realise_vendu, a.recettes) : '—', false],
     [OF.eur(a.realise_facture), false],
     [OF.eur(a.reste_a_facturer), false]
    ].forEach(function (c) {
      var tdc = document.createElement('td');
      tdc.className = 'calcul' + (c[1] ? ' calcule' : '');
      tdc.textContent = c[0];
      tr.appendChild(tdc);
    });
    corps.appendChild(tr);
  });
  t.appendChild(corps);
  if (corps.children.length) zone.appendChild(defilant(t));
}

/* ------------------------------------------- externe, mixte et interne --- */
/* Deux granularités, et il ne faut pas les mélanger. Les recettes et les
   places portent un segment : elles se séparent exactement, en deux. Les
   sessions, les coûts et les formations sont portés par la formation, qui
   peut viser les deux publics : trois paniers, et aucun prorata inventé. */
function perimetreDisponible() {
  return colonneExiste('Annees', 'recettes_externes')
    && colonneExiste('Formations', 'perimetre');
}

var PANIERS = [
  { cle: 'Externe', libelle: 'Vendues à l\'extérieur', suffixe: 'externes' },
  { cle: 'Mixte', libelle: 'Les deux publics', suffixe: 'mixtes' },
  { cle: 'Interne', libelle: 'Internes au CHU', suffixe: 'internes' },
];

function perimetreSection(zone, annees) {
  if (!perimetreDisponible()) { perimetreAbsent(zone); return; }
  var a = OF.parId(OF.table('Annees'))[idAnnee];
  if (!a) return;

  var ext = a.recettes_externes || 0, intr = a.recettes_internes || 0;
  var tout = ext + intr;

  var t = document.createElement('div');
  t.className = 'tuiles';
  t.appendChild(tuile('Recettes vendues à l\'extérieur', OF.eur(ext),
    tout ? Math.round(100 * ext / tout) + ' % de la recette ' + a.annee : 'aucune recette',
    ''));
  t.appendChild(tuile('Recettes internes au CHU', OF.eur(intr),
    tout ? Math.round(100 * intr / tout) + ' % de la recette ' + a.annee
         : 'aucune recette interne'));
  t.appendChild(tuile('Places vendues à l\'extérieur', OF.ent(a.places_externes),
    'sur ' + OF.ent((a.places_externes || 0) + (a.places_internes || 0)) + ' places vendues'));
  zone.appendChild(t);

  perimetreGraphe(zone, annees);
  perimetreTableau(zone, a);

  /* Une formation sans segment visé n'est pas interne : c'est une fiche à
     compléter. Les confondre ferait passer un oubli pour une décision. */
  var aQualifier = OF.table('Formations').filter(function (f) {
    return OF.texte(f.perimetre) === 'À qualifier';
  });
  if (aQualifier.length) {
    var av = document.createElement('p');
    av.className = 'alerte-bloc';
    av.style.marginTop = '18px';
    av.textContent = OF.plur(aQualifier.length, 'formation') + ' ne '
      + OF.accord(aQualifier.length, 'vise', 'visent') + ' aucun segment : leur périmètre est '
      + 'indéterminé, et ' + OF.accord(aQualifier.length, 'elle ne compte', 'elles ne comptent')
      + ' dans aucun panier. Le public visé se renseigne sur la fiche formation.';
    zone.appendChild(av);
  }

  var note = document.createElement('p');
  note.className = 'aide';
  note.textContent = 'Les deux tableaux ne découpent pas la même chose. Le premier partage les '
    + 'euros par segment : exact, parce que chaque ligne de vente porte le sien. Le second '
