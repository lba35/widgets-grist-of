      'vendu non encore émis', (a.reste_a_facturer || 0) > 0 ? 'negatif' : ''));
  } else {
    t.appendChild(tuile('Objectif', a.objectif_ca ? OF.eur(a.objectif_ca) : '—',
      a.objectif_ca ? 'fixé pour ' + a.annee : 'non fixé — à saisir en bas de page'));
    t.appendChild(tuile('Projeté', OF.eur(a.recettes),
      OF.plur(a.sessions_total, 'session') + ' · ' + OF.plur(a.places, 'place')));
    t.appendChild(tuile('Résultat', OF.eur(a.resultat),
      a.recettes ? OF.pourcent(a.resultat, a.recettes) + ' de marge' : '—'));
    t.appendChild(tuile('Écart à l\'objectif',
      a.objectif_ca ? OF.eur((a.recettes || 0) - a.objectif_ca) : '—',
      a.objectif_ca ? 'projeté moins objectif' : 'aucun objectif fixé',
      a.objectif_ca && (a.recettes || 0) < a.objectif_ca ? 'negatif' : ''));
  }
  return t;
}

/* Les trois taux, sur une échelle commune. L'attendu est un repère, pas une
   quatrième barre : il dit où l'on devrait être, pas ce qu'on a fait. */
function tauxAnnee(a, r) {
  /* À quoi rapporter le vendu : la projection d'abord, l'objectif à défaut.
     Beaucoup d'années ont un objectif sans projection détaillée — l'année en
     cours notamment, quand le plan commence l'année suivante. */
  var base = a.recettes || 0;
  var origine = 'la projection';
  if (!base && a.objectif_ca) { base = a.objectif_ca; origine = 'l\'objectif de recettes'; }
  var zone = document.createElement('div');

  if (!base) {
    /* Sans dénominateur, les taux n'existent pas — mais l'avancement du
       calendrier, lui, se dit quand même, et les montants aussi. */
    var p = document.createElement('p');
    p.className = 'alerte-bloc';
    p.innerHTML = '<b>' + a.annee + ' n\'a ni projection ni objectif de recettes</b>, donc '
      + 'les trois taux n\'ont rien à quoi se rapporter : « ' + OF.eur(a.realise_vendu)
      + ' vendus sur 0 € prévus » ne voudrait rien dire. Les montants ci-dessous restent '
      + 'justes, seule la comparaison manque.';
    zone.appendChild(p);

    var q = document.createElement('p');
    q.className = 'note';
    q.innerHTML = 'C\'est le cas normal d\'une année antérieure au plan. Pour la comparer '
      + 'malgré tout, deux chemins : poser un <b>objectif de recettes</b> pour ' + a.annee
      + ' en bas de cette page — c\'est une seule case à remplir — ou projeter ses '
      + 'formations comme les autres années.';
    zone.appendChild(q);

    if (!r.future) {
      var o = document.createElement('p');
      o.className = 'note';
      o.textContent = 'À titre indicatif, ' + Math.round(100 * r.part) + ' % de l\'année '
        + 'utile ' + a.annee + ' est écoulée (' + r.ecoule + ' jours sur ' + r.total
        + ', hors ' + r.libelleCreux + ').';
      zone.appendChild(o);
    }
    return zone;
  }

  /* Seul le vendu se juge au rythme attendu. Le facturé suit le vendu avec
     un décalage normal — l'alarmer sur le même repère ferait passer le délai
     d'émission d'une facture pour un retard commercial. */
  var taux = [
    { nom: 'Attendu au ' + new Date().toLocaleDateString('fr-FR'), part: r.part, repere: true,
      detail: r.future ? 'l\'année n\'a pas commencé'
        : (r.revolue ? 'année révolue'
          : r.ecoule + ' jours utiles sur ' + r.total + ', hors ' + r.libelleCreux) },
    { nom: 'Vendu', part: (a.realise_vendu || 0) / base, juge: true,
      detail: OF.eur(a.realise_vendu) + ' sur ' + OF.eur(base) + ' — ' + origine },
    { nom: 'Facturé', part: (a.realise_facture || 0) / base,
      detail: OF.eur(a.realise_facture) + ' émis, soit '
        + (a.realise_vendu ? Math.round(100 * (a.realise_facture || 0) / a.realise_vendu) + ' %'
           : '—') + ' du vendu' },
  ];

  var barres = document.createElement('div');
  barres.className = 'barres';
  taux.forEach(function (x) {
    var pc = Math.round(100 * x.part);
    var l = document.createElement('div');
    l.className = 'barre-ligne';
    var cible = Math.round(100 * r.part);
    var classe = x.repere ? 'repere'
      : (x.juge && !r.future ? (pc < cible - 10 ? 'grave' : (pc < cible ? 'tendu' : '')) : '');
    l.innerHTML = '<span>' + OF.echappe(x.nom) + '</span>'
      + '<span class="jauge"><span class="' + classe + '" style="width:'
      + Math.min(100, Math.max(0, pc)) + '%"></span></span>'
      + '<span class="calcul">' + pc + ' %</span>';
    l.title = x.detail;
    barres.appendChild(l);
  });
  zone.appendChild(barres);

  /* la lecture, en une phrase : c'est l'écart au repère qui se pilote */
  var ecart = Math.round(100 * ((a.realise_vendu || 0) / base - r.part));
  var v = document.createElement('p');
  v.className = 'verdict' + (ecart < -5 ? ' tendu' : '');
  v.innerHTML = r.future
    ? 'Année à venir : rien à comparer encore.'
    : (Math.abs(ecart) <= 5
      ? 'Le vendu suit le rythme attendu, à ' + Math.abs(ecart) + ' point'
        + (Math.abs(ecart) > 1 ? 's' : '') + ' près.'
      : (ecart < 0
        ? '<b>' + Math.abs(ecart) + ' points de retard</b> sur le rythme attendu, soit '
          + OF.eur(base * (r.part - (a.realise_vendu || 0) / base)) + ' qui manquent à ce jour.'
        : '<b>' + ecart + ' points d\'avance</b> sur le rythme attendu, soit '
          + OF.eur(base * ((a.realise_vendu || 0) / base - r.part)) + ' de mieux que prévu.'));
  zone.appendChild(v);

  if (origine !== 'la projection') {
    var src = document.createElement('p');
    src.className = 'note';
    src.innerHTML = a.annee + ' n\'a pas de projection détaillée : les taux se rapportent à '
      + '<b>' + OF.eur(base) + '</b>, l\'objectif de recettes fixé pour cette année.';
    zone.appendChild(src);
  }

  var n = document.createElement('p');
  n.className = 'aide';
  n.textContent = 'L\'attendu compte les jours écoulés de l\'année utile — celle qui exclut '
    + r.libelleCreux + ', où l\'organisme ne forme pas. Au 30 juin, le calendrier civil dirait '
    + '49 % quand six des dix mois utiles sont faits : juger sur l\'année civile flatterait '
    + 'le vendu de dix points. Les mois exclus se règlent dans Parametres, sous '
    + 'mois_sans_activite.';
  zone.appendChild(n);
  return zone;
}

/* LE CROISEMENT, EN UN TABLEAU ET UN GRAPHIQUE
   Quatre montants qui se répondent, et un objectif qui les juge. Le piège
   était de les empiler en quatre barres de même poids : l'objectif se serait
   comparé au vendu comme une mesure parmi d'autres. Il est donc dessiné en
   trait, pas en barre — c'est un seuil, pas un résultat.

   Les pourcentages sont lus dans deux colonnes et non une, parce que les deux
   questions sont distinctes : « où en est-on de ce qu'on s'est promis » (part
   de l'objectif) et « où en est-on de ce qu'on a planifié » (part du projeté).
   Une année peut tenir son objectif en ayant raté son plan, et l'inverse. */
function croisementAnnee(zone, a, avecRealise) {
  var obj = a.objectif_ca || 0;
  var proj = a.recettes || 0;
  var mesures = [
    { libelle: 'Projeté', valeur: proj, couleur: 'var(--serie-2)',
      quoi: 'les sessions et les places saisies dans les fiches' }
  ];
  if (avecRealise) mesures = mesures.concat([
    { libelle: 'Vendu', valeur: a.realise_vendu || 0, couleur: 'var(--serie-1)',
      quoi: 'les commandes enregistrées dans SmartOF' },
    { libelle: 'dont facturé', valeur: a.realise_facture || 0, couleur: 'var(--serie-3)',
      quoi: 'les factures émises, nettes d\'avoirs' },
    { libelle: 'dont à facturer', valeur: a.reste_a_facturer || 0, couleur: 'var(--serie-4)',
      quoi: 'vendu dont la facture n\'est pas encore partie' }
  ]);
  if (!mesures.some(function (m) { return m.valeur; }) && !obj) return;

  var part = function (v, base) {
    return base ? Math.round(100 * v / base) + ' %' : '—';
  };

  G.figure(zone, {
    titre: 'Ce que porte ' + a.annee,
    sous: obj
      ? 'Le trait pointillé est l\'objectif de ' + OF.eur(obj) + ' : les barres qui le '
        + 'dépassent l\'ont franchi.'
      : 'Aucun objectif fixé pour ' + a.annee + ' : les barres se comparent entre elles, '
        + 'rien ne les juge.',
    chiffres: G.chiffres('Les chiffres',
      ['Mesure', 'Montant', 'Part de l\'objectif', 'Part du projeté', 'Ce que c\'est'],
      mesures.map(function (m) {
        return [m.libelle, OF.eur(m.valeur), part(m.valeur, obj), part(m.valeur, proj), m.quoi];
      }).concat(obj ? [['Objectif', OF.eur(obj), '100 %', part(obj, proj),
        'décidé, saisi en bas de cette page']] : [])),
    dessin: function (larg) {
      return G.barresHorizontales({
        larg: larg,
        valeurs: mesures.map(function (m) {
          return { libelle: m.libelle, valeur: m.valeur, couleur: m.couleur,
            bulle: '<b>' + OF.echappe(m.libelle) + '</b><span class="second">' + OF.eur(m.valeur)
              + (obj ? ' · ' + part(m.valeur, obj) + ' de l\'objectif' : '')
              + (proj ? ' · ' + part(m.valeur, proj) + ' du projeté' : '')
              + '</span><span class="second">' + OF.echappe(m.quoi) + '</span>' };
        }),
        repere: obj ? { valeur: obj, libelle: 'objectif ' + OF.eur(obj) } : null,
        formatVal: OF.eur,
        description: 'Projeté, vendu, facturé et reste à facturer pour ' + a.annee
          + (obj ? ', face à l\'objectif de ' + OF.eur(obj) : '') + '.'
      });
    }
  });

  /* la lecture en une phrase : quatre montants, un seul verdict */
  var v = document.createElement('p');
  /* Sans reprise SmartOF, c'est la projection qui se confronte à l'objectif :
     elle dit si le plan tient la promesse, pas si la promesse est tenue. */
  var compare = avecRealise ? (a.realise_vendu || 0) : proj;
  var quoiCompare = avecRealise ? 'vendu' : 'projeté';
  if (obj) {
    var manque = obj - compare;
    v.className = 'verdict' + (manque > 0 ? ' tendu' : '');
    v.innerHTML = manque > 0
      ? '<b>' + OF.eur(manque) + ' manquent</b> au ' + quoiCompare + ' pour atteindre '
        + 'l\'objectif de ' + a.annee + ' — soit ' + part(compare, obj) + ' de fait.'
      : 'Objectif ' + (avecRealise ? 'atteint' : 'couvert par la projection')
        + ' et dépassé de <b>' + OF.eur(-manque) + '</b>.';
  } else {
    v.className = 'note';
    v.innerHTML = 'Pour que ces montants donnent un verdict, il faut un objectif : '
      + 'une seule case, en bas de cette page.';
  }
  zone.appendChild(v);

  /* Le reste à facturer n'est pas un écart, c'est un délai. Le dire, sinon
     il se lit comme une perte. */
  if (avecRealise && (a.reste_a_facturer || 0) > 0) {
    var d = document.createElement('p');
    d.className = 'aide';
    d.textContent = OF.eur(a.reste_a_facturer) + ' de vendu n\'ont pas encore de facture : '
      + 'c\'est un délai d\'émission, pas un manque de ventes. Le vendu est l\'engagement '
      + 'du client, le facturé ce qui est parti en comptabilité.';
    zone.appendChild(d);
  }
}

/* Le détail par formation : c'est là qu'on voit laquelle décroche. */
function detailFormations(zone, a) {
  /* Le même filtre que les totaux — sinon les deux lectures de la même page
     se contredisent, et c'est précisément ce qui est arrivé. */
  var tri = triSessions(function (s, T) { return champDe(s, T, 'annee') === a.id; });
  var T = tri.table || 'SmartOF_sessions';
  var par = {};
  tri.retenues.forEach(function (s) {
    var f = champDe(s, T, 'formation') || 0;
    var c = par[f] = par[f] || { formation: f, sessions: 0, places: 0, vendu: 0, facture: 0 };
    c.sessions++;
    c.places += nombre(champDe(s, T, 'places_vendues'));
    c.vendu += nombre(champDe(s, T, 'vendu'));
    c.facture += nombre(champDe(s, T, 'facture_ht'));
  });
  var lignes = Object.keys(par).map(function (k) { return par[k]; });
  if (!lignes.length) { noteExclusions(zone, tri, 'pour ' + a.annee); return; }
  noteExclusions(zone, tri, 'pour ' + a.annee);
  var aRapprocher = tri.retenues.filter(function (x) { return !champDe(x, T, 'formation'); });

  /* le projeté de chaque formation, pour l'année */
  var projete = {};
  OF.table('Projections').concat(OF.table('Ventes_intra')).forEach(function (p) {
    if (p.annee !== a.id || !p.formation) return;
    projete[p.formation] = (projete[p.formation] || 0) + (p.recette || 0);
  });

  lignes.sort(function (x, y) { return y.vendu - x.vendu; });

  var t = document.createElement('table');
  t.className = 'matrice';
  /* « Réalisation » laissait deviner le dénominateur : on le nomme. */
  t.innerHTML = '<thead><tr><th class="gauche">Formation</th>'
    + '<th class="calcule">Sessions</th><th>Places</th>'
    + '<th>Projeté</th><th>Vendu</th><th>% du projeté</th>'
    + '<th>Facturé</th><th>Reste à facturer</th></tr></thead>';
  var corps = document.createElement('tbody');
  lignes.forEach(function (c) {
    var tr = document.createElement('tr');
    var td = document.createElement('td');
    td.className = 'gauche libelle';
    td.textContent = c.formation ? nom('Formations', c.formation, 'Formation inconnue')
      : 'Produit non rapproché';
    if (!c.formation) {
      var s2 = document.createElement('div');
      s2.className = 'second negatif';
      s2.textContent = 'à rapprocher dans le widget SmartOF';
      td.appendChild(s2);
    }
    tr.appendChild(td);
    var pr = projete[c.formation] || 0;
    [[OF.ent(c.sessions), true], [OF.ent(c.places), false],
     [pr ? OF.eur(pr) : '—', false], [OF.eur(c.vendu), false],
     [pr ? Math.round(100 * c.vendu / pr) + ' %' : '—', false],
     [OF.eur(c.facture), false], [OF.eur(c.vendu - c.facture), false]
    ].forEach(function (x) {
      var tdc = document.createElement('td');
      tdc.className = 'calcul' + (x[1] ? ' calcule' : '');
      tdc.textContent = x[0];
      tr.appendChild(tdc);
    });
    corps.appendChild(tr);
  });
  t.appendChild(corps);
  zone.appendChild(defilant(t));
  blocRapprochement(zone, aRapprocher, T);
}

/* RAPPROCHER SANS CHANGER D'ÉCRAN
   « Produit non rapproché » dans un tableau ne dit pas de quoi il s'agit : ni
   quel produit, ni quelles sessions. On les nomme ici, avec le lien qui ouvre
   la session dans SmartOF — c'est en la lisant qu'on sait à quelle formation
   du catalogue la rattacher. Le choix, lui, se fait dans le widget SmartOF :
   un lien y mène quand son adresse est connue. */
var CLE_PAGE_SMARTOF = 'page_smartof';
function parametreTexte(cle) {
  var p = OF.table('Parametres').filter(function (x) {
    return OF.texte(x.cle) === cle;
  })[0];
  return p ? OF.texte(p.texte).trim() : '';
}

function blocRapprochement(zone, sessions, T) {
  if (!sessions || !sessions.length) return;

  /* une ligne par produit, pas une par session : c'est le produit qui se
     rapproche, et une même formation revient des dizaines de fois */
  var parProduit = {};
  sessions.forEach(function (sess) {
    var cle = OF.texte(champDe(sess, T, 'produit_uid'))
      || OF.texte(champDe(sess, T, 'produit_nom')) || '(inconnu)';
    var c = parProduit[cle] = parProduit[cle]
      || { nom: OF.texte(champDe(sess, T, 'produit_nom')) || '(sans intitulé)',
           code: OF.texte(champDe(sess, T, 'code_gesform')), sessions: [], vendu: 0 };
    c.sessions.push(sess);
    c.vendu += nombre(champDe(sess, T, 'vendu'));
  });
  var produits = Object.keys(parProduit).map(function (k) { return parProduit[k]; })
    .sort(function (x, y) { return y.vendu - x.vendu; });

  var d = document.createElement('div');
  d.className = 'bloc-rapprochement';

  var p = document.createElement('p');
  p.className = 'alerte-bloc';
  p.innerHTML = '<b>' + OF.plur(produits.length, 'produit SmartOF') + '</b> '
    + OF.accord(produits.length, 'n\'est', 'ne sont') + ' pas rapproché'
    + (produits.length > 1 ? 's' : '') + ' du catalogue, pour '
    + OF.eur(produits.reduce(function (n, x) { return n + x.vendu; }, 0))
    + ' de vendu. Ce montant compte dans les totaux de l\'année, mais ne se rattache à '
    + 'aucune formation : il manque donc dans le tableau ci-dessus.';
  d.appendChild(p);

  var t = document.createElement('table');
  t.className = 'matrice';
  t.innerHTML = '<thead><tr><th class="gauche">Produit SmartOF</th>'
    + '<th class="gauche">Code Gesform</th><th class="calcule">Sessions</th>'
    + '<th>Vendu</th><th class="gauche">Ouvrir dans SmartOF</th></tr></thead>';
  var corps = document.createElement('tbody');
  produits.forEach(function (c) {
    var tr = document.createElement('tr');
    var tdN = document.createElement('td');
    tdN.className = 'gauche libelle';
    tdN.textContent = c.nom;
    tr.appendChild(tdN);

    var tdC = document.createElement('td');
    tdC.className = 'gauche';
    tdC.innerHTML = c.code ? '<code>' + OF.echappe(c.code) + '</code>'
      : '<span class="second">custom_field_20 vide</span>';
    tr.appendChild(tdC);

    var tdS = document.createElement('td');
    tdS.className = 'calcul calcule';
    tdS.textContent = OF.ent(c.sessions.length);
    tr.appendChild(tdS);

    var tdV = document.createElement('td');
    tdV.className = 'calcul';
    tdV.textContent = OF.eur(c.vendu);
    tr.appendChild(tdV);

    tr.appendChild(celluleLiens(c.sessions, T));
    corps.appendChild(tr);
  });
  t.appendChild(corps);
  d.appendChild(defilant(t));

  var ou = document.createElement('p');
  ou.className = 'note';
  var page = parametreTexte(CLE_PAGE_SMARTOF);
  if (page) {
    ou.innerHTML = 'Le rapprochement se fait dans le widget SmartOF, section « La liaison '
      + 'avec le catalogue » : <a href="' + OF.echappe(page) + '" target="_blank" '
      + 'rel="noopener noreferrer">ouvrir cette page</a>. Un choix fait là-bas n\'est jamais '
      + 'écrasé par un rafraîchissement.';
  } else {
    ou.innerHTML = 'Le rapprochement se fait dans le widget <b>SmartOF</b>, section « La '
      + 'liaison avec le catalogue ». Collez ici l\'adresse de la page Grist qui le porte, '
      + 'et le lien sera direct la prochaine fois.';
    d.appendChild(ou);
    d.appendChild(saisiePageSmartOF());
    zone.appendChild(d);
    return;
  }
  d.appendChild(ou);
  zone.appendChild(d);
}

/* Enregistrer l'adresse de la page de rapprochement, depuis l'endroit où on
   s'aperçoit qu'elle manque. Demander à l'utilisateur d'aller créer une ligne
   dans Parametres à la main, c'est lui demander de faire le travail du
   widget. */
function saisiePageSmartOF() {
  var d = document.createElement('div');
  d.className = 'barre-synchro';

  var ch = document.createElement('input');
  ch.type = 'url';
  ch.className = 'champ';
  ch.style.flex = '1 1 320px';
  ch.style.textAlign = 'left';
  ch.placeholder = 'https://grist.numerique.gouv.fr/o/docs/…/p/58';
  ch.setAttribute('aria-label', 'Adresse de la page du widget SmartOF');
  d.appendChild(ch);

  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'outil';
  b.textContent = 'Enregistrer l\'adresse';
  d.appendChild(b);

  b.addEventListener('click', function () {
    var v = ch.value.trim();
    if (!/^https?:\/\//i.test(v)) {
      ch.classList.add('erreur');
      OF.signaler('Collez l\'adresse complète de la page, en https', true);
      return;
    }
    ch.classList.remove('erreur');
    b.disabled = true;
    ecrireParametre(CLE_PAGE_SMARTOF, v).then(function () {
      rendre();
    }).catch(function (e) { b.disabled = false; OF.signaler(e.message, true); });
  });
  return d;
}

/* Écrire un réglage dans Parametres : la ligne existe ou se crée.
   La colonne `texte` est celle qui porte les valeurs non numériques ; sans
   elle, on le dit plutôt que d'écrire ailleurs. */
function ecrireParametre(cle, valeur) {
  if (!OF.colonne('Parametres', 'texte').type) {
    return Promise.reject(new Error('La table Parametres n\'a pas de colonne « texte » : '
      + 'le widget SmartOF propose de la créer.'));
  }
  var l = OF.table('Parametres').filter(function (x) {
    return OF.texte(x.cle) === cle;
  })[0];
  var action = l
    ? ['UpdateRecord', 'Parametres', l.id, { texte: valeur }]
    : ['AddRecord', 'Parametres', null, { cle: cle, texte: valeur }];
  return OF.appliquer([action], ['Parametres'], function () {});
}

/* Au plus six numéros : au-delà, la cellule devient un mur. */
function celluleLiens(sessions, T) {
  var td = document.createElement('td');
  td.className = 'gauche';
  var SY = window.SmartOFSync;
  var boite = document.createElement('div');
  boite.className = 'codes-session';
  sessions.slice(0, 6).forEach(function (sess) {
    var code = OF.texte(champDe(sess, T, 'custom_id'))
      || OF.texte(champDe(sess, T, 'nom'))
      || OF.texte(champDe(sess, T, 'uid')).slice(0, 8);
    var url = SY ? SY.lienSession(champDe(sess, T, 'uid')) : null;
    var el;
    if (url) {
      el = document.createElement('a');
      el.href = url; el.target = '_blank'; el.rel = 'noopener noreferrer';
      el.title = 'Ouvrir cette session dans SmartOF';
    } else {
      el = document.createElement('span');
    }
    el.className = 'code-session';
    el.textContent = code;
    boite.appendChild(el);
  });
  td.appendChild(boite);
  if (sessions.length > 6) {
    var p = document.createElement('div');
    p.className = 'second';
    p.textContent = '+ ' + (sessions.length - 6) + ' autres';
    td.appendChild(p);
  }
  return td;
}

/* ---------------------------------------------- le rythme d'une année --- */
/* POURQUOI « AMPUTÉE DE JUILLET ET AOÛT »
   L'organisme ne forme pas l'été : son année utile fait dix mois, pas douze.
   Le repère n'en devient pas systématiquement plus indulgent — il devient
   juste. Au 30 juin, le calendrier civil dit 49 % alors que six des dix mois
   utiles sont faits, soit 59 % : juger sur 49 % flatte le vendu de dix
   points. Au 1er novembre, c'est l'inverse — 83 % en civil, 80 % en utile —
   parce que les deux mois sautés sont déjà derrière.

   Ce calcul est fait ici et non dans le document : il ne lit aucune donnée
   métier, seulement le calendrier et la date du jour. */
function moisCreux() {
  var p = OF.table('Parametres').filter(function (x) {
    return OF.texte(x.cle) === 'mois_sans_activite';
  })[0];
  var brut = p ? (OF.texte(p.texte) || OF.texte(p.valeur)) : '';
  if (!brut) return [7, 8];                       // juillet, août
  var l = brut.split(/[^0-9]+/).map(Number).filter(function (m) { return m >= 1 && m <= 12; });
  return l.length ? l : [7, 8];
}

var NOMS_MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet',
  'août', 'septembre', 'octobre', 'novembre', 'décembre'];

/* Jours utiles de l'année, et jours utiles écoulés à une date donnée. On
   compte en jours et non en mois : un 15 novembre n'est pas un 1er. */
function rythme(an, aujourdhui) {
  var creux = moisCreux();
  var ignore = {};
  creux.forEach(function (m) { ignore[m] = 1; });
  var d = aujourdhui || new Date();
  var total = 0, ecoule = 0;
  for (var m = 1; m <= 12; m++) {
    if (ignore[m]) continue;
    var jours = new Date(Date.UTC(an, m, 0)).getUTCDate();
    total += jours;
    var finDuMois = new Date(Date.UTC(an, m, 1));
    if (d >= finDuMois) ecoule += jours;
    else {
      var debutDuMois = new Date(Date.UTC(an, m - 1, 1));
      if (d > debutDuMois) ecoule += Math.min(jours, Math.floor((d - debutDuMois) / 86400000));
    }
  }
  return {
    total: total, ecoule: ecoule,
    part: total ? Math.min(1, ecoule / total) : 0,
    creux: creux,
    libelleCreux: creux.map(function (m) { return NOMS_MOIS[m - 1]; }).join(' et '),
    revolue: d >= new Date(Date.UTC(an + 1, 0, 1)),
    future: d < new Date(Date.UTC(an, 0, 1)),
  };
}

/* ------------------------------------------------- le réalisé SmartOF --- */
/* DEUX CHOSES QUI NE SE COMPARENT PAS NAÏVEMENT
   Le projeté couvre l'année entière ; le réalisé ne couvre que ce que le
   widget SmartOF a rapatrié. Comparer un réalisé partiel à une projection
   complète fait lire une catastrophe là où il n'y a qu'un import incomplet.
   La période réellement chargée est donc dite en toutes lettres, avant les
   chiffres, et l'écart n'est montré que pour les années qui ont les deux. */
/* EN GRIST, LE LIBELLÉ ET L'IDENTIFIANT SONT DEUX CHOSES
   Une colonne affichée « Année » peut porter l'identifiant `annee`, `Ann_e`,
   `A` ou tout autre chose selon la façon dont elle a été créée ou renommée.
   Chercher l'identifiant exact fait donc déclarer absente une colonne qui est
   sous les yeux. On la retrouve par son identifiant, à défaut par son
   libellé, accents et casse mis de côté. */
function sansAccent(t) {
  return String(t === null || t === undefined ? '' : t)
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^a-z0-9]/g, '');
}
/* Les libellés que le script pose sur ses colonnes : un identifiant renommé
   se retrouve par là, quand le libellé ne ressemble pas à l'identifiant. */
var LIBELLES_CONNUS = {
  realise_sessions: 'Sessions réalisées',
  realise_places: 'Places vendues (réalisé)',
  realise_vendu: 'Vendu (réalisé)',
  realise_facture: 'Facturé HT (réalisé)',
  reste_a_facturer: 'Reste à facturer',
  ecart_vendu: 'Écart vendu − projeté',
  taux_realisation: 'Taux de réalisation',
  annee: 'Année',
  formation: 'Formation',
  date_debut: 'Début',
  objectif_ca: 'Objectif de CA',
  recettes: 'CA projeté (ventes saisies)',
};
var COLS_RESOLUES = {};
function colonneReelle(table, attendu) {
  var cle = table + '.' + attendu;
  if (Object.prototype.hasOwnProperty.call(COLS_RESOLUES, cle)) return COLS_RESOLUES[cle];
  var meta = OF.doc.colonnes[table] || {};
  var trouve = meta[attendu] ? attendu : null;
  if (!trouve) {
    var cibles = [sansAccent(attendu)];
    if (LIBELLES_CONNUS[attendu]) cibles.push(sansAccent(LIBELLES_CONNUS[attendu]));
    Object.keys(meta).forEach(function (c) {
      if (trouve) return;
      if (cibles.indexOf(sansAccent(c)) >= 0
          || cibles.indexOf(sansAccent(meta[c].libelle)) >= 0) trouve = c;
    });
  }
  /* dernier recours : les données elles-mêmes, si les métadonnées manquent */
  if (!trouve && !Object.keys(meta).length) {
    var l = OF.table(table)[0];
    if (l && attendu in l) trouve = attendu;
  }
  COLS_RESOLUES[cle] = trouve;
  return trouve;
}
function champDe(ligne, table, attendu) {
  var c = colonneReelle(table, attendu);
  return c ? ligne[c] : undefined;
}

/* UNE FORMULE EN ERREUR NE VAUT PAS ZÉRO
   Grist renvoie l'erreur d'une cellule sous la forme ['E', 'TypeDErreur', …].
   Additionnée naïvement, elle disparaît en un zéro qui se lit « rien vendu »
   alors qu'il faut lire « la colonne ne calcule pas ». On la reconnaît. */
function estErreur(v) {
  return Array.isArray(v) && v.length && v[0] === 'E';
}
function messageErreur(v) {
  return estErreur(v) ? (v[1] || 'erreur') + (v[2] ? ' : ' + String(v[2]).slice(0, 120) : '') : '';
}

/* Les colonnes du réalisé qui seraient en erreur dans le document. */
function colonnesEnErreur() {
  var out = [];
  var T = tableSessions();
  var voir = function (table, lignes, champs) {
    champs.forEach(function (c) {
      var reel = colonneReelle(table, c);
      if (!reel) return;
      for (var i = 0; i < lignes.length && i < 200; i++) {
        if (estErreur(lignes[i][reel])) {
          out.push({ table: table, colonne: reel, message: messageErreur(lignes[i][reel]) });
          return;
        }
      }
    });
  };
  voir('Annees', OF.table('Annees'), CHAMPS_ANNEE);
  if (T) voir(T, OF.table(T), ['annee', 'formation', 'places_vendues', 'vendu', 'facture_ht']);
  return out;
}

/* Grist dérive l'identifiant d'une table de son libellé : exiger une casse
   exacte ferait déclarer absente une table qui est là. */
function tableSessions() {
  var connues = Object.keys(OF.doc.colonnes || {});
  if (connues.indexOf('SmartOF_sessions') >= 0) return 'SmartOF_sessions';
  return connues.filter(function (t) {
    return t.toLowerCase() === 'smartof_sessions';
  })[0] || null;
}

/* Deux conditions, et dire laquelle manque vaut mieux que dire « pas prêt ».
   Un script lancé en essai à blanc n'écrit rien : c'est son réglage par
   défaut, et c'est la cause la plus fréquente d'un écran qui ne change pas. */
function diagnosticRealise() {
  var t = tableSessions();
  if (!t) {
    var voisines = Object.keys(OF.doc.colonnes || {})
      .filter(function (x) { return /smartof/i.test(x); }).sort();
    return { pret: false, cause: 'table',
      detail: 'La table <b>SmartOF_sessions</b> est introuvable.'
        + (voisines.length ? ' Le document contient : <b>' + OF.echappe(voisines.join(', '))
            + '</b> — la casse compte.'
          : ' Aucune table du document n\'évoque SmartOF : le widget SmartOF n\'a pas '
            + 'encore rapatrié quoi que ce soit.') };
  }
  /* On n'exige plus de colonne d'agrégat dans Annees : le total par année se
     fait ici, à partir des sessions. Ce qu'il faut, c'est que chaque session
     sache son année et son montant. */
  var manque = [];
  if (!colonneReelle(t, 'annee')) manque.push(t + '.annee');
  if (!colonneReelle(t, 'vendu')) manque.push(t + '.vendu');
  if (!manque.length) return { pret: true };
  return { pret: false, cause: 'colonnes',
    detail: 'La table ' + OF.echappe(t) + ' est bien là, mais '
      + OF.accord(manque.length, 'la colonne', 'les colonnes') + ' <b>'
      + OF.echappe(manque.join(', ')) + '</b> ' + OF.accord(manque.length, 'manque', 'manquent')
      + '.' };
}

function realiseDisponible() { return diagnosticRealise().pret; }

/* POURQUOI LE TOTAL PAR ANNÉE SE FAIT ICI, ET NON DANS LE DOCUMENT
   Les colonnes d'agrégat de `Annees` répondaient zéro alors que les colonnes
   de session, elles, calculaient juste : la même page affichait « 0 € vendu »
   en tuile et 481 846 € dans le tableau juste en dessous. Une formule
   d'agrégat qui ne remonte rien est indétectable à l'œil — elle rend un zéro,
   pas une erreur. Et un zéro faux est pire qu'un message d'absence.

   Additionner ici les valeurs que le document a calculées session par session
   n'est pas recalculer : les montants, l'année et la formation viennent tous
   du document, et c'est déjà ce que fait le tableau « formation par
   formation » depuis le début. On ne fait que grouper. */
function nombre(v) { return typeof v === 'number' && isFinite(v) ? v : 0; }

/* UNE SESSION ARCHIVÉE EST EXCLUE — MAIS JAMAIS EN SILENCE
   C'est le défaut qui a coûté le plus cher : le total d'une année excluait
   les sessions archivées, le tableau par formation juste en dessous ne les
   excluait pas. La même page affichait donc « 0 € vendu » en tuile et
   481 846 € trois centimètres plus bas, sans que rien ne l'explique. Les deux
   lectures passent maintenant par cette seule fonction, et le nombre d'exclues
   est affiché dès qu'il y en a.

   La valeur est lue prudemment : la colonne est censée être booléenne, mais
   un import peut y déposer du texte, et en JavaScript la chaîne « false » est
   vraie. On ne considère archivé que ce qui se lit comme tel. */
function estArchive(v) {
  if (v === true) return true;
  if (typeof v === 'string') {
    var t = v.trim().toLowerCase();
    return t === 'true' || t === 'oui' || t === 'vrai' || t === '1' || t === 'y' || t === 'yes';
  }
  return false;
}

/* Les sessions retenues, et ce qui a été écarté — pour pouvoir le dire. */
function triSessions(filtre) {
  var T = tableSessions();
  var out = { table: T, retenues: [], archivees: 0, sansAnnee: 0, total: 0 };
  if (!T) return out;
  OF.table(T).forEach(function (sess) {
    if (filtre && !filtre(sess, T)) return;
    out.total++;
    if (estArchive(champDe(sess, T, 'archive'))) { out.archivees++; return; }
    if (!champDe(sess, T, 'annee')) { out.sansAnnee++; return; }
    out.retenues.push(sess);
  });
  return out;
}

/* Le mot que l'écran dit quand des sessions ont été écartées. Un zéro
   inexpliqué envoie chercher la panne au mauvais endroit. */
function noteExclusions(zone, tri, contexte) {
  if (!tri.archivees && !tri.sansAnnee) return;
  var p = document.createElement('p');
  var toutes = tri.archivees === tri.total && tri.total > 0;
  p.className = toutes ? 'alerte-bloc' : 'note';
  var bouts = [];
  if (tri.archivees) {
    bouts.push('<b>' + OF.plur(tri.archivees, 'session') + ' sur ' + tri.total
      + '</b> ' + OF.accord(tri.archivees, 'est marquée archivée', 'sont marquées archivées')
      + ' et ne ' + OF.accord(tri.archivees, 'compte', 'comptent') + ' pas');
  }
  if (tri.sansAnnee) {
    bouts.push('<b>' + OF.plur(tri.sansAnnee, 'session') + '</b> ' +
      OF.accord(tri.sansAnnee, 'n\'a', 'n\'ont') + ' pas d\'année');
  }
  p.innerHTML = bouts.join(', et ') + (contexte ? ' ' + contexte : '') + '.';
  zone.appendChild(p);

  if (toutes) {
    var q = document.createElement('p');
    q.className = 'note';
    q.innerHTML = 'Toutes les sessions étant écartées, les totaux valent zéro alors que les '
      + 'montants existent bien. La colonne <code>archive</code> vient du champ '
      + '<code>archive</code> de l\'API SmartOF : si l\'API y met autre chose qu\'un '
      + 'booléen — une date, un libellé, la chaîne « false » — tout se retrouve marqué '
      + 'archivé. <b>Relancer le rafraîchissement dans le widget SmartOF</b> réécrit cette '
      + 'colonne correctement et les totaux reviennent ; à défaut, vider la colonne dans '
      + '<code>SmartOF_sessions</code> a le même effet.';
    zone.appendChild(q);
  }
}
var VIDE = { sessions: 0, places: 0, vendu: 0, facture: 0, reste: 0 };
var REALISE_CACHE = null;

function realiseParAnnee() {
  if (REALISE_CACHE) return REALISE_CACHE;
  var tri = triSessions(null);
  var T = tri.table;
  var par = {};
  if (T) {
    tri.retenues.forEach(function (sess) {
      var idA = champDe(sess, T, 'annee');
      var c = par[idA] = par[idA]
        || { sessions: 0, places: 0, vendu: 0, facture: 0 };
      c.sessions++;
      c.places += nombre(champDe(sess, T, 'places_vendues'));
      c.vendu += nombre(champDe(sess, T, 'vendu'));
      c.facture += nombre(champDe(sess, T, 'facture_ht'));
    });
  }
  Object.keys(par).forEach(function (k) { par[k].reste = par[k].vendu - par[k].facture; });
  REALISE_CACHE = par;
  return par;
}
function realiseDe(a) { return (a && realiseParAnnee()[a.id]) || VIDE; }

function couverture() {
  var dates = [], T = tableSessions() || 'SmartOF_sessions';
  OF.table(T).forEach(function (s) {
    var d = champDe(s, T, 'date_debut');
    if (typeof d === 'number' && d > 1000000000) dates.push(d * 1000);
    else if (OF.texte(d)) { var t = Date.parse(OF.texte(d)); if (!isNaN(t)) dates.push(t); }
  });
  if (!dates.length) return null;
  var fmt = function (ms) { return new Date(ms).toLocaleDateString('fr-FR'); };
  return { debut: fmt(Math.min.apply(null, dates)), fin: fmt(Math.max.apply(null, dates)),
    sessions: OF.table(T).length };
}

/* RAFRAÎCHIR SANS CHANGER D'ÉCRAN
   Le réalisé se regarde ici ; aller le chercher ailleurs casse le geste. Le
   moteur est celui du widget SmartOF — le même fichier, pas une copie : deux
   implémentations auraient divergé au premier correctif d'API.

   Deux portées, et le choix n'est pas cosmétique. « Depuis la dernière
   reprise » est rapide mais ne voit que ce que l'API déclare modifié ;
   « tout reprendre » est long mais ne peut rien oublier. Quand il y a un
   doute, c'est la seconde qui tranche — d'où sa présence, et sa mention. */
function barreRafraichir(zone) {
  var SY = window.SmartOFSync;
  if (!SY) return;

  var bloc = document.createElement('div');
  bloc.className = 'barre-synchro';

  var quand = OF.texte(SY.reglage(SY.CLE_DERNIER));
  if (!quand) {
    /* la date lisible peut manquer alors que la date technique est là :
       mieux vaut une date brute que « aucune reprise » sous un bouton qui
       propose justement de repartir de la dernière */
    var iso = OF.texte(SY.reglage(SY.CLE_DERNIER_ISO));
    if (iso) {
      var d = new Date(Date.parse(iso));
      if (!isNaN(d.getTime())) quand = d.toLocaleDateString('fr-FR');
    }
  }
  var info = document.createElement('span');
  info.className = 'second';
  info.textContent = quand ? 'Dernière reprise : ' + quand : 'Aucune reprise enregistrée';
  bloc.appendChild(info);

  if (!SY.configure()) {
    var q = document.createElement('span');
    q.className = 'second';
    q.textContent = '— l\'adresse et la clé se renseignent dans le widget SmartOF.';
    bloc.appendChild(q);
    zone.appendChild(bloc);
    return;
  }

  var incr = SY.repriseIncrementalePossible();
  var sel = document.createElement('select');
  sel.className = 'champ';
  sel.setAttribute('aria-label', 'Portée du rafraîchissement');
  SY.FENETRES.forEach(function (f) {
    if (f.cle === 'depuis' && !incr) return;
    var o = document.createElement('option');
    o.value = f.cle;
    o.textContent = f.cle === 'tout' ? 'Tout reprendre (rien ne peut être oublié)' : f.libelle;
    sel.appendChild(o);
  });
  sel.value = incr ? 'depuis' : 'tout';
  bloc.appendChild(sel);

  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'outil';
  b.textContent = 'Rafraîchir depuis SmartOF';
  bloc.appendChild(b);

  var etat = document.createElement('span');
  etat.className = 'second etat-synchro';
  etat.setAttribute('role', 'status');
  bloc.appendChild(etat);
  zone.appendChild(bloc);
  if (DERNIERE_SYNCHRO) rapportSynchro(zone, DERNIERE_SYNCHRO);

  b.addEventListener('click', function () {
    b.disabled = true; sel.disabled = true;
    etat.textContent = 'Démarrage…';
    SY.rafraichir({ fenetre: sel.value, dire: function (t) { etat.textContent = t; } })
      .then(function (bilan) {
        b.disabled = false; sel.disabled = false;
        /* le rapport est gardé et redessiné avec l'écran : l'insérer ici
           l'aurait fait disparaître au rendu qui suit */
        DERNIERE_SYNCHRO = bilan;
        /* le document a changé sous l'écran : on le relit avant de redessiner */
        return OF.charger(RELIRE_SYNCHRO).catch(function () { return null; });
      })
      .then(function () { REALISE_CACHE = null; rendre(); })
      .catch(function (e) {
        b.disabled = false; sel.disabled = false;
        etat.textContent = '';
        OF.signaler(e.message, true);
      });
  });
}

var RELIRE_SYNCHRO = ['Annees', 'SmartOF_sessions', 'SmartOF_produits',
  'SmartOF_commanditaires', 'SmartOF_factures', 'Parametres'];
/* le bilan de la dernière reprise de cette session d'écran */
var DERNIERE_SYNCHRO = null;
function dateFr(iso) {
  var d = new Date(Date.parse(iso));
  return isNaN(d.getTime()) ? iso : d.toLocaleDateString('fr-FR');
}

/* Ce que la reprise a fait — en clair, et les avertissements en entier :
   une reprise qui a laissé des produits non rapprochés doit le dire ici,
   sinon on ira chercher les montants manquants ailleurs. */
function rapportSynchro(zone, bilan) {
  var d = document.createElement('div');
  d.className = 'rapport-synchro';
  var p = document.createElement('p');
  p.className = bilan.erreur ? 'alerte-bloc' : 'note';
  if (bilan.erreur) {
    p.innerHTML = '<b>Reprise interrompue</b> — ' + OF.echappe(bilan.erreur);
  } else {
    p.innerHTML = '<b>' + OF.plur(bilan.lues, 'ligne') + '</b> ' +
      OF.accord(bilan.lues, 'lue', 'lues') + ' chez SmartOF : '
      + OF.plur(bilan.ajoutees, 'ajoutée') + ', ' + OF.plur(bilan.corrigees, 'corrigée')
      + ', ' + bilan.inchangees + ' inchangées.'
      + (bilan.borne
        ? ' Modifications depuis le ' + OF.echappe(dateFr(bilan.borne)) + '.'
        : ' Reprise complète, sans filtre de date.');
  }
  d.appendChild(p);
  (bilan.avertissements || []).forEach(function (a) {
    var w = document.createElement('p');
    w.className = 'note';
    w.textContent = a;
    d.appendChild(w);
  });
  zone.appendChild(d);
}

/* Les colonnes fautives, dites partout où on lit leurs valeurs — synthèse
   comme onglet d'année. Un zéro faux ne se voit pas ; il faut l'annoncer là
   où il s'affiche, pas seulement sur l'écran d'à côté. */
function alerteErreurs(zone) {
  var fautives = colonnesEnErreur();
  if (!fautives.length) return;
  var e = document.createElement('p');
  e.className = 'alerte-bloc';
  e.innerHTML = '<b>' + OF.plur(fautives.length, 'colonne') + ' du document '
    + OF.accord(fautives.length, 'est en erreur', 'sont en erreur') + '</b>, et '
    + OF.accord(fautives.length, 'sa valeur', 'leurs valeurs')
    + ' ne vaut donc pas zéro : rien n\'est calculé. '
    + fautives.map(function (f) {
        return '<br><code>' + OF.echappe(f.table + '.' + f.colonne) + '</code> — '
          + OF.echappe(f.message);
      }).join('');
  zone.appendChild(e);
  var e2 = document.createElement('p');
  e2.className = 'note';
  e2.innerHTML = 'Une formule en erreur référence presque toujours un champ sous un nom '
    + 'qu\'il n\'a pas. Relancer <code>realise_smartof_grist.js</code> corrige les formules '
    + 'qu\'il pose : il résout chaque nom avant d\'écrire, et refuse de tourner si un champ '
    + 'manque.';
  zone.appendChild(e2);
}

function realiseSection(zone, annees) {
  barreRafraichir(zone);
  if (!realiseDisponible()) { realiseAbsent(zone); return; }
  var a = OF.parId(OF.table('Annees'))[idAnnee];
  if (!a) return;
  OF.table('Annees').forEach(normaliserAnnee);

  alerteErreurs(zone);

  var c = couverture();
  if (c) {
    var p = document.createElement('p');
    p.className = 'note';
    p.innerHTML = 'Ce qui est chargé dans le document : <b>' + OF.plur(c.sessions, 'session')
      + '</b> SmartOF, du <b>' + OF.echappe(c.debut) + '</b> au <b>' + OF.echappe(c.fin)
      + '</b>. Tout ce qui est hors de cette période n\'apparaît pas ci-dessous — ce serait '
      + 'alors un import incomplet, pas un retard.';
    zone.appendChild(p);
  }

  noteExclusions(zone, triSessions(null), 'sur l\'ensemble du document');

  var T = tableSessions() || 'SmartOF_sessions';
  var sansAnnee = OF.table(T).filter(function (s) { return !champDe(s, T, 'annee'); }).length;
  var sansFormation = OF.table(T).filter(function (s) { return !champDe(s, T, 'formation'); }).length;

  var t = document.createElement('div');
  t.className = 'tuiles';
  t.appendChild(tuile('Vendu en ' + a.annee, OF.eur(a.realise_vendu),
    OF.plur(a.realise_sessions, 'session') + ' · ' + OF.plur(a.realise_places, 'place')));
  t.appendChild(tuile('Facturé en ' + a.annee, OF.eur(a.realise_facture),
    a.realise_vendu
      ? Math.round(100 * (a.realise_facture || 0) / a.realise_vendu) + ' % du vendu'
      : 'rien de vendu'));
  t.appendChild(tuile('Reste à facturer', OF.eur(a.reste_a_facturer),
    'vendu non encore émis', (a.reste_a_facturer || 0) > 0 ? 'negatif' : ''));
  if (a.recettes) {
    var ecart = a.ecart_vendu || 0;
    t.appendChild(tuile('Face au projeté', (ecart >= 0 ? '+' : '') + OF.eur(ecart),
      OF.pourcent(a.realise_vendu, a.recettes) + ' de ' + OF.eur(a.recettes) + ' projetés',
      ecart >= 0 ? 'positif' : 'negatif'));
  }
  zone.appendChild(t);

  realiseGraphe(zone, annees);
  realiseTableau(zone, annees);

  var aFaire = [];
  if (sansAnnee) {
    /* Une session hors plan n'est pas forcément une anomalie : les années
       antérieures à la première année déclarée sont le plus souvent des
       essais qu'on ne veut justement pas compter. Le dire autrement qu'un
       défaut évite de chercher à réparer ce qui va bien. */
    var premiere = OF.anneesTriees()[0];
    var anciennes = 0;
    OF.table(T).forEach(function (s) {
      if (champDe(s, T, 'annee')) return;
      var d = champDe(s, T, 'date_debut');
      var an = 0;
      if (typeof d === 'number' && d > 1000000000) an = new Date(d * 1000).getFullYear();
      else if (OF.texte(d)) an = parseInt(String(d).slice(0, 4), 10) || 0;
      if (premiere && an && an < premiere.annee) anciennes++;
    });
    aFaire.push(anciennes === sansAnnee
      ? '<b>' + OF.plur(sansAnnee, 'session') + '</b> ' + OF.accord(sansAnnee, 'est antérieure',
          'sont antérieures') + ' à ' + (premiere ? premiere.annee : 'votre première année')
        + ' et ne ' + OF.accord(sansAnnee, 'compte', 'comptent') + ' nulle part. '
        + 'Si ce sont des essais, c\'est le comportement voulu : rien à faire.'
      : '<b>' + OF.plur(sansAnnee, 'session') + '</b> sans année : '
        + OF.accord(sansAnnee, 'sa date de début tombe', 'leur date de début tombe')
        + ' sur une année absente de la table Annees'
        + (anciennes ? ', dont ' + anciennes + ' avant ' + premiere.annee : '')
        + '. ' + OF.accord(sansAnnee, 'Elle ne compte', 'Elles ne comptent') + ' nulle part ici.');
  }
  if (sansFormation) {
    aFaire.push('<b>' + OF.plur(sansFormation, 'session') + '</b> sans formation : '
      + OF.accord(sansFormation, 'son produit SmartOF n\'est pas rapproché',
          'leurs produits SmartOF ne sont pas rapprochés')
      + ' du catalogue. Le widget SmartOF permet de trancher, dans « La liaison avec le '
      + 'catalogue ».');
  }
  if (aFaire.length) {
    var ul = document.createElement('ul');
    ul.className = 'a-faire';
    ul.style.marginTop = '16px';
    ul.innerHTML = aFaire.map(function (x) { return '<li>' + x + '</li>'; }).join('');
    zone.appendChild(ul);
  }

  var note = document.createElement('p');
  note.className = 'aide';
  note.textContent = 'Le vendu est la somme des budgets des commanditaires : ce qui est '
    + 'engagé. Le facturé est la somme des factures émises, nette des avoirs : ce qui est '
    + 'parti au client. L\'écart entre les deux est ce qui reste à facturer, et il ne se '
    + 'verrait pas si on les confondait.';
  zone.appendChild(note);
}

/* Les colonnes du réalisé peuvent elles aussi porter un identifiant inattendu.
   Plutôt que de truffer l'écran d'appels à champDe, on recopie une fois les
   valeurs sous les noms que le reste du code attend. */
var CHAMPS_ANNEE = ['objectif_ca', 'recettes'];
function normaliserAnnee(a) {
  if (!a || a.__realiseNormalise) return;
  CHAMPS_ANNEE.forEach(function (c) {
    if (a[c] === undefined) {
      var v = champDe(a, 'Annees', c);
      if (v !== undefined) a[c] = v;
    }
  });
  /* le réalisé vient des sessions, pas de colonnes d'agrégat */
  var r = realiseDe(a);
  a.realise_sessions = r.sessions;
  a.realise_places = r.places;
  a.realise_vendu = r.vendu;
  a.realise_facture = r.facture;
  a.reste_a_facturer = r.reste;
  a.ecart_vendu = a.recettes ? r.vendu - a.recettes : 0;
  a.__realiseNormalise = true;
}

function realiseAbsent(zone) {
  var d = diagnosticRealise();
  var p = document.createElement('p');
  p.className = 'alerte-bloc';
  p.innerHTML = d.detail;
  zone.appendChild(p);

  var q = document.createElement('p');
  q.className = 'note';
  q.innerHTML = d.cause === 'colonnes'
    ? 'Ces colonnes sont posées par le script <code>realise_smartof_grist.js</code>. '
      + 'S\'il a déjà tourné sans rien changer, c\'est presque toujours qu\'il était en '
      + '<b>essai à blanc</b> — son réglage par défaut. Sa dernière ligne dit alors '
      + '« ESSAI À BLANC — rien n\'a été écrit ». Repasser <code>ESSAI_A_BLANC</code> à '
      + '<code>false</code> en tête du script, puis le recoller.'
    : 'Le widget <b>SmartOF</b> rapatrie d\'abord les sessions, les commanditaires et les '
      + 'factures ; le script <code>realise_smartof_grist.js</code> leur pose ensuite '
      + 'l\'année et la formation.';
  zone.appendChild(q);

  var r = document.createElement('p');
  r.className = 'note';
  r.innerHTML = 'Après avoir appliqué le script, <b>rechargez cette page</b> : les types de '
    + 'colonnes sont lus une fois au démarrage du widget.';
  zone.appendChild(r);
}

/* La pile n'est pas un artifice : facturé + reste à facturer = vendu, donc
   l'empilement est exact. Le projeté, lui, n'est pas une quatrième part — il
   ne s'additionne à rien — c'est un repère sur la même échelle, dessiné comme
   l'objectif l'est plus haut. */
function realiseGraphe(zone, annees) {
  annees.forEach(normaliserAnnee);
  var series = ['Facturé', 'Reste à facturer'];
  var parts = [
    function (a) { return a.realise_facture || 0; },
    function (a) { return Math.max(0, (a.realise_vendu || 0) - (a.realise_facture || 0)); },
  ];
  if (!annees.some(function (a) { return a.realise_vendu; })) return;

  var pilotee = OF.parId(OF.table('Annees'))[idAnnee];
  var groupes = annees.map(function (a) {
    var v = parts.map(function (f) { return f(a); });
    var vendu = v[0] + v[1];
    return {
      libelle: String(a.annee), parts: v, repere: a.recettes || 0,
      bulle: '<b>' + a.annee + '</b>'
        + '<span class="second">vendu : ' + OF.eur(vendu) + '</span>'
        + series.map(function (s, i) {
            return v[i] ? '<span class="second">' + OF.echappe(s) + ' : ' + OF.eur(v[i])
              + '</span>' : '';
          }).join('')
        + (a.recettes ? '<span class="second">projeté : ' + OF.eur(a.recettes)
            + ' · réalisation ' + Math.round(100 * vendu / a.recettes) + ' %</span>' : '')
    };
  });

  G.figure(zone, {
    titre: 'Le vendu face au projeté, année par année',
    sous: 'La hauteur totale est le vendu ; le trait pointillé est la projection, sur la '
      + 'même échelle. La part claire est ce qui reste à facturer.',
    haut: 230,
    series: series.map(function (s, i) {
      return { nom: s, valeur: pilotee ? OF.eur(parts[i](pilotee)) + ' en ' + pilotee.annee : '' };
    }),
    chiffres: G.chiffres('Les chiffres',
      ['Mesure'].concat(annees.map(function (a) { return String(a.annee); })),
      [['Objectif'].concat(annees.map(function (a) { return a.objectif_ca ? OF.eur(a.objectif_ca) : '—'; })),
       ['Projeté'].concat(annees.map(function (a) { return a.recettes ? OF.eur(a.recettes) : '—'; })),
       ['Vendu'].concat(annees.map(function (a) { return a.realise_vendu ? OF.eur(a.realise_vendu) : '—'; })),
       ['Facturé'].concat(annees.map(function (a) { return a.realise_facture ? OF.eur(a.realise_facture) : '—'; })),
       ['Reste à facturer'].concat(annees.map(function (a) {
         var r = (a.realise_vendu || 0) - (a.realise_facture || 0);
         return r ? OF.eur(r) : '—';
       })),
       ['% de l\'objectif'].concat(annees.map(function (a) {
         return a.objectif_ca
           ? Math.round(100 * (a.realise_vendu || 0) / a.objectif_ca) + ' %' : '—';
       })),
       ['% du projeté'].concat(annees.map(function (a) {
         return a.recettes ? Math.round(100 * (a.realise_vendu || 0) / a.recettes) + ' %' : '—';
       }))]),
    dessin: function (larg, haut) {
      return G.empilees({
        larg: larg, haut: haut, groupes: groupes, series: series,
        total: true, formatVal: OF.eur, unite: 'en €',
        description: 'Vendu par année, réparti entre facturé et reste à facturer, '
          + 'avec la projection en repère.'
      });
    }
  });
}

function realiseTableau(zone, annees) {
  annees.forEach(normaliserAnnee);
  var t = document.createElement('table');
  t.className = 'matrice';
  /* On croise quatre montants et deux taux. Le « % objectif » et le
     « % projeté » répondent à deux questions différentes : ce qu'on s'était
     promis, et ce qu'on avait planifié. Les confondre dans une colonne
     « Réalisation » laissait le lecteur deviner le dénominateur. */
  t.innerHTML = '<thead><tr><th class="gauche">Année</th>'
    + '<th class="calcule">Sessions</th><th>Places</th>'
    + '<th>Objectif</th><th>Projeté</th><th>Vendu</th>'
    + '<th>% objectif</th><th>% projeté</th>'
    + '<th>Facturé</th><th>Reste à facturer</th></tr></thead>';
  var corps = document.createElement('tbody');
  annees.forEach(function (a) {
    if (!a.realise_sessions && !a.recettes && !a.objectif_ca) return;
    var tr = document.createElement('tr');
    if (a.id === idAnnee) tr.className = 'courante';
    var td = document.createElement('td');
    td.className = 'gauche libelle';
    td.textContent = String(a.annee);
    tr.appendChild(td);
    [[OF.ent(a.realise_sessions), true], [OF.ent(a.realise_places), false],
     [a.objectif_ca ? OF.eur(a.objectif_ca) : '—', false],
     [a.recettes ? OF.eur(a.recettes) : '—', false],
     [OF.eur(a.realise_vendu), false],
     [a.objectif_ca ? OF.pourcent(a.realise_vendu, a.objectif_ca) : '—', false],
     [a.recettes ? OF.pourcent(a.realise_vendu, a.recettes) : '—', false],
     [OF.eur(a.realise_facture), false],
     [OF.eur(a.reste_a_facturer), false]
    ].forEach(function (c) {
      var tdc = document.createElement('td');
      tdc.className = 'calcul' + (c[1] ? ' calcule' : '');
      tdc.textContent = c[0];
      tr.appendChild(tdc);
    });
    corps.appendChild(tr);
  });
  t.appendChild(corps);
  if (corps.children.length) zone.appendChild(defilant(t));
}

/* ------------------------------------------- externe, mixte et interne --- */
/* Deux granularités, et il ne faut pas les mélanger. Les recettes et les
   places portent un segment : elles se séparent exactement, en deux. Les
   sessions, les coûts et les formations sont portés par la formation, qui
   peut viser les deux publics : trois paniers, et aucun prorata inventé. */
function perimetreDisponible() {
  return colonneExiste('Annees', 'recettes_externes')
    && colonneExiste('Formations', 'perimetre');
}

var PANIERS = [
  { cle: 'Externe', libelle: 'Vendues à l\'extérieur', suffixe: 'externes' },
  { cle: 'Mixte', libelle: 'Les deux publics', suffixe: 'mixtes' },
  { cle: 'Interne', libelle: 'Internes au CHU', suffixe: 'internes' },
];

function perimetreSection(zone, annees) {
  if (!perimetreDisponible()) { perimetreAbsent(zone); return; }
  var a = OF.parId(OF.table('Annees'))[idAnnee];
  if (!a) return;

  var ext = a.recettes_externes || 0, intr = a.recettes_internes || 0;
  var tout = ext + intr;

  var t = document.createElement('div');
  t.className = 'tuiles';
  t.appendChild(tuile('Recettes vendues à l\'extérieur', OF.eur(ext),
    tout ? Math.round(100 * ext / tout) + ' % de la recette ' + a.annee : 'aucune recette',
    ''));
  t.appendChild(tuile('Recettes internes au CHU', OF.eur(intr),
    tout ? Math.round(100 * intr / tout) + ' % de la recette ' + a.annee
         : 'aucune recette interne'));
  t.appendChild(tuile('Places vendues à l\'extérieur', OF.ent(a.places_externes),
    'sur ' + OF.ent((a.places_externes || 0) + (a.places_internes || 0)) + ' places vendues'));
  zone.appendChild(t);

  perimetreGraphe(zone, annees);
  perimetreTableau(zone, a);

  /* Une formation sans segment visé n'est pas interne : c'est une fiche à
     compléter. Les confondre ferait passer un oubli pour une décision. */
  var aQualifier = OF.table('Formations').filter(function (f) {
    return OF.texte(f.perimetre) === 'À qualifier';
  });
  if (aQualifier.length) {
    var av = document.createElement('p');
    av.className = 'alerte-bloc';
    av.style.marginTop = '18px';
    av.textContent = OF.plur(aQualifier.length, 'formation') + ' ne '
      + OF.accord(aQualifier.length, 'vise', 'visent') + ' aucun segment : leur périmètre est '
      + 'indéterminé, et ' + OF.accord(aQualifier.length, 'elle ne compte', 'elles ne comptent')
      + ' dans aucun panier. Le public visé se renseigne sur la fiche formation.';
    zone.appendChild(av);
  }

  var note = document.createElement('p');
  note.className = 'aide';
  note.textContent = 'Les deux tableaux ne découpent pas la même chose. Le premier partage les '
    + 'euros par segment : exact, parce que chaque ligne de vente porte le sien. Le second '
    + 'range les formations selon le public qu\'elles visent, et une formation vendue aux deux '
    + 'a ses recettes des deux côtés du premier tableau tout en occupant une seule ligne du '
    + 'second. Ses sessions et ses coûts ne se divisent pas : les répartir au prorata '
    + 'inventerait une précision qui n\'existe pas.';
  zone.appendChild(note);
}

function perimetreAbsent(zone) {
  var p = document.createElement('p');
  p.className = 'alerte-bloc';
  p.innerHTML = 'Le document ne distingue pas encore l\'interne de l\'externe. Le script '
    + '<code>perimetre_interne_grist.js</code> ajoute une case « Public interne au CHU » sur '
    + 'la table Segments, en déduit le périmètre de chaque formation, et ventile les recettes '
    + 'et les places. Il se colle dans la console du navigateur, sur la page du document.';
  zone.appendChild(p);
}

function perimetreGraphe(zone, annees) {
  var series = ['Vendu à l\'extérieur', 'Interne au CHU'];
  var colonnes = [
    function (a) { return a.recettes_externes || 0; },
    function (a) { return a.recettes_internes || 0; },
  ];
  if (!annees.some(function (a) { return colonnes[0](a) || colonnes[1](a); })) return;

  var pilotee = OF.parId(OF.table('Annees'))[idAnnee];
  var groupes = annees.map(function (a) {
    var parts = colonnes.map(function (f) { return f(a); });
    var total = parts[0] + parts[1];
    return {
      libelle: String(a.annee), parts: parts,
      bulle: '<b>' + a.annee + '</b> — ' + OF.eur(total)
        + series.map(function (s, i) {
          return parts[i] ? '<span class="second">' + OF.echappe(s) + ' : ' + OF.eur(parts[i])
            + ' · ' + Math.round(100 * parts[i] / total) + ' %</span>' : '';
        }).join('')
    };
  });

  G.figure(zone, {
    titre: 'Recettes selon le public, année par année',
    sous: 'Le partage se fait ligne de vente par ligne de vente, selon son segment.',
    haut: 210,
    series: series.map(function (s, i) {
      return { nom: s, valeur: pilotee
        ? OF.eur(colonnes[i](pilotee)) + ' en ' + pilotee.annee : '' };
    }),
    chiffres: G.chiffres('Les chiffres',
      ['Public'].concat(annees.map(function (a) { return String(a.annee); })),
      series.map(function (s, i) {
        return [s].concat(annees.map(function (a) {
          return colonnes[i](a) ? OF.eur(colonnes[i](a)) : '—';
        }));
      }).concat([['Part externe'].concat(annees.map(function (a) {
        var tt = colonnes[0](a) + colonnes[1](a);
        return tt ? Math.round(100 * colonnes[0](a) / tt) + ' %' : '—';
      }))])),
    dessin: function (larg, haut) {
      return G.empilees({
        larg: larg, haut: haut, groupes: groupes, series: series,
        total: true, unite: 'en €',
        description: 'Recettes par année, réparties entre public externe et public interne.'
      });
    }
  });
}

/* Deux tableaux et non un seul, parce que ce sont deux découpages différents
   du même euro. Les recettes et les places se partagent par SEGMENT : exact,
   deux cases. Les sessions, les coûts et les formations se partagent par
   FORMATION : trois cases, dont une pour celles qui visent les deux publics.
   Les réunir dans une seule grille ferait lire la recette interne comme
   « la recette des formations internes », ce qu'elle n'est pas — une partie
   vient des formations mixtes. */
function perimetreTableau(zone, a) {
  var t1 = document.createElement('table');
  t1.className = 'matrice';
  t1.innerHTML = '<thead><tr><th class="gauche">Ce qui est vendu, par public</th>'
    + '<th class="calcule">Recettes</th><th>Part</th><th>Places</th></tr></thead>';
  var c1 = document.createElement('tbody');
  var totR = (a.recettes_externes || 0) + (a.recettes_internes || 0);
  var totP = (a.places_externes || 0) + (a.places_internes || 0);
  [['À l\'extérieur', 'recettes_externes', 'places_externes',
    'établissements clients, quelle que soit la formation'],
   ['En interne', 'recettes_internes', 'places_internes',
    'personnel du CHU, quelle que soit la formation']
  ].forEach(function (L) {
    var tr = document.createElement('tr');
    var td = document.createElement('td');
    td.className = 'gauche libelle';
    td.textContent = L[0];
    var sd = document.createElement('div');
    sd.className = 'second';
    sd.textContent = L[3];
    td.appendChild(sd);
    tr.appendChild(td);
    [[OF.eur(a[L[1]]), true],
     [totR ? Math.round(100 * (a[L[1]] || 0) / totR) + ' %' : '—', false],
     [OF.ent(a[L[2]]), false]
    ].forEach(function (c) {
      var tdc = document.createElement('td');
      tdc.className = 'calcul' + (c[1] ? ' calcule' : '');
      tdc.textContent = c[0];
      tr.appendChild(tdc);
    });
    c1.appendChild(tr);
  });
  var tot1 = document.createElement('tr');
  tot1.className = 'total';
  tot1.innerHTML = '<td class="gauche libelle" style="font-weight:600">Total ' + a.annee + '</td>'
    + '<td class="calcul calcule" style="font-weight:600">' + OF.eur(totR) + '</td>'
    + '<td class="calcul">100 %</td>'
    + '<td class="calcul">' + OF.ent(totP) + '</td>';
  c1.appendChild(tot1);
  t1.appendChild(c1);
  zone.appendChild(defilant(t1));

  var t2 = document.createElement('table');
  t2.className = 'matrice';
  t2.style.marginTop = '22px';
  t2.innerHTML = '<thead><tr><th class="gauche">Les formations, par périmètre</th>'
    + '<th class="calcule">Formations</th><th>Sessions</th><th>Coûts</th></tr></thead>';
  var c2 = document.createElement('tbody');
  PANIERS.forEach(function (p) {
    var tr = document.createElement('tr');
    var td = document.createElement('td');
    td.className = 'gauche libelle';
    td.textContent = p.libelle;
    var sd = document.createElement('div');
    sd.className = 'second';
    sd.textContent = p.cle === 'Mixte'
      ? 'visent les deux publics : leurs sessions ne se divisent pas'
      : (p.cle === 'Externe' ? 'ne visent que des segments externes'
                             : 'ne visent que des segments internes');
    td.appendChild(sd);
    tr.appendChild(td);
    [[OF.ent(a['formations_' + p.suffixe]), true],
     [OF.ent(a['sessions_' + p.suffixe]), false],
     [OF.eur(a['couts_' + p.suffixe]), false]
    ].forEach(function (c) {
      var tdc = document.createElement('td');
      tdc.className = 'calcul' + (c[1] ? ' calcule' : '');
      tdc.textContent = c[0];
      tr.appendChild(tdc);
    });
    c2.appendChild(tr);
  });
  var sommeCol = function (champ) {
    return PANIERS.reduce(function (n, p) { return n + (a[champ + p.suffixe] || 0); }, 0);
  };
  var tot2 = document.createElement('tr');
  tot2.className = 'total';
  tot2.innerHTML = '<td class="gauche libelle" style="font-weight:600">Total ' + a.annee + '</td>'
    + '<td class="calcul calcule" style="font-weight:600">' + OF.ent(sommeCol('formations_')) + '</td>'
    + '<td class="calcul">' + OF.ent(sommeCol('sessions_')) + '</td>'
    + '<td class="calcul">' + OF.eur(sommeCol('couts_')) + '</td>';
  c2.appendChild(tot2);
  t2.appendChild(c2);
  zone.appendChild(defilant(t2));
}

/* Ce taux s'appelait « remplissage », et c'était trompeur : vous affectez les
   places comme si tout se vendait, donc il mesure ce qui est déjà attribué à
   un segment, pas ce qui se vendra. Un remplissage de 86 % annonçait une
   prévision ; une affectation de 86 % dit qu'il reste 14 % de places ouvertes
   que personne ne s'est encore vu attribuer. Ce n'est pas la même chose, et
   l'écran ne doit pas les confondre. */
function grapheAffectation(zone, annees) {
  if (!annees.some(function (a) { return a.remplissage_inter; })) {
    rienADessiner(zone, 'Part des places déjà affectée, par année',
      'Aucune place n\'est encore affectée à un segment. L\'affectation se fait par la '
      + '<b>fiche formation</b>, dans les projections de chaque année.');
    return;
  }
  var valeurs = annees.map(function (a) {
    var pc = a.remplissage_inter ? Math.round(100 * a.remplissage_inter) : null;
    return {
      libelle: String(a.annee),
      valeur: pc,
      bulle: '<b>' + a.annee + '</b> — ' + (pc === null ? 'non calculé'
        : pc + ' % des places ouvertes sont affectées')
        + '<span class="second">' + OF.plur(a.places || 0, 'place') + ' '
        + OF.accord(a.places || 0, 'affectée', 'affectées') + ' sur '
        + OF.plur(a.sessions_inter || 0, 'session') + ' inter</span>'
        + (pc !== null && pc < 100
          ? '<span class="second">il reste ' + (100 - pc) + ' % de places ouvertes '
            + 'non attribuées</span>' : '')
    };
  });

  G.figure(zone, {
    titre: 'Part des places ouvertes déjà affectée',
    sous: 'Places attribuées à un segment, rapportées aux places ouvertes par les sessions. '
      + 'Ce n\'est pas une prévision de ventes : c\'est l\'avancement de la projection. '
      + 'Ce qui se vendra vraiment se règle juste en dessous.',
    haut: 190,
    chiffres: G.chiffres('Les chiffres',
      ['', 'Affectation', 'Places affectées', 'Sessions inter'],
      annees.map(function (a) {
        return [String(a.annee),
          a.remplissage_inter ? Math.round(100 * a.remplissage_inter) + ' %' : '—',
          OF.ent(a.places || 0), OF.ent(a.sessions_inter || 0)];
      })),
    dessin: function (larg, haut) {
      return G.ligne({
        larg: larg, haut: haut, valeurs: valeurs, unite: 'en %',
        echelleFixe: { bas: 0, haut: 100, ticks: [0, 25, 50, 75, 100] },
        formatY: function (v) { return v + ' %'; },
        formatVal: function (v) { return v + ' %'; },
        description: 'Part des places ouvertes déjà affectée à un segment, année par année.'
      });
    }
  });
}

/* Le tableau de référence : toutes les lignes, toutes les années. */
function tableauAnnees(zone, annees) {
  zone.appendChild(titre('Toutes les lignes, année par année'));
  var t = document.createElement('table');
  t.className = 'matrice';
  t.innerHTML = '<thead><tr><th class="gauche"></th>'
    + annees.map(function (a) { return '<th>' + a.annee + '</th>'; }).join('')
    + '</tr></thead>';
  var corps = document.createElement('tbody');

  var ligne = function (libelle, lire, fort) {
    var tr = document.createElement('tr');
    var td = document.createElement('td');
    td.className = 'gauche libelle';
    td.textContent = libelle;
    if (fort) td.style.fontWeight = '600';
    tr.appendChild(td);
    annees.forEach(function (a) {
      var c = document.createElement('td');
      c.className = 'calcul';
      var v = lire(a);
      c.textContent = v.texte;
      if (fort) { c.style.fontWeight = '600'; c.style.color = 'var(--encre)'; }
      if (v.classe) c.classList.add(v.classe);
      tr.appendChild(c);
    });
    corps.appendChild(tr);
  };
  var brut = function (c, f) {
    return function (a) { return { texte: (a[c] || a[c] === 0) ? f(a[c]) : '—' }; };
  };

  ligne('Sessions', brut('sessions_total', OF.ent), true);
  ligne('dont inter', brut('sessions_inter', OF.ent));
  ligne('dont intra', brut('sessions_intra', OF.ent));
  ligne('Places', brut('places', OF.ent));
  if (colonneExiste('Annees', 'heures_stagiaires')) {
    ligne('Heures stagiaires', brut('heures_stagiaires', OF.ent));
  }
  ligne('Remplissage inter', function (a) {
    return { texte: a.remplissage_inter ? Math.round(100 * a.remplissage_inter) + ' %' : '—' };
  });
  ligne('Recettes', brut('recettes', OF.eur), true);
  ligne('Coûts', brut('couts', OF.eur));
  ligne('Résultat', function (a) {
    return { texte: (a.resultat || a.resultat === 0) ? OF.eur(a.resultat) : '—',
      classe: a.resultat > 0 ? 'positif' : (a.resultat < 0 ? 'negatif' : '') };
  }, true);
  ligne('Taux de marge', function (a) {
    return { texte: a.recettes ? Math.round(100 * (a.resultat || 0) / a.recettes) + ' %' : '—' };
  });
  objectifsTenus().forEach(function (o) {
    ligne('Objectif · ' + o.libelle, brut(o.col, o.format));
    ligne('Écart · ' + o.libelle, function (a) {
      if (!a[o.col]) return { texte: '—' };
      var e = (a[o.reel] || 0) - a[o.col];
      return { texte: (e >= 0 ? '+' : '') + o.format(e), classe: e >= 0 ? 'positif' : 'negatif' };
    });
  });
  t.appendChild(corps);
  zone.appendChild(defilant(t));
}

/* Un tableau plus large que le widget défile dans sa bande ; il ne pousse pas
   la page, sinon tout l'écran se décale horizontalement. */
function defilant(t) {
  var d = document.createElement('div');
  d.className = 'defilant';
  d.appendChild(t);
  return d;
}

/* ---------------------------------------------------------- objectifs -- */
/* La seule saisie de cet écran. Un objectif ne se calcule pas : il se
   décide. On l'écrit donc dans la table Annees, à côté du réalisé qui lui
   fait face. */
/* LA LECTURE D'ENSEMBLE, EN SYNTHÈSE — LA MAIN EST DANS LES ONGLETS
   Le tableau de saisie vivait ici, toutes années confondues : pour remplir
   une case il fallait trouver sa ligne parmi huit, et l'objectif se saisissait
   loin du réalisé qu'il juge. La saisie est donc passée dans l'onglet de
   chaque année. Reste ici ce que la synthèse sait faire mieux : les mettre
   toutes côte à côte.

   Quatre colonnes de montants et deux de taux, c'est la croix complète :
   ce qu'on visait, ce qu'on a planifié, ce qu'on a vendu, ce qui est parti en
   facture. Un clic sur l'année ouvre son onglet. */
function editeurObjectifs(zone, annees) {
  var possibles = objectifsPossibles();
  var tenus = objectifsTenus();
  var manquants = possibles.filter(function (o) { return tenus.indexOf(o) < 0; });
  var avecRealise = realiseDisponible();
  if (avecRealise) OF.table('Annees').forEach(normaliserAnnee);
  else annees.forEach(normaliserAnnee);

  zone.appendChild(titre('Objectifs et réalisé, toutes années'));

  if (tenus.length) {
    var p = document.createElement('p');
    p.className = 'note';
    p.innerHTML = 'Lecture seule ici. <b>La saisie se fait dans l\'onglet de chaque '
      + 'année</b>, à côté de ce que l\'objectif juge — cliquez sur une année pour l\'ouvrir.';
    zone.appendChild(p);

    var t = document.createElement('table');
    t.className = 'matrice objectifs';
    t.style.marginTop = '12px';
    t.innerHTML = '<thead><tr><th class="gauche">Année</th>'
      + '<th>Objectif</th><th class="calcule">Projeté</th>'
      + (avecRealise ? '<th>Vendu</th><th>Facturé</th><th>% de l\'objectif</th>' : '')
      + '<th>Écart au ' + (avecRealise ? 'vendu' : 'projeté') + '</th></tr></thead>';
    var corps = document.createElement('tbody');
    var principal = tenus[0];

    annees.forEach(function (a) {
      var tr = document.createElement('tr');

      /* l'année est un bouton, pas un libellé : c'est le chemin vers la saisie */
      var tdA = document.createElement('td');
      tdA.className = 'gauche an';
      var lien = document.createElement('button');
      lien.type = 'button';
      lien.className = 'lien-annee';
      lien.textContent = a.annee;
      lien.title = 'Ouvrir l\'onglet ' + a.annee;
      lien.addEventListener('click', function () {
        vue = String(a.id); idAnnee = a.id; rendre();
      });
      tdA.appendChild(lien);
      tr.appendChild(tdA);

      var obj = a[principal.col] || 0;
      var proj = a[principal.reel] || 0;
      var vendu = avecRealise ? (a.realise_vendu || 0) : null;
      var cellules = [
        [obj ? principal.format(obj) : '—', 'calcul'],
        [principal.format(proj), 'calcul calcule']
      ];
      if (avecRealise) {
        cellules.push([OF.eur(vendu), 'calcul']);
        cellules.push([OF.eur(a.realise_facture || 0), 'calcul']);
        cellules.push([obj ? Math.round(100 * vendu / obj) + ' %' : '—',
          'calcul' + (obj ? (vendu >= obj ? ' positif' : '') : '')]);
      }
      /* L'écart se mesure sur le vendu dès qu'on l'a : c'est lui qui est
         réel. Sans réalisé, on retombe sur le projeté. */
      var compare = avecRealise ? vendu : proj;
      cellules.push(obj
        ? [(compare - obj >= 0 ? '+' : '') + principal.format(compare - obj),
           'calcul ' + (compare >= obj ? 'positif' : 'negatif')]
        : ['—', 'calcul']);

      cellules.forEach(function (c) {
        var td = document.createElement('td');
        td.className = c[1];
        td.textContent = c[0];
        tr.appendChild(td);
      });
      corps.appendChild(tr);
    });
    t.appendChild(corps);
    zone.appendChild(defilant(t));

    var leg = document.createElement('p');
    leg.className = 'aide';
    leg.textContent = avecRealise
      ? 'L\'objectif et le projeté portent sur ' + principal.libelle.toLowerCase()
        + '. L\'écart se mesure au vendu, pas au projeté : c\'est le vendu qui est réel.'
      : 'Sans reprise SmartOF, l\'écart se mesure au projeté. Le widget SmartOF ramène le '
        + 'vendu et le facturé.';
    zone.appendChild(leg);

    if (tenus.length > 1) {
      var autres = document.createElement('p');
      autres.className = 'note';
      autres.textContent = 'Les autres objectifs suivis — '
        + tenus.slice(1).map(function (o) { return o.libelle.toLowerCase(); }).join(', ')
        + ' — se lisent et se saisissent dans l\'onglet de chaque année.';
      zone.appendChild(autres);
    }
  }

  colonnesObjectifAbsentes(zone, manquants, tenus.length);
}

/* LES OBJECTIFS D'UNE SEULE ANNÉE
   Ils se saisissaient dans un tableau de la synthèse, toutes années mêlées :
   huit lignes de cases pour en remplir une. Ici, on est déjà dans l'année —
   il n'y a qu'une ligne possible, et la case est à côté de ce qu'elle juge.

   La synthèse garde la lecture d'ensemble ; c'est l'onglet qui porte la main. */
function objectifsAnnee(zone, a) {
  var possibles = objectifsPossibles();
  var tenus = objectifsTenus();
  var manquants = possibles.filter(function (o) { return tenus.indexOf(o) < 0; });

  if (!OF.doc.metaOk) {
    var m = document.createElement('p');
    m.className = 'alerte-bloc';
    m.textContent = 'Les types de colonnes du document ne sont pas lisibles : les objectifs '
      + 'restent affichés mais ne sont pas modifiables ici, pour ne pas risquer d\'écrire une '
      + 'valeur du mauvais type. Vérifiez que le widget a l\'accès complet au document.';
    zone.appendChild(m);
    return;
  }

  if (tenus.length) {
    var aide = document.createElement('p');
    aide.className = 'note';
    aide.textContent = 'La valeur part à l\'enregistrement quand vous quittez la case ou '
      + 'appuyez sur Entrée ; tout l\'écran se recalcule ensuite depuis le document.';
    zone.appendChild(aide);

    var t = document.createElement('table');
    t.className = 'matrice objectifs';
    t.style.marginTop = '12px';
    /* Sans reprise SmartOF, la colonne « Vendu » n'aurait que des tirets :
       on ne la dresse pas, et l'écart se dit alors au projeté. */
    var avecVendu = realiseDisponible();
    t.innerHTML = '<thead><tr><th class="gauche">Ce que l\'on vise</th>'
      + '<th class="gauche">Objectif ' + a.annee + '</th>'
      + '<th class="calcule">Projeté</th>'
      + (avecVendu ? '<th>Vendu</th>' : '')
      + '<th>Écart au ' + (avecVendu ? 'vendu' : 'projeté') + '</th></tr></thead>';
    var corps = document.createElement('tbody');

    tenus.forEach(function (o) {
      var tr = document.createElement('tr');

      var tdL = document.createElement('td');
      tdL.className = 'gauche libelle';
      tdL.textContent = o.libelle;
      tr.appendChild(tdL);

      var tdS = document.createElement('td');
      tdS.className = 'gauche';
      tdS.appendChild(celluleObjectif(a, o));
      tr.appendChild(tdS);

      var proj = a[o.reel] || 0;
      var tdP = document.createElement('td');
      tdP.className = 'calcul calcule';
      tdP.textContent = o.format(proj);
      tr.appendChild(tdP);

      /* Le vendu n'existe que pour ce que SmartOF sait dire : les recettes et
         les sessions. Pour le résultat ou les heures stagiaires, la colonne
         reste vide — mieux vaut un tiret qu'un zéro qui se lirait comme un
         échec. */
      var aVendu = o.vendu && avecVendu;
      var vendu = aVendu ? (a[o.vendu] || 0) : null;
      if (avecVendu) {
        var tdV = document.createElement('td');
        tdV.className = 'calcul';
        tdV.textContent = aVendu ? o.format(vendu) : '—';
        tr.appendChild(tdV);
      }

      var tdE = document.createElement('td');
      tdE.className = 'calcul';
      if (a[o.col] && aVendu) {
        var e = vendu - a[o.col];
        tdE.textContent = (e >= 0 ? '+' : '') + o.format(e);
        tdE.classList.add(e >= 0 ? 'positif' : 'negatif');
      } else if (a[o.col] && !aVendu) {
        var e2 = proj - a[o.col];
        tdE.textContent = (e2 >= 0 ? '+' : '') + o.format(e2);
        tdE.title = 'écart au projeté : aucun réalisé n\'est disponible pour cette mesure';
        tdE.classList.add(e2 >= 0 ? 'positif' : 'negatif');
      } else {
        tdE.textContent = '—';
      }
      tr.appendChild(tdE);
      corps.appendChild(tr);
    });
    t.appendChild(corps);
    zone.appendChild(defilant(t));

    var leg = document.createElement('p');
    leg.className = 'aide';
    leg.textContent = avecVendu
      ? 'Le projeté vient des fiches formation, le vendu de SmartOF. L\'écart se mesure au '
        + 'vendu quand il existe pour cette mesure, au projeté sinon — l\'infobulle le dit.'
      : 'Le projeté vient des fiches formation. Le vendu apparaîtra ici dès que le widget '
        + 'SmartOF aura repris le réalisé.';
    zone.appendChild(leg);
  }

  colonnesObjectifAbsentes(zone, manquants, tenus.length);
}

/* Le bouton qui crée les colonnes manquantes, partagé par les deux écrans. */
function colonnesObjectifAbsentes(zone, manquants, dejaDesObjectifs) {
  if (!manquants.length) return;
  var bloc = document.createElement('p');
  bloc.className = 'note';
  bloc.style.marginTop = dejaDesObjectifs ? '18px' : '0';
  bloc.textContent = dejaDesObjectifs
    ? 'D\'autres objectifs peuvent être suivis — ' + manquants.map(function (o) {
        return o.libelle.toLowerCase();
      }).join(', ') + ' — mais la colonne correspondante n\'existe pas encore dans la table '
      + 'Annees.'
    : 'Aucune colonne d\'objectif n\'existe encore dans la table Annees. Elle peut être créée '
      + 'd\'ici : une colonne numérique par objectif, à côté du réalisé.';
  zone.appendChild(bloc);

  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'outil';
  b.style.marginTop = '10px';
  b.textContent = 'Créer ' + (manquants.length > 1
    ? 'les ' + manquants.length + ' colonnes d\'objectif manquantes'
    : 'la colonne « ' + manquants[0].titre + ' »');
  b.addEventListener('click', function () {
    b.disabled = true;
    OF.appliquer(manquants.map(function (o) {
      return ['AddVisibleColumn', 'Annees', o.col, {
        type: 'Numeric', label: o.titre, widgetOptions: '{"decimals":0,"maxDecimals":0}'
      }];
    }), TABLES, function () {
      OF.chargerColonnes().then(rendre);
    }).catch(function () { b.disabled = false; });
  });
  zone.appendChild(b);
}

function celluleObjectif(annee, obj) {
  var el = document.createElement('input');
  el.className = 'champ';
  el.id = 'obj-' + obj.col + '-' + annee.id;
  el.inputMode = 'decimal';
  el.placeholder = '—';
  el.setAttribute('aria-label', obj.titre + ' ' + annee.annee);
  var v = annee[obj.col];
  el.value = (v || v === 0) ? OF.ent(v) : '';
  var origine = el.value;

  /* une colonne formule ne se saisit pas : on l'affiche sans la proposer */
  if (OF.colonne('Annees', obj.col).formule) {
    el.disabled = true;
    el.title = 'Calculé par le document';
    return el;
  }

  /* Enregistrement à la sortie du champ, pas pendant la frappe : l'écran se
     redessine après coup, et on ne redessine pas sous les doigts. */
  el.addEventListener('change', function () {
    var brut = el.value.trim();
    var val = brut === '' ? null : OF.nombre(brut);
    if (val !== null && !obj.signe && val < 0) {
      el.classList.add('erreur');
      OF.signaler('Un objectif négatif n\'a pas de sens ici', true);
      return;
    }
    if ((val === null && origine === '') || (val !== null && OF.ent(val) === origine)) return;
    el.classList.remove('erreur');
    var champs = {};
    champs[obj.col] = val;
    focusARendre = el.id;
    OF.appliquer([['UpdateRecord', 'Annees', annee.id, champs]], TABLES, rendre)
      .catch(function () { el.classList.add('erreur'); focusARendre = null; });
  });
  el.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { el.value = origine; el.blur(); }
    if (ev.key === 'Enter') el.blur();
  });
  return el;
}

/* ------------------------------------------------------------- montage -- */
function rendreOnglets() {
  var zone = OF.$('onglets');
  var annees = OF.anneesTriees();
  var vues = [{ cle: 'synthese', nom: 'Synthèse' }].concat(annees.map(function (a) {
    return { cle: String(a.id), nom: String(a.annee) };
