  }));
  var ids = vues.map(function (v) { return v.cle; }).join(',');
  if (zone.dataset.ids !== ids) {
    zone.dataset.ids = ids;
    zone.innerHTML = '';
    vues.forEach(function (v) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'onglet';
      b.setAttribute('role', 'tab');
      b.textContent = v.nom;
      b.dataset.vue = v.cle;
      b.addEventListener('click', function () {
        vue = v.cle;
        /* l'année regardée devient l'année pilotée de l'écran : les sections
           qui lisent idAnnee suivent sans qu'on ait deux sélecteurs */
        if (v.cle !== 'synthese') idAnnee = +v.cle;
        rendre();
      });
      zone.appendChild(b);
    });
  }
  Array.prototype.forEach.call(zone.querySelectorAll('.onglet'), function (b) {
    b.setAttribute('aria-selected', String(b.dataset.vue === vue));
  });
}

function rendre() {
  G.oublier();
  REALISE_CACHE = null;
  VENTILE_CACHE = null;
  rendreOnglets();
  var page = OF.$('page');
  page.innerHTML = '';
  var a = vue === 'synthese' ? null : OF.parId(OF.table('Annees'))[+vue];
  page.appendChild(a ? pageAnnee(a) : pageProjection());
  G.redessiner();            // la largeur n'est connue qu'une fois la page posée
  rendreAvance();
  if (focusARendre) {
    var el = OF.$(focusARendre);
    focusARendre = null;
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}

function rendreAvance() {
  var annee = OF.parId(OF.table('Annees'))[idAnnee];
  OF.$('avance').innerHTML = annee
    ? '<span>Recettes <b>' + OF.eur(annee.recettes || 0) + '</b></span>'
      + '<span>Résultat <b>' + OF.eur(annee.resultat || 0) + '</b></span>'
      + '<span>Sessions <b>' + OF.ent(annee.sessions_total || 0) + '</b></span>'
      + '<span class="version" title="Version de pilotage.html actuellement servie">'
        + VERSION + '</span>'
    : '<span class="version">' + VERSION + '</span>';
}

/* le bandeau de la synthèse garde son sélecteur d'année : il sert à choisir
   l'année détaillée dans les sections qui n'en montrent qu'une */

/* La table peut exister sous une autre casse : TABLES ne l'aurait pas
   chargée, et elle paraîtrait vide alors qu'elle est pleine. */
function chargerSessionsSmartOF() {
  var t = tableSessions();
  if (!t || TABLES.indexOf(t) >= 0 || OF.table(t).length) return Promise.resolve();
  return OF.charger([t]).catch(function () { return null; });
}

/* Le ventilé du facturé traverse trois tables : facture → commanditaire →
   organisation. Aucune n'est dans TABLES, et chacune peut manquer — le
   chargement ne doit donc jamais faire échouer le démarrage. */
var TABLES_FACTURE = ['SmartOF_factures', 'SmartOF_commanditaires',
  'SmartOF_produits', 'Organisations_clientes'];
function tableProche(attendu) {
  var connues = Object.keys(OF.doc.colonnes || {});
  if (connues.indexOf(attendu) >= 0) return attendu;
  var bas = attendu.toLowerCase();
  return connues.filter(function (t) { return t.toLowerCase() === bas; })[0] || null;
}
function chargerFacturation() {
  var aCharger = TABLES_FACTURE.map(tableProche).filter(function (t) {
    return t && TABLES.indexOf(t) < 0 && !OF.table(t).length;
  });
  if (!aCharger.length) return Promise.resolve();
  return OF.charger(aCharger).catch(function () { return null; });
}

/* La table des gestionnaires n'est pas dans TABLES : son nom dépend du
   document, on le déduit du type de la colonne. */
function chargerGestionnaires() {
  var t = tableDeRef('Formations', 'gestionnaire');
  if (!t || TABLES.indexOf(t) >= 0 || OF.table(t).length) return Promise.resolve();
  return OF.charger([t]).catch(function () { return null; });
}

function demarrer() {
  var annees = OF.anneesTriees();
  if (!annees.length) { OF.echouer('Aucune année dans la table Annees.'); return; }
  /* les sessions d'abord : le choix de l'année de départ en dépend */
  Promise.all([chargerSessionsSmartOF(), chargerGestionnaires(), chargerFacturation()])
    .then(function () {
    var d = anneeDeDepart();
    idAnnee = d ? d.id : annees[0].id;
    rendre();
  }, function () {
    var d = anneeDeDepart();
    idAnnee = d ? d.id : annees[0].id;
    rendre();
  });
}

if (typeof window.TEST_SANS_DEMARRAGE === 'undefined') OF.initialiser(TABLES, demarrer);
window.__pilotage = { demarrer: function () { OF.initialiser(TABLES, demarrer); }, rendre: rendre };
</script>
