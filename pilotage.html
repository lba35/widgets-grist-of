<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilotage de l'organisme de formation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="commun.css?v=10">
<style>
  .onglets { display: flex; gap: 2px; flex: 0 0 auto; }
  .onglet { padding: 7px 14px; background: none; border: 1px solid transparent;
    border-radius: 3px; cursor: pointer; color: var(--sourd); }
  .onglet:hover { background: var(--papier); }
  .onglet[aria-selected="true"] { background: var(--papier); color: var(--encre);
    border-color: var(--trait); font-weight: 500; }
  .onglet:focus-visible { outline: none; box-shadow: var(--ombre-focus); }
  .verdict { margin: 0 0 24px; padding: 14px 16px; font-size: 15px; line-height: 1.5;
    background: var(--surface); border-left: 3px solid var(--fait); max-width: 80ch; }
  .verdict.tendu { border-left-color: var(--afaire); }
  .verdict b { font-weight: 600; }
  .rangs { margin: 0; padding: 0; list-style: none; }
  .rangs li { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px;
    align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--trait); }
  .rangs li:last-child { border-bottom: 0; }
  .rang { font-size: 15px; color: var(--sourd); font-variant-numeric: tabular-nums; }
  .rang-detail { font-size: 12.5px; color: var(--sourd); }
  .rang-val { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .barres { display: grid; gap: 7px; margin: 0 0 8px; }
  .barre-ligne { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px;
    align-items: center; font-size: 13px; }
  .jauge { height: 9px; background: var(--trait); border-radius: 5px; overflow: hidden; }
  .jauge span { display: block; height: 100%; background: var(--fait); border-radius: 5px; }
  .jauge span.tendu { background: var(--afaire); }
  .jauge span.grave { background: var(--alerte); }
  .a-faire { margin: 0; padding-left: 18px; }
  .a-faire li { margin-bottom: 7px; }
  .objectifs th.gauche { padding-left: 0; }
  .objectifs td .champ { width: 96px; }
  .objectifs .an { font-size: 15px; }
</style>
</head>
<body>
<div id="app" aria-busy="true">
  <div class="barre">
    <div class="onglets" role="tablist">
      <button class="onglet" id="t-recrutement" role="tab" type="button" aria-selected="true">Recrutement</button>
      <button class="onglet" id="t-projection" role="tab" type="button" aria-selected="false">Projection</button>
    </div>
    <select class="recherche" id="annee" aria-label="Année pilotée" style="flex:0 0 auto"></select>
    <div class="avance" id="avance"></div>
  </div>
  <div class="corps">
    <div class="page" id="page"><p class="vide">Chargement du document…</p></div>
  </div>
</div>
<div class="etat-sauve" id="sauve" role="status" aria-live="polite"></div>

<script src="commun.js?v=10"></script>
<script src="graphes.js?v=10"></script>
<script>
/* =========================================================================
   Pilotage — les deux tableaux de bord.

   Onglet Recrutement : combien d'intervenants recruter, de quel profil,
   dans quel ordre, et ce qui empêche encore de décider.
   Onglet Projection : la trajectoire pluriannuelle — recettes face aux
   objectifs, résultat, composition par domaine, remplissage — en
   graphiques, en chiffres, et les objectifs à fixer année par année.

   Aucun calcul n'est refait ici : tout vient des colonnes formules du
   document, pour que l'écran et le document ne puissent pas diverger. Les
   objectifs sont la seule chose que cet écran écrit, parce qu'ils ne se
   déduisent de rien : ce sont des décisions.
   ========================================================================= */
'use strict';

/* Affiché dans le bandeau : une page sortie du cache montre l'ancien numéro. */
var VERSION = 'v10';

var TABLES = ['Annees', 'Formations', 'Intervenants', 'Intervenants_formation', 'Vivier',
  'Projections', 'Ventes_inter', 'Ventes_intra', 'Parametres', 'Gestionnaire', 'Domaines', 'Charge'];

/* Les objectifs que l'écran sait tenir. Chacun n'apparaît que si la colonne
   de réalisé existe dans la table Annees ; la colonne d'objectif, elle, peut
   être créée depuis l'écran. */
var OBJECTIFS = [
  { col: 'objectif_ca', libelle: 'Recettes', titre: 'Objectif de recettes',
    reel: 'recettes', format: OF.eur },
  { col: 'objectif_resultat', libelle: 'Résultat', titre: 'Objectif de résultat',
    reel: 'resultat', format: OF.eur, signe: true },
  { col: 'objectif_sessions', libelle: 'Sessions', titre: 'Objectif de sessions',
    reel: 'sessions_total', format: OF.ent },
  { col: 'objectif_heures_stagiaires', libelle: 'Heures stagiaires',
    titre: 'Objectif d\'heures stagiaires', reel: 'heures_stagiaires', format: OF.ent }
];

var ongletCourant = 'recrutement', idAnnee = null, focusARendre = null;

function nom(t, id, defaut) {
  var l = OF.parId(OF.table(t))[id];
  return (l && OF.texte(l.intitule)) || defaut;
}
function parametre(cle) {
  var p = OF.table('Parametres').filter(function (x) { return x.cle === cle; })[0];
  return p ? (p.valeur || 0) : 0;
}
function vivierDe(idA) {
  return OF.table('Vivier').filter(function (v) { return v.annee === idA && v.formation; });
}
function couple(v) {
  return nom('Formations', v.formation, 'Sans titre') + ' / '
    + nom('Intervenants', v.ressource, 'profil non renseigné');
}
function somme(L, c) { return L.reduce(function (n, v) { return n + (v[c] || 0); }, 0); }

/* Une colonne existe-t-elle ? D'abord les métadonnées, sinon les données. */
function colonneExiste(t, c) {
  var meta = OF.doc.colonnes[t];
  if (meta && Object.keys(meta).length) return !!meta[c];
  return OF.table(t).some(function (l) { return c in l; });
}
function objectifsPossibles() {
  return OBJECTIFS.filter(function (o) { return colonneExiste('Annees', o.reel); });
}
function objectifsTenus() {
  return objectifsPossibles().filter(function (o) { return colonneExiste('Annees', o.col); });
}

/* L'horizon affiché : toutes les années déclarées, fenêtrées à huit pour que
   les graphiques restent lisibles. */
function anneesAffichees() {
  var toutes = OF.anneesTriees();
  if (toutes.length <= 8) return toutes;
  var i = 0;
  toutes.forEach(function (a, k) { if (a.id === idAnnee) i = k; });
  var debut = Math.min(Math.max(0, i - 1), toutes.length - 8);
  return toutes.slice(debut, debut + 8);
}

/* ------------------------------------------------------- indicateurs --- */
function indicateur(feu, libelle, valeur, cible) {
  var d = document.createElement('div');
  d.className = 'ind';
  d.innerHTML = '<span class="ind-feu">' + feu + '</span>'
    + '<span>' + OF.echappe(libelle) + '</span>'
    + '<span class="ind-val">' + OF.echappe(valeur) + '</span>'
    + '<span class="ind-cible">' + OF.echappe(cible || '') + '</span>';
  return d;
}
function tuile(libelle, valeur, contexte, classe) {
  var d = document.createElement('div');
  d.className = 'tuile';
  d.innerHTML = '<div class="tuile-lib">' + OF.echappe(libelle) + '</div>'
    + '<div class="tuile-val' + (classe ? ' ' + classe : '') + '">' + OF.echappe(valeur) + '</div>'
    + '<div class="tuile-ctx">' + (contexte || '') + '</div>';
  return d;
}
function titre(t) {
  var h = document.createElement('h2');
  h.textContent = t;
  return h;
}

/* ------------------------------------------------------- recrutement --- */
function pageRecrutement() {
  var zone = document.createElement('div');
  var annee = OF.parId(OF.table('Annees'))[idAnnee];
  var lignes = vivierDe(idAnnee);

  var h1 = document.createElement('h1');
  h1.textContent = 'Pilotage du recrutement — ' + (annee ? annee.annee : '');
  zone.appendChild(h1);

  if (!lignes.length) {
    var v = document.createElement('p');
    v.className = 'alerte-bloc';
    v.textContent = 'Aucune ligne de vivier pour cette année : le widget Plan de charge permet '
      + 'de les créer d\'après les intervenants décrits sur les formations projetées.';
    zone.appendChild(v);
    return zone;
  }

  var seuil = parametre('vivier_minimum');
  var actifs = lignes.filter(function (v) { return v.interventions_requises; });
  var requis = somme(actifs, 'interventions_requises');
  var couvert = somme(actifs, 'interventions_couvertes');
  var manque = somme(actifs, 'interventions_manquantes');
  var recruter = somme(lignes, 'a_recruter');
  var candidats = somme(lignes, 'candidats_a_rechercher');
  var heures = somme(actifs, 'heures_animation');
  var tendus = actifs.filter(function (v) { return v.a_recruter; });
  var fragiles = actifs.filter(function (v) { return (v.vivier_net || 0) < seuil; });
  var nonDecrits = lignes.filter(function (v) { return !v.intervenants_par_session; });

  var profils = {};
  actifs.forEach(function (v) { (profils[v.ressource || 0] = profils[v.ressource || 0] || []).push(v); });
  var profilsTendus = Object.keys(profils).filter(function (k) { return somme(profils[k], 'a_recruter'); });

  /* le verdict, en une phrase */
  var verdict = document.createElement('p');
  verdict.className = 'verdict' + (recruter ? ' tendu' : '');
  verdict.innerHTML = recruter
    ? '<b>' + OF.plur(recruter, 'intervenant') + ' à recruter</b> sur '
      + OF.plur(tendus.length, 'couple') + ' formation × profil et '
      + OF.plur(profilsTendus.length, 'profil') + '. Environ <b>'
      + OF.plur(candidats, 'candidat') + '</b> à rechercher.'
    : 'Le vivier déclaré couvre le prévisionnel ' + (annee ? annee.annee : '')
      + (fragiles.length ? '. Reste à surveiller ' + OF.plur(fragiles.length, 'couple')
        + ' sous le seuil de robustesse.' : '.');
  zone.appendChild(verdict);

  /* les indicateurs */
  var h2 = document.createElement('h2');
  h2.textContent = 'Où nous en sommes';
  zone.appendChild(h2);
  var inds = document.createElement('div');
  inds.className = 'indicateurs';
  var taux = requis ? couvert / requis : 1;
  var fCouv = OF.feu(taux < 0.9, taux < 1);
  inds.appendChild(indicateur(fCouv, 'Couverture du besoin par le vivier net',
    OF.pourcent(couvert, requis), 'cible 100 %'));
  inds.appendChild(indicateur(fCouv, 'Interventions non couvertes', OF.dec(manque), 'cible 0'));
  inds.appendChild(indicateur(OF.feu(tendus.length > actifs.length / 3, tendus.length > 0),
    'Couples formation × profil en tension', tendus.length + ' sur ' + actifs.length, 'cible 0'));
  inds.appendChild(indicateur(OF.feu(fragiles.length > 0, false),
    'Couples sous le seuil de ' + OF.plur(seuil, 'intervenant'), String(fragiles.length),
    'règle S01-PO1'));
  inds.appendChild(indicateur(
    OF.feu(profilsTendus.length > Object.keys(profils).length / 2, profilsTendus.length > 0),
    'Profils à renforcer', profilsTendus.length + ' sur ' + Object.keys(profils).length, 'cible 0'));
  var cap = somme(OF.table('Charge').filter(function (c) { return c.annee === idAnnee; }),
    'capacite_heures');
  inds.appendChild(cap
    ? indicateur(OF.feu(heures > cap * 1.1, heures > cap), 'Heures d\'animation à couvrir',
        OF.ent(heures) + ' h sur ' + OF.ent(cap) + ' h', OF.pourcent(heures, cap))
    : indicateur('', 'Heures d\'animation à couvrir', OF.ent(heures) + ' h',
        'capacité non renseignée'));
  if (nonDecrits.length) {
    inds.appendChild(indicateur(OF.feu(false, true), 'Profils absents de Intervenants_formation',
      String(nonDecrits.length), 'cible 0'));
  }
  zone.appendChild(inds);

  /* par profil, en jauges : ce qui est couvert, ce qui manque */
  if (Object.keys(profils).length) {
    zone.appendChild(titre('Couverture par profil'));
    var barres = document.createElement('div');
    barres.className = 'barres';
    Object.keys(profils).sort(function (a, b) {
      return somme(profils[b], 'a_recruter') - somme(profils[a], 'a_recruter');
    }).forEach(function (k) {
      var L = profils[k];
      var r = somme(L, 'interventions_requises'), c = somme(L, 'interventions_couvertes');
      var part = r ? Math.min(100, Math.round(100 * c / r)) : 100;
      var aRec = somme(L, 'a_recruter');
      var ligne = document.createElement('div');
      ligne.className = 'barre-ligne';
      ligne.innerHTML = '<span>' + OF.echappe(nom('Intervenants', +k, 'Profil non renseigné'))
        + '</span><span class="jauge"><span class="' + (part < 80 ? 'grave' : (part < 100 ? 'tendu' : ''))
        + '" style="width:' + part + '%"></span></span>'
        + '<span class="calcul">' + part + ' %'
        + (aRec ? ' · <b class="negatif">' + OF.ent(aRec) + ' à recruter</b>' : '') + '</span>';
      barres.appendChild(ligne);
    });
    zone.appendChild(barres);
  }

  /* les priorités */
  if (tendus.length) {
    zone.appendChild(titre('Priorités de recrutement'));
    var ol = document.createElement('ol');
    ol.className = 'rangs';
    tendus.slice().sort(function (a, b) {
      return (b.a_recruter || 0) - (a.a_recruter || 0)
        || (b.interventions_manquantes || 0) - (a.interventions_manquantes || 0);
    }).forEach(function (v, i) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="rang">' + (i + 1) + '</span>'
        + '<span>' + OF.echappe(couple(v)) + '<span class="rang-detail"><br>'
        + OF.dec(v.interventions_manquantes) + ' interventions non couvertes sur '
        + OF.dec(v.interventions_requises)
        + (v.entite ? ' — ' + OF.echappe(nom('Gestionnaire', v.entite, '')) : '')
        + '</span></span>'
        + '<span class="rang-val">' + OF.ent(v.a_recruter) + ' à recruter<br>'
        + '<span class="rang-detail">' + OF.ent(v.candidats_a_rechercher) + ' candidats</span></span>';
      ol.appendChild(li);
    });
    zone.appendChild(ol);
  }

  /* les dépendances à une personne */
  if (fragiles.length) {
    zone.appendChild(titre('Risque de dépendance à une personne'));
    var p = document.createElement('p');
    p.className = 'note';
    p.textContent = 'Après turn-over, ces couples reposent sur moins de ' + OF.plur(seuil, 'intervenant')
      + ' : une absence suffit à annuler les sessions.';
    zone.appendChild(p);
    var ul = document.createElement('ul');
    ul.className = 'rangs';
    fragiles.slice().sort(function (a, b) {
      return (a.vivier_net || 0) - (b.vivier_net || 0) || (b.nb_sessions || 0) - (a.nb_sessions || 0);
    }).forEach(function (v) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="rang">·</span><span>' + OF.echappe(couple(v))
        + '<span class="rang-detail"><br>' + OF.plur(v.nb_sessions, 'session') + ' ' + OF.accord(v.nb_sessions, 'projetée', 'projetées') + '</span></span>'
        + '<span class="rang-val negatif">vivier net ' + OF.dec(v.vivier_net) + '</span>';
      ul.appendChild(li);
    });
    zone.appendChild(ul);
  }

  /* la trajectoire du recrutement, par année et par profil */
  trajectoireRecrutement(zone);

  /* ce qui bloque */
  var aFaire = [];
  var declares = {};
  lignes.forEach(function (v) { declares[v.formation + ':' + (v.ressource || 0)] = 1; });
  var oublies = {};
  OF.table('Projections').concat(OF.table('Ventes_intra')).forEach(function (p) {
    if (p.annee !== idAnnee || !p.formation || !p.nb_sessions) return;
    OF.table('Intervenants_formation').forEach(function (i) {
      if (i.formation === p.formation && i.ressource && !declares[p.formation + ':' + i.ressource]) {
        oublies[nom('Formations', p.formation, '?') + ' / ' + nom('Intervenants', i.ressource, '?')] = 1;
      }
    });
  });
  if (Object.keys(oublies).length) {
    aFaire.push('<b>Déclarer le vivier</b> de ' + OF.plur(Object.keys(oublies).length, 'couple')
      + ' ' + OF.accord(Object.keys(oublies).length, 'projeté', 'projetés') + ' : ' + OF.echappe(Object.keys(oublies).sort().join(', ')) + '.');
  }
  if (nonDecrits.length) {
    aFaire.push('<b>Décrire les intervenants</b> dans Intervenants_formation pour : '
      + OF.echappe(nonDecrits.map(couple).sort().join(', ')) + '.');
  }
  var vides = actifs.filter(function (v) { return !v.vivier_actuel; });
  if (vides.length) {
    aFaire.push('<b>Saisir le vivier actuel</b> de ' + OF.plur(vides.length, 'ligne') + ' : le besoin y '
      + 'est calculé comme si aucun intervenant n\'était autorisé.');
  }
  if (!cap) {
    aFaire.push('<b>Renseigner la capacité</b> dans la table Charge, pour confronter les heures '
      + 'd\'animation à ce que l\'organisme peut absorber.');
  }
  if (aFaire.length) {
    zone.appendChild(titre('Ce qui bloque le pilotage'));
    var ul3 = document.createElement('ul');
    ul3.className = 'a-faire';
    ul3.innerHTML = aFaire.map(function (t) { return '<li>' + t + '</li>'; }).join('');
    zone.appendChild(ul3);
  }

  var note = document.createElement('p');
  note.className = 'aide';
  note.textContent = 'Les lignes de vivier additionnent des autorisations, pas des personnes : '
    + 'un même intervenant peut être autorisé sur plusieurs formations. Au sein d\'un même '
    + 'profil, une recrue polyvalente peut couvrir plusieurs besoins — le total à recruter est '
    + 'un majorant, à arbitrer en S01-PO1.';
  zone.appendChild(note);
  return zone;
}

/* Quand recruter, et de quel profil : une barre empilée par année. */
function trajectoireRecrutement(zone) {
  var annees = anneesAffichees();
  if (annees.length < 2) return;

  var parProfil = {};
  annees.forEach(function (a) {
    vivierDe(a.id).forEach(function (v) {
      if (!v.a_recruter) return;
      var k = v.ressource || 0;
      (parProfil[k] = parProfil[k] || {})[a.id] = (parProfil[k][a.id] || 0) + v.a_recruter;
    });
  });
  var profils = Object.keys(parProfil);
  if (!profils.length) return;

  profils.sort(function (x, y) {
    var sx = 0, sy = 0;
    annees.forEach(function (a) { sx += parProfil[x][a.id] || 0; sy += parProfil[y][a.id] || 0; });
    return sy - sx;
  });

  var noms = profils.map(function (k) { return nom('Intervenants', +k, 'Profil non renseigné'); });
  var series = profils.map(function (k, s) {
    return { nom: noms[s],
      valeur: OF.ent(annees.reduce(function (n, a) { return n + (parProfil[k][a.id] || 0); }, 0))
        + ' au total' };
  });
  var groupes = annees.map(function (a) {
    var parts = profils.map(function (k) { return parProfil[k][a.id] || 0; });
    var total = parts.reduce(function (n, v) { return n + v; }, 0);
    return {
      libelle: String(a.annee), parts: parts,
      bulle: '<b>' + a.annee + '</b> — ' + OF.plur(total, 'intervenant') + ' à recruter'
        + noms.map(function (n, s) {
          return parts[s] ? '<span class="second">' + OF.echappe(n)
            + ' : ' + OF.ent(parts[s]) + '</span>' : '';
        }).join('')
    };
  });

  zone.appendChild(titre('Quand recruter, et de quel profil'));
  G.figure(zone, {
    titre: 'Intervenants à recruter par année',
    sous: 'Un même profil polyvalent peut couvrir plusieurs besoins : ces totaux sont des majorants.',
    haut: 200,
    series: series,
    chiffres: G.chiffres('Les chiffres',
      ['Profil'].concat(annees.map(function (a) { return String(a.annee); })),
      profils.map(function (k, s) {
        return [series[s].nom].concat(annees.map(function (a) {
          return parProfil[k][a.id] ? OF.ent(parProfil[k][a.id]) : '—';
        }));
      })),
    dessin: function (larg, haut) {
      return G.empilees({
        larg: larg, haut: haut, groupes: groupes, series: series,
        formatY: OF.ent, formatVal: OF.ent, total: true,
        unite: 'intervenants',
        description: 'Intervenants à recruter par année, répartis par profil.'
      });
    }
  });
}

/* -------------------------------------------------------- projection --- */
function pageProjection() {
  var zone = document.createElement('div');
  var annees = anneesAffichees();

  var h1 = document.createElement('h1');
  h1.textContent = 'Projection pluriannuelle';
  zone.appendChild(h1);

  if (!annees.length) {
    var v = document.createElement('p');
    v.className = 'alerte-bloc';
    v.textContent = 'Aucune année dans la table Annees : il n\'y a pas encore d\'horizon à projeter.';
    zone.appendChild(v);
    return zone;
  }
  if (!annees.some(function (a) { return a.sessions_total || a.recettes; })) {
    var w = document.createElement('p');
    w.className = 'alerte-bloc';
    w.textContent = 'Aucune session projetée pour l\'instant. La fiche formation permet de saisir '
      + 'les sessions et les places, formation par formation. Les objectifs, en bas de cet écran, '
      + 'peuvent être posés dès maintenant : c\'est à eux que la projection se comparera.';
    zone.appendChild(w);
  }

  bandeauAnnee(zone);
  grapheRecettes(zone, annees);
  grapheResultat(zone, annees);
  grapheDomaines(zone, annees);
  grapheRemplissage(zone, annees);
  tableauAnnees(zone, annees);
  editeurObjectifs(zone, annees);

  var note = document.createElement('p');
  note.className = 'aide';
  note.textContent = 'Tous ces chiffres sont lus dans les colonnes calculées du document : '
    + 'ils ne sont pas recalculés ici, et ne peuvent donc pas en diverger. Le résultat est un '
    + 'résultat sur coûts directs — les charges indirectes de structure restent au budget global. '
    + 'Seuls les objectifs sont saisis : ils ne se déduisent de rien.';
  zone.appendChild(note);
  return zone;
}

/* L'année pilotée en quatre ou cinq chiffres, avant tout graphique. */
function bandeauAnnee(zone) {
  var a = OF.parId(OF.table('Annees'))[idAnnee];
  if (!a) return;
  var t = document.createElement('div');
  t.className = 'tuiles';

  var ecart = a.objectif_ca ? (a.recettes || 0) - a.objectif_ca : null;
  t.appendChild(tuile('Recettes ' + a.annee, OF.eur(a.recettes || 0),
    ecart === null
      ? '<span>objectif non fixé</span>'
      : '<span class="' + (ecart >= 0 ? 'positif' : 'negatif') + '">'
        + (ecart >= 0 ? '+' : '') + OF.eur(ecart) + '</span> sur ' + OF.eur(a.objectif_ca)));

  t.appendChild(tuile('Résultat', OF.eur(a.resultat || 0),
    a.recettes ? Math.round(100 * (a.resultat || 0) / a.recettes) + ' % de marge'
      : 'pas de recettes projetées',
    (a.resultat || 0) < 0 ? 'negatif' : 'positif'));

  t.appendChild(tuile('Sessions', OF.ent(a.sessions_total || 0),
    OF.ent(a.sessions_inter || 0) + ' inter · ' + OF.ent(a.sessions_intra || 0) + ' intra'));

  t.appendChild(tuile('Remplissage inter',
    a.remplissage_inter ? Math.round(100 * a.remplissage_inter) + ' %' : '—',
    OF.plur(a.places || 0, 'place') + ' ' + OF.accord(a.places || 0, 'projetée', 'projetées')));

  var recruter = somme(vivierDe(idAnnee), 'a_recruter');
  t.appendChild(tuile('À recruter', OF.ent(recruter),
    recruter ? OF.plur(somme(vivierDe(idAnnee), 'candidats_a_rechercher'), 'candidat')
      + ' à rechercher' : 'le vivier déclaré suffit',
    recruter ? 'negatif' : ''));

  zone.appendChild(t);
}

function grapheRecettes(zone, annees) {
  var avecObjectif = annees.some(function (a) { return a.objectif_ca; });
  var valeurs = annees.map(function (a) {
    var ecart = a.objectif_ca ? (a.recettes || 0) - a.objectif_ca : null;
    return {
      libelle: String(a.annee),
      valeur: (a.recettes || a.recettes === 0) ? a.recettes : null,
      objectif: a.objectif_ca || null,
      bulle: '<b>' + a.annee + '</b> — recettes ' + OF.eur(a.recettes || 0)
        + (a.objectif_ca
          ? '<span class="second">objectif ' + OF.eur(a.objectif_ca) + '</span>'
            + '<span class="second ' + (ecart >= 0 ? 'positif' : 'negatif') + '">'
            + (ecart >= 0 ? '+' : '') + OF.eur(ecart) + '</span>'
          : '<span class="second">objectif non fixé</span>')
        + '<span class="second">coûts ' + OF.eur(a.couts || 0) + '</span>'
    };
  });

  G.figure(zone, {
    titre: 'Recettes projetées par année',
    sous: avecObjectif
      ? 'Le trait pointillé marque l\'objectif de recettes de l\'année.'
      : 'Aucun objectif n\'est encore fixé — ils se saisissent en bas de cet écran.',
    haut: 215,
    chiffres: G.chiffres('Les chiffres',
      ['', 'Recettes', 'Objectif', 'Écart'].slice(0, avecObjectif ? 4 : 2),
      annees.map(function (a) {
        var L = [String(a.annee), (a.recettes || a.recettes === 0) ? OF.eur(a.recettes) : '—'];
        if (avecObjectif) {
          L.push(a.objectif_ca ? OF.eur(a.objectif_ca) : '—');
          var e = a.objectif_ca ? (a.recettes || 0) - a.objectif_ca : null;
          L.push(e === null ? '—' : (e >= 0 ? '+' : '') + OF.eur(e));
        }
        return L;
      })),
    dessin: function (larg, haut) {
      return G.barres({
        larg: larg, haut: haut, valeurs: valeurs, unite: 'en €',
        description: 'Recettes projetées par année, comparées à l\'objectif de chaque année.'
      });
    }
  });
}

function grapheResultat(zone, annees) {
  var valeurs = annees.map(function (a) {
    return {
      libelle: String(a.annee),
      valeur: (a.resultat || a.resultat === 0) ? a.resultat : null,
      bulle: '<b>' + a.annee + '</b> — résultat ' + OF.eur(a.resultat || 0)
        + '<span class="second">recettes ' + OF.eur(a.recettes || 0)
        + ' − coûts ' + OF.eur(a.couts || 0) + '</span>'
        + (a.recettes ? '<span class="second">taux de marge '
          + Math.round(100 * (a.resultat || 0) / a.recettes) + ' %</span>' : '')
    };
  });
  if (!valeurs.some(function (v) { return v.valeur !== null; })) return;

  G.figure(zone, {
    titre: 'Résultat sur coûts directs, par année',
    sous: 'Recettes moins coûts directs. Une barre sous la ligne est une année en perte.',
    haut: 200,
    chiffres: G.chiffres('Les chiffres', ['', 'Recettes', 'Coûts', 'Résultat', 'Marge'],
      annees.map(function (a) {
        return [String(a.annee), OF.eur(a.recettes || 0), OF.eur(a.couts || 0),
          OF.eur(a.resultat || 0),
          a.recettes ? Math.round(100 * (a.resultat || 0) / a.recettes) + ' %' : '—'];
      })),
    dessin: function (larg, haut) {
      return G.barres({
        larg: larg, haut: haut, valeurs: valeurs, polarite: true, unite: 'en €',
        description: 'Résultat sur coûts directs par année, positif ou négatif.'
      });
    }
  });
}

/* Recettes par domaine et par année : la composition de la trajectoire. */
function grapheDomaines(zone, annees) {
  var parDomaine = {};
  OF.table('Projections').concat(OF.table('Ventes_intra')).forEach(function (p) {
    if (!p.formation || !p.annee) return;
    var f = OF.parId(OF.table('Formations'))[p.formation];
    var d = (f && f.domaine) || 0;
    (parDomaine[d] = parDomaine[d] || {})[p.annee] = (parDomaine[d][p.annee] || 0) + (p.recette || 0);
  });

  var cles = Object.keys(parDomaine);
  var totalDe = function (k) {
    return annees.reduce(function (n, a) { return n + (parDomaine[k][a.id] || 0); }, 0);
  };
  cles = cles.filter(totalDe);
  if (!cles.length) return;
  cles.sort(function (x, y) { return totalDe(y) - totalDe(x); });

  /* Au-delà de cinq teintes, on ne distingue plus : les plus petits domaines
     se regroupent plutôt que de recevoir une couleur de plus. */
  var series = [], colonnes = [];
  var garde = cles.length > 5 ? 4 : cles.length;
  cles.slice(0, garde).forEach(function (k) {
    series.push(nom('Domaines', +k, 'Domaine non renseigné'));
    colonnes.push(function (a) { return parDomaine[k][a.id] || 0; });
  });
  if (cles.length > garde) {
    var reste = cles.slice(garde);
    series.push('Autres domaines (' + reste.length + ')');
    colonnes.push(function (a) {
      return reste.reduce(function (n, k) { return n + (parDomaine[k][a.id] || 0); }, 0);
    });
  }

  var pilotee = OF.parId(OF.table('Annees'))[idAnnee];
  var groupes = annees.map(function (a) {
    var parts = colonnes.map(function (f) { return f(a); });
    var total = parts.reduce(function (n, v) { return n + v; }, 0);
    return {
      libelle: String(a.annee), parts: parts,
      bulle: '<b>' + a.annee + '</b> — ' + OF.eur(total)
        + series.map(function (s, i) {
          return parts[i] ? '<span class="second">' + OF.echappe(s) + ' : ' + OF.eur(parts[i])
            + ' · ' + Math.round(100 * parts[i] / total) + ' %</span>' : '';
        }).join('')
    };
  });

  G.figure(zone, {
    titre: 'Recettes par domaine, année par année',
    sous: 'La hauteur totale est la recette de l\'année ; chaque aplat est un domaine.',
    haut: 230,
    series: series.map(function (s, i) {
      return { nom: s, valeur: pilotee
        ? OF.eur(colonnes[i](pilotee)) + ' en ' + pilotee.annee : '' };
    }),
    chiffres: G.chiffres('Les chiffres',
      ['Domaine'].concat(annees.map(function (a) { return String(a.annee); })),
      series.map(function (s, i) {
        return [s].concat(annees.map(function (a) {
          return colonnes[i](a) ? OF.eur(colonnes[i](a)) : '—';
        }));
      }).concat([['Total'].concat(annees.map(function (a) {
        var t = colonnes.reduce(function (n, f) { return n + f(a); }, 0);
        return t ? OF.eur(t) : '—';
      }))])),
    dessin: function (larg, haut) {
      return G.empilees({
        larg: larg, haut: haut, groupes: groupes, series: series,
        total: true, unite: 'en €',
        description: 'Recettes par année, réparties par domaine de formation.'
      });
    }
  });
}

function grapheRemplissage(zone, annees) {
  if (!annees.some(function (a) { return a.remplissage_inter; })) return;
  var valeurs = annees.map(function (a) {
    return {
      libelle: String(a.annee),
      valeur: a.remplissage_inter ? Math.round(100 * a.remplissage_inter) : null,
      bulle: '<b>' + a.annee + '</b> — remplissage '
        + (a.remplissage_inter ? Math.round(100 * a.remplissage_inter) + ' %' : 'non calculé')
        + '<span class="second">' + OF.plur(a.places || 0, 'place') + ' sur '
        + OF.plur(a.sessions_inter || 0, 'session') + ' inter</span>'
    };
  });

  G.figure(zone, {
    titre: 'Remplissage des sessions inter',
    sous: 'Places vendues rapportées aux places ouvertes. Au-dessous de 100 %, des places '
      + 'restent à vendre sur des sessions déjà financées.',
    haut: 190,
    chiffres: G.chiffres('Les chiffres', ['', 'Remplissage', 'Places', 'Sessions inter'],
      annees.map(function (a) {
        return [String(a.annee),
          a.remplissage_inter ? Math.round(100 * a.remplissage_inter) + ' %' : '—',
          OF.ent(a.places || 0), OF.ent(a.sessions_inter || 0)];
      })),
    dessin: function (larg, haut) {
      return G.ligne({
        larg: larg, haut: haut, valeurs: valeurs, unite: 'en %',
        echelleFixe: { bas: 0, haut: 100, ticks: [0, 25, 50, 75, 100] },
        formatY: function (v) { return v + ' %'; },
        formatVal: function (v) { return v + ' %'; },
        description: 'Taux de remplissage des sessions inter, année par année.'
      });
    }
  });
}

/* Le tableau de référence : toutes les lignes, toutes les années. */
function tableauAnnees(zone, annees) {
  zone.appendChild(titre('Toutes les lignes, année par année'));
  var t = document.createElement('table');
  t.className = 'matrice';
  t.innerHTML = '<thead><tr><th class="gauche"></th>'
    + annees.map(function (a) { return '<th>' + a.annee + '</th>'; }).join('')
    + '</tr></thead>';
  var corps = document.createElement('tbody');

  var ligne = function (libelle, lire, fort) {
    var tr = document.createElement('tr');
    var td = document.createElement('td');
    td.className = 'gauche libelle';
    td.textContent = libelle;
    if (fort) td.style.fontWeight = '600';
    tr.appendChild(td);
    annees.forEach(function (a) {
      var c = document.createElement('td');
      c.className = 'calcul';
      var v = lire(a);
      c.textContent = v.texte;
      if (fort) { c.style.fontWeight = '600'; c.style.color = 'var(--encre)'; }
      if (v.classe) c.classList.add(v.classe);
      tr.appendChild(c);
    });
    corps.appendChild(tr);
  };
  var brut = function (c, f) {
    return function (a) { return { texte: (a[c] || a[c] === 0) ? f(a[c]) : '—' }; };
  };

  ligne('Sessions', brut('sessions_total', OF.ent), true);
  ligne('dont inter', brut('sessions_inter', OF.ent));
  ligne('dont intra', brut('sessions_intra', OF.ent));
  ligne('Places', brut('places', OF.ent));
  if (colonneExiste('Annees', 'heures_stagiaires')) {
    ligne('Heures stagiaires', brut('heures_stagiaires', OF.ent));
  }
  ligne('Remplissage inter', function (a) {
    return { texte: a.remplissage_inter ? Math.round(100 * a.remplissage_inter) + ' %' : '—' };
  });
  ligne('Recettes', brut('recettes', OF.eur), true);
  ligne('Coûts', brut('couts', OF.eur));
  ligne('Résultat', function (a) {
    return { texte: (a.resultat || a.resultat === 0) ? OF.eur(a.resultat) : '—',
      classe: a.resultat > 0 ? 'positif' : (a.resultat < 0 ? 'negatif' : '') };
  }, true);
  ligne('Taux de marge', function (a) {
    return { texte: a.recettes ? Math.round(100 * (a.resultat || 0) / a.recettes) + ' %' : '—' };
  });
  objectifsTenus().forEach(function (o) {
    ligne('Objectif · ' + o.libelle, brut(o.col, o.format));
    ligne('Écart · ' + o.libelle, function (a) {
      if (!a[o.col]) return { texte: '—' };
      var e = (a[o.reel] || 0) - a[o.col];
      return { texte: (e >= 0 ? '+' : '') + o.format(e), classe: e >= 0 ? 'positif' : 'negatif' };
    });
  });
  ligne('Intervenants à recruter', function (a) {
    var r = somme(vivierDe(a.id), 'a_recruter');
    return { texte: r ? OF.ent(r) : '—', classe: r ? 'negatif' : '' };
  });
  t.appendChild(corps);
  zone.appendChild(defilant(t));
}

/* Un tableau plus large que le widget défile dans sa bande ; il ne pousse pas
   la page, sinon tout l'écran se décale horizontalement. */
function defilant(t) {
  var d = document.createElement('div');
  d.className = 'defilant';
  d.appendChild(t);
  return d;
}

/* ---------------------------------------------------------- objectifs -- */
/* La seule saisie de cet écran. Un objectif ne se calcule pas : il se
   décide. On l'écrit donc dans la table Annees, à côté du réalisé qui lui
   fait face. */
function editeurObjectifs(zone, annees) {
  var possibles = objectifsPossibles();
  var tenus = objectifsTenus();
  var manquants = possibles.filter(function (o) { return tenus.indexOf(o) < 0; });

  zone.appendChild(titre('Fixer les objectifs'));

  if (!OF.doc.metaOk) {
    var m = document.createElement('p');
    m.className = 'alerte-bloc';
    m.textContent = 'Les types de colonnes du document ne sont pas lisibles : les objectifs '
      + 'restent affichés mais ne sont pas modifiables ici, pour ne pas risquer d\'écrire une '
      + 'valeur du mauvais type. Vérifiez que le widget a l\'accès complet au document.';
    zone.appendChild(m);
    return;
  }

  if (tenus.length) {
    var p = document.createElement('p');
    p.className = 'note';
    p.textContent = 'Saisie directe : la valeur part à l\'enregistrement quand vous quittez la '
      + 'case ou appuyez sur Entrée. Les graphiques et les écarts se recalculent ensuite depuis '
      + 'le document.';
    zone.appendChild(p);

    var t = document.createElement('table');
    t.className = 'matrice objectifs';
    t.style.marginTop = '12px';
    t.innerHTML = '<thead><tr><th class="gauche">Année</th>'
      + tenus.map(function (o) { return '<th>' + OF.echappe(o.libelle) + '</th>'; }).join('')
      + '<th class="calcule">Réalisé projeté</th><th>Écart</th></tr></thead>';
    var corps = document.createElement('tbody');

    annees.forEach(function (a) {
      var tr = document.createElement('tr');
      var tdA = document.createElement('td');
      tdA.className = 'gauche an';
      tdA.textContent = a.annee;
      tr.appendChild(tdA);

      tenus.forEach(function (o) {
        var td = document.createElement('td');
        td.className = 'gauche';
        td.appendChild(celluleObjectif(a, o));
        tr.appendChild(td);
      });

      var premier = tenus[0];
      var reel = a[premier.reel] || 0;
      var tdR = document.createElement('td');
      tdR.className = 'calcul calcule';
      tdR.textContent = premier.format(reel);
      tr.appendChild(tdR);

      var tdE = document.createElement('td');
      tdE.className = 'calcul';
      if (a[premier.col]) {
        var e = reel - a[premier.col];
        tdE.textContent = (e >= 0 ? '+' : '') + premier.format(e);
        tdE.classList.add(e >= 0 ? 'positif' : 'negatif');
      } else {
        tdE.textContent = '—';
      }
      tr.appendChild(tdE);
      corps.appendChild(tr);
    });
    t.appendChild(corps);
    zone.appendChild(defilant(t));

    var leg = document.createElement('p');
    leg.className = 'note';
    leg.style.marginTop = '10px';
    leg.textContent = 'Les deux dernières colonnes confrontent l\'objectif de ' +
      tenus[0].libelle.toLowerCase() + ' au réalisé projeté.';
    zone.appendChild(leg);
  }

  if (manquants.length) {
    var bloc = document.createElement('p');
    bloc.className = 'note';
    bloc.style.marginTop = tenus.length ? '18px' : '0';
    bloc.textContent = tenus.length
      ? 'D\'autres objectifs peuvent être suivis — ' + manquants.map(function (o) {
          return o.libelle.toLowerCase();
        }).join(', ') + ' — mais la colonne correspondante n\'existe pas encore dans la table '
        + 'Annees.'
      : 'Aucune colonne d\'objectif n\'existe encore dans la table Annees. Elle peut être créée '
        + 'd\'ici : une colonne numérique par objectif, à côté du réalisé.';
    zone.appendChild(bloc);

    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'outil';
    b.style.marginTop = '10px';
    b.textContent = 'Créer ' + (manquants.length > 1
      ? 'les ' + manquants.length + ' colonnes d\'objectif manquantes'
      : 'la colonne « ' + manquants[0].titre + ' »');
    b.addEventListener('click', function () {
      b.disabled = true;
      OF.appliquer(manquants.map(function (o) {
        return ['AddVisibleColumn', 'Annees', o.col, {
          type: 'Numeric', label: o.titre, widgetOptions: '{"decimals":0,"maxDecimals":0}'
        }];
      }), TABLES, function () {
        OF.chargerColonnes().then(rendre);
      }).catch(function () { b.disabled = false; });
    });
    zone.appendChild(b);
  }
}

function celluleObjectif(annee, obj) {
  var el = document.createElement('input');
  el.className = 'champ';
  el.id = 'obj-' + obj.col + '-' + annee.id;
  el.inputMode = 'decimal';
  el.placeholder = '—';
  el.setAttribute('aria-label', obj.titre + ' ' + annee.annee);
  var v = annee[obj.col];
  el.value = (v || v === 0) ? OF.ent(v) : '';
  var origine = el.value;

  /* une colonne formule ne se saisit pas : on l'affiche sans la proposer */
  if (OF.colonne('Annees', obj.col).formule) {
    el.disabled = true;
    el.title = 'Calculé par le document';
    return el;
  }

  /* Enregistrement à la sortie du champ, pas pendant la frappe : l'écran se
     redessine après coup, et on ne redessine pas sous les doigts. */
  el.addEventListener('change', function () {
    var brut = el.value.trim();
    var val = brut === '' ? null : OF.nombre(brut);
    if (val !== null && !obj.signe && val < 0) {
      el.classList.add('erreur');
      OF.signaler('Un objectif négatif n\'a pas de sens ici', true);
      return;
    }
    if ((val === null && origine === '') || (val !== null && OF.ent(val) === origine)) return;
    el.classList.remove('erreur');
    var champs = {};
    champs[obj.col] = val;
    focusARendre = el.id;
    OF.appliquer([['UpdateRecord', 'Annees', annee.id, champs]], TABLES, rendre)
      .catch(function () { el.classList.add('erreur'); focusARendre = null; });
  });
  el.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { el.value = origine; el.blur(); }
    if (ev.key === 'Enter') el.blur();
  });
  return el;
}

/* ------------------------------------------------------------- montage -- */
function rendre() {
  G.oublier();
  var page = OF.$('page');
  page.innerHTML = '';
  page.appendChild(ongletCourant === 'recrutement' ? pageRecrutement() : pageProjection());
  G.redessiner();            // la largeur n'est connue qu'une fois la page posée
  rendreAvance();
  if (focusARendre) {
    var el = OF.$(focusARendre);
    focusARendre = null;
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}

function rendreAvance() {
  var lignes = vivierDe(idAnnee);
  var annee = OF.parId(OF.table('Annees'))[idAnnee];
  var recruter = somme(lignes, 'a_recruter');
  OF.$('avance').innerHTML = annee
    ? '<span>Résultat <b>' + OF.eur(annee.resultat || 0) + '</b></span>'
      + '<span>Sessions <b>' + OF.ent(annee.sessions_total || 0) + '</b></span>'
      + '<span>À recruter <b>' + OF.ent(recruter) + '</b></span>'
      + '<span class="version" title="Version de pilotage.html actuellement servie">'
        + VERSION + '</span>'
    : '<span class="version">' + VERSION + '</span>';
}

['recrutement', 'projection'].forEach(function (t) {
  OF.$('t-' + t).addEventListener('click', function () {
    ongletCourant = t;
    OF.$('t-recrutement').setAttribute('aria-selected', String(t === 'recrutement'));
    OF.$('t-projection').setAttribute('aria-selected', String(t === 'projection'));
    rendre();
  });
});
OF.$('annee').addEventListener('change', function (ev) { idAnnee = +ev.target.value; rendre(); });

function demarrer() {
  var annees = OF.anneesTriees();
  if (!annees.length) { OF.echouer('Aucune année dans la table Annees.'); return; }
  var pilotee = OF.anneePilotee();
  idAnnee = pilotee ? pilotee.id : annees[0].id;
  OF.$('annee').innerHTML = annees.map(function (a) {
    return '<option value="' + a.id + '"' + (a.id === idAnnee ? ' selected' : '') + '>'
      + a.annee + '</option>';
  }).join('');
  rendre();
}

if (typeof window.TEST_SANS_DEMARRAGE === 'undefined') OF.initialiser(TABLES, demarrer);
window.__pilotage = { demarrer: function () { OF.initialiser(TABLES, demarrer); }, rendre: rendre };
</script>
