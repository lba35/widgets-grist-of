<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartOF — reprise du réalisé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="commun.css?v=39">
</head>
<body>
<div id="app" aria-busy="true">
  <div class="barre">
    <h1 class="barre-titre">SmartOF</h1>
    <div class="avance" id="avance"></div>
    <div class="nav">
      <button class="outil" id="rafraichir" type="button"
              title="Aller chercher le réalisé et l'écrire dans le document">Rafraîchir le vendu</button>
    </div>
  </div>
  <div class="corps">
    <div class="fiche" id="page"><p class="vide">Chargement du document…</p></div>
  </div>
</div>
<div class="etat-sauve" id="sauve" role="status" aria-live="polite"></div>

<script src="commun.js?v=39"></script>
<script src="smartof_sync.js?v=39"></script>
<script>
'use strict';
/* L'écran du widget SmartOF. Tout ce qui parle à l'API et au document vit
   dans le moteur partagé avec le pilotage : ici, il n'y a que de l'interface.
   Un seul moteur, donc une seule correction à faire quand l'API bouge. */
var SY = window.SmartOFSync;
var CLE_BASE = SY.CLE_BASE, CLE_JETON = SY.CLE_JETON, CLE_DERNIER = SY.CLE_DERNIER;
var FENETRES = SY.FENETRES, SCHEMAS = SY.SCHEMAS, TABLES = SY.TABLES;
var reglage = SY.reglage, ecrireReglage = SY.ecrireReglage;
var colonneTexteParametres = SY.colonneTexteParametres;
var base = SY.base, jeton = SY.jeton, configure = SY.configure;
var appeler = SY.appeler, depuis = SY.depuis, relire = SY.relire;
var resoudreTables = SY.resoudreTables, vraiNom = SY.vraiNom;
var tablesVoisines = SY.tablesVoisines, colonnesManquantes = SY.colonnesManquantes;
var indexCatalogue = SY.indexCatalogue, codeGesform = SY.codeGesform;
var normaliser = SY.normaliser, quandMaintenant = SY.quandMaintenant;
var CLE_DERNIER_ISO = SY.CLE_DERNIER_ISO;
var parcourir = SY.parcourir, curseurDe = SY.curseurDe;
var parametresDeFenetre = SY.parametresDeFenetre, NOMS_REELS = SY.NOMS_REELS;
var dernierRapport = null;

var VERSION = 'v39';


/* ------------------------------------------------------------- rendu --- */
function rendre() {
  var page = OF.$('page');
  page.innerHTML = '';
  page.appendChild(sectionConnexion());
  page.appendChild(sectionColonnes());
  if (configure()) {
    page.appendChild(sectionStructure());
    page.appendChild(sectionRafraichir());
  }
  if (dernierRapport) page.appendChild(sectionRapport(dernierRapport));
  page.appendChild(sectionCorrespondance());
  rendreAvance();
}

function titre(t, sous) {
  var d = document.createElement('div');
  d.className = 'section-pilotage';
  var h = document.createElement('h2');
  h.textContent = t;
  d.appendChild(h);
  if (sous) {
    var p = document.createElement('p');
    p.className = 'sous';
    p.textContent = sous;
    d.appendChild(p);
  }
  return d;
}

function sectionConnexion() {
  var zone = document.createElement('div');
  zone.appendChild(titre('La connexion',
    'L\'adresse et la clé vivent dans la table Parametres du document, jamais dans ce '
    + 'fichier : il est servi depuis un dépôt public.'));

  /* Un champ de mot de passe hors formulaire fait râler le navigateur et
     désoriente les gestionnaires de mots de passe : on l'enveloppe, et on
     neutralise l'envoi puisqu'il n'y a rien à envoyer. */
  var g = document.createElement('form');
  g.className = 'grille';
  g.addEventListener('submit', function (ev) { ev.preventDefault(); });
  g.appendChild(champReglage(CLE_BASE, 'Adresse de l\'API',
    'https://europe-west3-votre-instance.cloudfunctions.net/external/api'));
  g.appendChild(champReglage(CLE_JETON, 'Clé d\'intégration (lecture seule)', 'smk_…', true));
  zone.appendChild(g);

  var b = document.createElement('div');
  b.style.marginTop = '14px';
  var test = document.createElement('button');
  test.type = 'button';
  test.className = 'outil';
  test.textContent = 'Tester la connexion';
  test.disabled = !configure();
  test.addEventListener('click', function () { testerConnexion(test); });
  b.appendChild(test);
  zone.appendChild(b);

  var r = document.createElement('p');
  r.id = 'resultat-test';
  r.className = 'note';
  r.style.marginTop = '10px';
  zone.appendChild(r);

  if (!colonneTexteParametres()) {
    var m = document.createElement('p');
    m.className = 'alerte-bloc';
    m.style.marginTop = '12px';
    m.textContent = 'La table Parametres n\'a pas de colonne texte, et ses colonnes existantes '
      + 'sont numériques : une adresse et une clé ne peuvent pas y tenir. La section '
      + 'ci-dessous propose de la créer ; les deux champs restent inactifs jusque-là.';
    zone.appendChild(m);
  } else if (!configure()) {
    var a = document.createElement('p');
    a.className = 'alerte-bloc';
    a.style.marginTop = '12px';
    a.textContent = 'Renseignez l\'adresse et la clé pour aller plus loin. La clé doit être '
      + 'en lecture seule : cet écran ne fait que des GET, et toute personne ayant accès au '
      + 'document pourra la lire.';
    zone.appendChild(a);
  }
  return zone;
}

function champReglage(cle, libelle, exemple, secret) {
  var bloc = document.createElement('div');
  bloc.className = 'bloc';
  var l = document.createElement('label');
  l.textContent = libelle;
  l.htmlFor = 'r-' + cle;
  bloc.appendChild(l);
  var el = document.createElement('input');
  el.id = 'r-' + cle;
  el.className = 'champ';
  el.style.width = '100%';
  el.style.textAlign = 'left';
  el.type = secret ? 'password' : 'text';
  el.placeholder = exemple;
  el.autocomplete = 'off';
  el.spellcheck = false;
  el.value = reglage(cle);
  var origine = el.value;
  el.disabled = !colonneTexteParametres();
  el.addEventListener('change', function () {
    if (el.value.trim() === origine) return;
    ecrireReglage(cle, el.value.trim()).then(function () {
      if (colonneTexteParametres()) OF.signaler(libelle + ' enregistré' + (secret ? 'e' : ''));
    });
  });
  bloc.appendChild(el);
  if (secret) {
    var v = document.createElement('button');
    v.type = 'button';
    v.className = 'lien';
    v.style.marginTop = '4px';
    v.textContent = 'Afficher';
    v.addEventListener('click', function () {
      var cache = el.type === 'password';
      el.type = cache ? 'text' : 'password';
      v.textContent = cache ? 'Masquer' : 'Afficher';
    });
    bloc.appendChild(v);
  }
  return bloc;
}

function testerConnexion(bouton) {
  var r = OF.$('resultat-test');
  bouton.disabled = true;
  r.textContent = 'Appel en cours…';
  r.className = 'note';
  appeler('/v2/session_formations', { limit: 1 })
    .then(function (rep) {
      var n = (rep && rep.data && rep.data.length) || 0;
      r.className = 'note';
      r.innerHTML = '<b style="color:var(--fait)">La connexion fonctionne.</b> '
        + (n ? 'Un enregistrement a été lu, et l\'enveloppe porte '
             + Object.keys(rep).join(' et ') + '.'
             : 'L\'appel aboutit mais ne renvoie aucune session.');
    })
    .catch(function (e) {
      r.className = 'alerte-bloc';
      r.textContent = e.message;
    })
    .then(function () { bouton.disabled = !configure(); });
}

/* ------------------------------------------------------- la structure -- */
/* La documentation de SmartOF ne publie ni schéma de réponse ni exemple
   JSON. Plutôt que de deviner, on va chercher un enregistrement réel et on
   le montre : c'est à partir de ça que la correspondance se vérifie. */
function sectionStructure() {
  var zone = document.createElement('div');
  zone.appendChild(titre('Ce que SmartOF renvoie vraiment',
    'Un enregistrement réel, champ par champ. À regarder une fois, pour vérifier que la '
    + 'correspondance ci-dessous porte bien sur ce qui existe.'));

  ['session_formations', 'commanditaires', 'factures'].forEach(function (col) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'outil';
    b.style.marginRight = '8px';
    b.textContent = col === 'commanditaires' ? 'Voir un commanditaire'
      : (col === 'factures' ? 'Voir une facture' : 'Voir une session');
    b.addEventListener('click', function () { montrerStructure(col, b); });
    zone.appendChild(b);
  });

  var sortie = document.createElement('pre');
  sortie.id = 'structure';
  sortie.className = 'defilant';
  sortie.style.cssText = 'margin-top:14px;max-height:360px;overflow:auto;font-size:12px;'
    + 'line-height:1.5;white-space:pre-wrap;word-break:break-word;';
  zone.appendChild(sortie);
  return zone;
}

function montrerStructure(collection, bouton) {
  var sortie = OF.$('structure');
  bouton.disabled = true;
  sortie.textContent = 'Appel en cours…';
  appeler('/v2/' + collection, { limit: 1 })
    .then(function (rep) {
      var l = rep && rep.data && rep.data[0];
      if (!l) { sortie.textContent = 'Aucun enregistrement dans cette collection.'; return; }
      sortie.textContent = 'pageInfo : ' + JSON.stringify(rep.pageInfo) + '\n\n'
        + JSON.stringify(l, null, 2);
    })
    .catch(function (e) { sortie.textContent = e.message; })
    .then(function () { bouton.disabled = false; });
}

/* ------------------------------------------------------ rafraîchissement */

/* Par défaut on repart de la dernière reprise : c'est le geste courant.
   S'il n'y en a pas encore, tout reprendre est le seul choix honnête. */
var fenetre = SY.repriseIncrementalePossible() ? 'depuis' : 'tout';


function sectionRafraichir() {
  var zone = document.createElement('div');
  zone.appendChild(titre('Rafraîchir le vendu',
    'Les enregistrements modifiés depuis la date choisie sont relus. Le recouvrement est '
    + 'sans effet : rien n\'est dupliqué, chaque enregistrement est reconnu à son identifiant.'));

  var g = document.createElement('div');
  g.className = 'bloc';
  g.style.maxWidth = '320px';
  var l = document.createElement('label');
  l.textContent = 'Fenêtre relue';
  l.htmlFor = 'fenetre';
  g.appendChild(l);
  var s = document.createElement('select');
  s.id = 'fenetre';
  s.className = 'champ';
  s.style.width = '100%';
  s.style.textAlign = 'left';
  s.innerHTML = FENETRES.map(function (f) {
    return '<option value="' + f.cle + '"' + (f.cle === fenetre ? ' selected' : '') + '>'
      + OF.echappe(f.libelle) + '</option>';
  }).join('');
  s.addEventListener('change', function (ev) { fenetre = ev.target.value; });
  g.appendChild(s);
  zone.appendChild(g);

  var dernier = reglage(CLE_DERNIER);
  var p = document.createElement('p');
  p.className = 'note';
  p.style.marginTop = '10px';
  p.textContent = dernier
    ? 'Dernier rafraîchissement : ' + dernier + '.'
    : 'Aucun rafraîchissement enregistré pour l\'instant.';
  zone.appendChild(p);

  var etat = document.createElement('p');
  etat.id = 'avancement';
  etat.className = 'note';
  etat.style.marginTop = '10px';
  zone.appendChild(etat);
  return zone;
}


function rendreAvance() {
  OF.$('avance').innerHTML = (configure()
    ? '<span>' + OF.echappe(base().replace(/^https?:\/\//, '').split('.')[0]) + '</span>'
    : '<span>non configuré</span>')
    + '<span class="version" title="Version de smartof.html actuellement servie">'
    + VERSION + '</span>';
}


/* ------------------------------------------------- les colonnes d'accueil */
/* Rien n'est écrit tant que les colonnes n'existent pas : plutôt que
   d'échouer au milieu d'un rapatriement, on le dit avant, et on propose de
   les créer. */
function sectionColonnes() {
  var manque = colonnesManquantes();
  var zone = document.createElement('div');
  if (!manque.length) return zone;

  zone.appendChild(titre('Ce qui manque dans le document',
    'Le rapatriement a besoin de ces colonnes pour écrire. Il ne crée rien tout seul.'));

  var tablesAbsentes = manque.filter(function (m) { return !m[1]; });
  if (tablesAbsentes.length) {
    var a = document.createElement('p');
    a.className = 'alerte-bloc';
    var voisines = tablesVoisines();
    a.innerHTML = OF.echappe(OF.plur(tablesAbsentes.length, 'table') + ' '
        + OF.accord(tablesAbsentes.length, 'introuvable', 'introuvables') + ' : ')
      + '<b>' + OF.echappe(tablesAbsentes.map(function (m) { return m[0]; }).join(', ')) + '</b>. '
      + (voisines.length
         ? 'Le document en contient ' + OF.accord(voisines.length, 'une autre', 'd\'autres')
           + ' dont le nom évoque SmartOF : <b>' + OF.echappe(voisines.join(', '))
           + '</b>. Si c\'est ' + OF.accord(voisines.length, 'celle-là', 'l\'une d\'elles')
           + ', renommez-' + OF.accord(voisines.length, 'la', 'la') + ' — la casse et le '
           + 'pluriel comptent, Grist dérive l\'identifiant du libellé.'
         : 'Le document ne contient aucune autre table dont le nom évoque SmartOF. '
           + OF.accord(tablesAbsentes.length, 'Elle est', 'Elles sont') + ' à créer — un '
           + 'widget ne crée pas de table, c\'est une décision de structure.');
    zone.appendChild(a);
  }

  var colonnes = manque.filter(function (m) { return m[1]; });
  if (colonnes.length) {
    var t = document.createElement('table');
    t.className = 'matrice';
    t.innerHTML = '<thead><tr><th class="gauche">Table</th><th class="gauche">Colonne</th>'
      + '<th class="gauche">Type</th><th class="gauche">Libellé</th></tr></thead>';
    var corps = document.createElement('tbody');
    colonnes.forEach(function (m) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td class="gauche libelle">' + OF.echappe(m[0]) + '</td>'
        + '<td class="gauche"><code>' + OF.echappe(m[1][0]) + '</code></td>'
        + '<td class="gauche second">' + OF.echappe(m[1][1]) + '</td>'
        + '<td class="gauche second">' + OF.echappe(m[1][2]) + '</td>';
      corps.appendChild(tr);
    });
    t.appendChild(corps);
    zone.appendChild(defilantLocal(t));

    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'outil';
    b.style.marginTop = '12px';
    b.textContent = 'Créer ces ' + OF.plur(colonnes.length, 'colonne');
    b.addEventListener('click', function () { creerCeQuiManque(b); });
    zone.appendChild(b);
  }
  return zone;
}

function defilantLocal(t) {
  var d = document.createElement('div');
  d.className = 'defilant';
  d.appendChild(t);
  return d;
}


/* ------------------------------------------------- la correspondance vue */
function sectionCorrespondance() {
  var zone = document.createElement('div');
  var produits = OF.table(vraiNom('SmartOF_produits'));
  if (!produits.length) return zone;

  var orphelins = produits.filter(function (p) { return !p.formation; });
  zone.appendChild(titre('La liaison avec le catalogue',
    'Chaque produit SmartOF est rapproché d\'une formation par le code Gesform, lu dans '
    + 'custom_field_20. Ce qui n\'a pas été rapproché reste ici, visible, plutôt que d\'être '
    + 'perdu en silence.'));

  var t = document.createElement('div');
  t.className = 'tuiles';
  [['Produits rencontrés', produits.length, 'dans SmartOF'],
   ['Rapprochés', produits.length - orphelins.length, 'liés à une formation du catalogue'],
   ['À rapprocher', orphelins.length, orphelins.length ? 'à trancher une fois, à la main'
                                                       : 'rien en attente']
  ].forEach(function (c, i) {
    var d = document.createElement('div');
    d.className = 'tuile';
    d.innerHTML = '<div class="tuile-lib">' + OF.echappe(c[0]) + '</div>'
      + '<div class="tuile-val' + (i === 2 && c[1] ? ' negatif' : '') + '">' + OF.ent(c[1]) + '</div>'
      + '<div class="tuile-ctx">' + OF.echappe(c[2]) + '</div>';
    t.appendChild(d);
  });
  zone.appendChild(t);

  if (!orphelins.length) return zone;

  var tab = document.createElement('table');
  tab.className = 'matrice';
  tab.innerHTML = '<thead><tr><th class="gauche">Produit SmartOF</th>'
    + '<th class="gauche">Code Gesform</th><th class="gauche">Formation du catalogue</th></tr></thead>';
  var corps = document.createElement('tbody');
  orphelins.forEach(function (p) {
    var tr = document.createElement('tr');
    var n = document.createElement('td');
    n.className = 'gauche libelle';
    n.textContent = OF.texte(p.nom) || '(sans intitulé)';
    tr.appendChild(n);
    var c = document.createElement('td');
    c.className = 'gauche';
    c.innerHTML = OF.texte(p.code_gesform)
      ? '<code>' + OF.echappe(OF.texte(p.code_gesform)) + '</code>'
      : '<span class="second">custom_field_20 vide</span>';
    tr.appendChild(c);
    var f = document.createElement('td');
    f.className = 'gauche';
    f.appendChild(choixFormation(p));
    tr.appendChild(f);
    corps.appendChild(tr);
  });
  tab.appendChild(corps);
  zone.appendChild(defilantLocal(tab));

  var note = document.createElement('p');
  note.className = 'aide';
  note.textContent = 'Un rapprochement fait ici n\'est jamais écrasé par un rafraîchissement '
    + 'ultérieur : le code Gesform sert à proposer, votre choix tranche.';
  zone.appendChild(note);
  return zone;
}

function choixFormation(p) {
  var s = document.createElement('select');
  s.className = 'champ saisie';
  s.style.width = '100%';
  s.style.textAlign = 'left';
  var options = ['<option value="0">— à rapprocher —</option>'];
  OF.formationsTriees().forEach(function (f) {
    options.push('<option value="' + f.id + '">'
      + OF.echappe((OF.texte(f.code) ? OF.texte(f.code) + ' · ' : '') + OF.texte(f.intitule))
      + '</option>');
  });
  s.innerHTML = options.join('');
  s.value = String(p.formation || 0);
  s.addEventListener('change', function () {
    OF.appliquer([['UpdateRecord', vraiNom('SmartOF_produits'), p.id, { formation: +s.value || 0 }]],
      [vraiNom('SmartOF_produits')], function () { rendre(); });
  });
  return s;
}

/* ====================================================== correspondance === */
/* LA LIAISON AVEC LE CATALOGUE
   Une session SmartOF porte un produit de formation ; ce produit porte le
   code Gesform dans custom_field_20. C'est lui qui raccroche au catalogue
   Grist. Le code peut vivre sur l'instance du produit ou sur sa fiche : on
   regarde les deux, dans cet ordre, plutôt que de parier sur l'un.

   POURQUOI UNE TABLE DE CORRESPONDANCE PLUTÔT QU'UN RAPPROCHEMENT DIRECT
   Un rapprochement calculé à la volée perd en silence tout ce qu'il ne sait
   pas rapprocher. La table garde une ligne par produit rencontré : ce qui
   n'est pas rapproché reste visible, se tranche une fois à la main, et le
   choix tient ensuite. */

function creerCeQuiManque(bouton) {
  var manque = colonnesManquantes();
  var tablesAbsentes = manque.filter(function (m) { return !m[1]; });
  if (tablesAbsentes.length) {
    OF.signaler('Tables absentes : ' + tablesAbsentes.map(function (m) { return m[0]; }).join(', ')
      + ' — à créer dans le document', true);
    return;
  }
  var actions = manque.map(function (m) {
    return ['AddVisibleColumn', m[0], m[1][0], { type: m[1][1], label: m[1][2], isFormula: false }];
  });
  if (!actions.length) { OF.signaler('Rien à créer : toutes les colonnes existent'); return; }
  bouton.disabled = true;
  OF.appliquer(actions, [], function () {
    OF.chargerColonnes().then(function () {
      rendre();
      OF.signaler(OF.plur(actions.length, 'colonne') + ' ' + OF.accord(actions.length, 'créée', 'créées'));
    });
  }).catch(function (e) { OF.signaler(e.message, true); bouton.disabled = false; });
}


function terminer(bilan, dire) {
  enCours = false;
  OF.$('rafraichir').disabled = false;
  dernierRapport = bilan;
  dire('');
  rendre();
}


/* ------------------------------------------------------------ rapport -- */
function sectionRapport(r) {
  var zone = document.createElement('div');
  zone.appendChild(titre('Le dernier rafraîchissement', r.quand));

  var t = document.createElement('div');
  t.className = 'tuiles';
  [['Lues chez SmartOF', r.lues, OF.plur(r.pages, 'page')],
   ['Ajoutées', r.ajoutees, 'nouvelles dans le document'],
   ['Corrigées', r.corrigees, 'déjà là, mais modifiées'],
   ['Inchangées', r.inchangees, 'rien à écrire']
  ].forEach(function (c) {
    var d = document.createElement('div');
    d.className = 'tuile';
    d.innerHTML = '<div class="tuile-lib">' + OF.echappe(c[0]) + '</div>'
      + '<div class="tuile-val">' + OF.ent(c[1]) + '</div>'
      + '<div class="tuile-ctx">' + OF.echappe(c[2]) + '</div>';
    t.appendChild(d);
  });
  zone.appendChild(t);

  if (r.avertissements && r.avertissements.length) {
    var ul = document.createElement('ul');
    ul.className = 'a-faire';
    ul.innerHTML = r.avertissements.map(function (a) {
      return '<li>' + OF.echappe(a) + '</li>';
    }).join('');
    zone.appendChild(ul);
  }
  return zone;
}

/* ------------------------------------------------------------ montage -- */
function demarrer() {
  /* Une table trouvée sous un autre nom n'a pas été chargée par TABLES : on
     va la chercher avant d'afficher quoi que ce soit, sinon elle paraîtrait
     vide alors qu'elle est pleine. */
  resoudreTables();
  var aCharger = Object.keys(NOMS_REELS)
    .filter(function (t) { return NOMS_REELS[t] && TABLES.indexOf(NOMS_REELS[t]) < 0; })
    .map(function (t) { return NOMS_REELS[t]; });
  if (!aCharger.length) { rendre(); return; }
  OF.charger(aCharger).then(rendre, rendre);
}

OF.$('rafraichir').addEventListener('click', rafraichir);

if (typeof window.TEST_SANS_DEMARRAGE === 'undefined') OF.initialiser(TABLES, demarrer);
window.__smartof = {
  demarrer: function () { OF.initialiser(TABLES, demarrer); },
  parcourir: parcourir, appeler: appeler, curseurDe: curseurDe,
  parametresDeFenetre: parametresDeFenetre, rendre: rendre,
  paramCurseur: SY.paramCurseur,
  vraiNom: vraiNom, tablesVoisines: tablesVoisines, colonnesManquantes: colonnesManquantes,
};


/* Le bouton : il n'orchestre rien, il appelle le moteur et rend compte. */
function rafraichir() {
  if (SY.enCours()) { OF.signaler('Un rafraîchissement est déjà en cours'); return; }
  var bouton = OF.$('rafraichir');
  if (bouton) bouton.disabled = true;
  var etat = OF.$('avancement');
  var dire = function (t) { if (etat) etat.textContent = t; };

  SY.rafraichir({ fenetre: fenetre, dire: dire }).then(function (bilan) {
    if (bouton) bouton.disabled = false;
    dernierRapport = bilan;
    if (bilan.erreur) OF.signaler(bilan.erreur, true);
    rendre();
  }).catch(function (e) {
    if (bouton) bouton.disabled = false;
    dire('');
    OF.signaler(e.message, true);
    rendre();
  });
}

</script>
</body>
