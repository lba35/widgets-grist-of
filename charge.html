<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan de charge — intervenants et salles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="commun.css?v=22">
</head>
<body>
<div id="app" aria-busy="true">
  <div class="barre">
    <div class="onglets" role="tablist">
      <button class="onglet" id="t-vivier" role="tab" type="button" aria-selected="true">Vivier</button>
      <button class="onglet" id="t-recrutement" role="tab" type="button" aria-selected="false">Recrutement</button>
      <button class="onglet" id="t-salles" role="tab" type="button" aria-selected="false">Salles</button>
    </div>
    <select class="recherche" id="annee" aria-label="Année"></select>
    <input class="recherche" id="recherche" type="search" placeholder="Chercher un profil ou une formation"
           aria-label="Chercher" autocomplete="off">
    <div class="avance" id="avance"></div>
    <div class="nav">
      <button class="outil" id="amorcer" type="button"
              title="Créer les lignes manquantes d'après les intervenants décrits">Compléter les lignes</button>
    </div>
  </div>
  <div class="corps">
    <div class="rail" id="rail" role="list"></div>
    <div class="page" id="page"><p class="vide">Chargement du document…</p></div>
  </div>
</div>
<div class="etat-sauve" id="sauve" role="status" aria-live="polite"></div>

<script src="commun.js?v=22"></script>
<script src="graphes.js?v=22"></script>
<script>
/* =========================================================================
   Plan de charge — les ressources qu'il faut réunir pour tenir la projection.

   Trois vues. Le vivier d'intervenants, profil par profil, où l'on saisit.
   Le pilotage du recrutement, qui en tire les priorités — il était dans
   l'écran de pilotage, où il n'avait rien à faire : ce sont des charges,
   pas de la projection commerciale. Et l'occupation des salles, lue dans
   la table Salles que le document calcule déjà.

   Le vivier d'intervenants, profil par profil.

   On choisit un profil à gauche — formateur GSU, formateur SSE, médecin —
   et on voit toutes les formations qui le mobilisent, avec le vivier
   déclaré et le besoin de recrutement. Deux colonnes à saisir : les
   intervenants autorisés aujourd'hui, et les départs connus. Le reste est
   lu dans les colonnes formules de la table Vivier.
   ========================================================================= */
'use strict';

/* Affiché dans le bandeau : une page sortie du cache montre l'ancien numéro. */
var VERSION = 'v22';

var TABLES = ['Annees', 'Formations', 'Intervenants', 'Intervenants_formation',
  'Vivier', 'Vivier_profils', 'Projections', 'Ventes_intra', 'Parametres', 'Gestionnaire',
  'Charge', 'Salles', 'Types_salles', 'Besoins_salles'];
var RELIRE = ['Vivier', 'Vivier_profils'];

var profilCourant = null, idAnnee = null, filtre = '', vue = 'vivier';

/* ------------------------------------------------- tuiles et intitulés --- */
function indicateur(feu, libelle, valeur, cible) {
  var d = document.createElement('div');
  d.className = 'ind';
  d.innerHTML = '<span class="ind-feu">' + feu + '</span>'
    + '<span>' + OF.echappe(libelle) + '</span>'
    + '<span class="ind-val">' + OF.echappe(valeur) + '</span>'
    + '<span class="ind-cible">' + OF.echappe(cible || '') + '</span>';
  return d;
}
function tuile(libelle, valeur, contexte, classe) {
  var d = document.createElement('div');
  d.className = 'tuile';
  d.innerHTML = '<div class="tuile-lib">' + OF.echappe(libelle) + '</div>'
    + '<div class="tuile-val' + (classe ? ' ' + classe : '') + '">' + OF.echappe(valeur) + '</div>'
    + '<div class="tuile-ctx">' + (contexte || '') + '</div>';
  return d;
}
function titre(t) {
  var h = document.createElement('h2');
  h.textContent = t;
  return h;
}
function defilant(t) {
  var d = document.createElement('div');
  d.className = 'defilant';
  d.appendChild(t);
  return d;
}
function somme(L, c) { return L.reduce(function (n, v) { return n + (v[c] || 0); }, 0); }
function couple(v) {
  return nom('Formations', v.formation, 'Sans titre') + ' / '
    + nom('Intervenants', v.ressource, 'profil non renseigné');
}
function anneesAffichees() { return OF.anneesTriees(); }

/* ------------------------------------------------------- accès données -- */
/* Deux grains, et c'est tout l'enjeu. `Vivier` décrit la DEMANDE, formation
   par formation : combien de sessions, combien d'interventions, combien
   d'heures. `Vivier_profils` porte le VIVIER, profil par profil — parce
   qu'un formateur GSU est habilité au GSU, pas à « GSU 2 - Etudiants - 3j ».
   Saisir le vivier sur la formation revenait à répartir une seule population
   sur huit lignes, et aucune répartition n'était juste. */
function vivierDe(idA) {
  return OF.table('Vivier').filter(function (v) { return v.annee === idA; });
}
function vivierProjete(idA) {
  return OF.table('Vivier').filter(function (v) { return v.annee === idA && v.formation; });
}
function migreFait() {
  return !!(OF.doc && OF.doc.colonnes && OF.doc.colonnes.Vivier_profils);
}
function profilsAnnee(idA) {
  return OF.table('Vivier_profils').filter(function (p) { return p.annee === idA; });
}
function ligneProfil(idR, idA) {
  return profilsAnnee(idA === undefined ? idAnnee : idA).filter(function (p) {
    return p.ressource === idR;
  })[0] || null;
}
function demandeDe(idR, idA) {
  return vivierDe(idA === undefined ? idAnnee : idA).filter(function (v) {
    return v.ressource === idR && v.formation;
  });
}
function nom(tableNom, id, defaut) {
  var l = OF.parId(OF.table(tableNom))[id];
  return (l && OF.texte(l.intitule)) || defaut;
}
function parametre(cle) {
  var p = OF.table('Parametres').filter(function (x) { return x.cle === cle; })[0];
  return p ? (p.valeur || 0) : 0;
}
function profilsMobilises() {
  var vus = {};
  vivierDe(idAnnee).forEach(function (v) { if (v.ressource) vus[v.ressource] = 1; });
  OF.table('Intervenants_formation').forEach(function (i) { if (i.ressource) vus[i.ressource] = 1; });
  return OF.trierPar(Object.keys(vus).map(function (id) {
    return OF.parId(OF.table('Intervenants'))[+id];
  }).filter(Boolean), 'intitule');
}

/* profils mobilisés cette année qui n'ont pas encore de ligne de vivier */
function profilsSansLigne() {
  if (!migreFait()) return [];
  var vus = {};
  profilsAnnee(idAnnee).forEach(function (p) { if (p.ressource) vus[p.ressource] = 1; });
  var besoin = {};
  vivierDe(idAnnee).forEach(function (v) { if (v.ressource) besoin[v.ressource] = 1; });
  manquants().forEach(function (m) { besoin[m.ressource] = 1; });
  return Object.keys(besoin).map(Number).filter(function (r) { return !vus[r]; });
}

/* couples formation × profil projetés mais absents de la table Vivier */
function manquants() {
  var idF = {}, out = [];
  var declares = {};
  vivierDe(idAnnee).forEach(function (v) { declares[v.formation + ':' + v.ressource] = 1; });
  OF.table('Projections').concat(OF.table('Ventes_intra')).forEach(function (p) {
    if (p.annee === idAnnee && p.formation && p.nb_sessions) idF[p.formation] = 1;
  });
  Object.keys(idF).forEach(function (f) {
    OF.table('Intervenants_formation').forEach(function (i) {
      if (i.formation === +f && i.ressource && !declares[f + ':' + i.ressource]) {
        out.push({ formation: +f, ressource: i.ressource });
      }
    });
  });
  return out;
}

/* ---------------------------------------------------------------- rail -- */
function rendreRail() {
  var rail = OF.$('rail'), profils = profilsMobilises();
  var q = filtre.trim().toLowerCase();
  if (q) {
    profils = profils.filter(function (p) {
      if (OF.texte(p.intitule).toLowerCase().indexOf(q) >= 0) return true;
      return vivierDe(idAnnee).some(function (v) {
        return v.ressource === p.id
          && nom('Formations', v.formation, '').toLowerCase().indexOf(q) >= 0;
      });
    });
  }
  if (!profils.length) {
    rail.dataset.ids = '';
    rail.innerHTML = '<p class="rail-vide">Aucun profil ne correspond. Les profils viennent de '
      + 'la table Intervenants, attachés aux formations dans Intervenants_formation.</p>';
    return;
  }
  /* mise à jour sur place : reconstruire la liste après chaque enregistrement
     détruisait les boutons entre l'appui et le relâchement de la souris, et
     le clic se perdait */
  var ids = profils.map(function (p) { return p.id; }).join(',');
  if (rail.dataset.ids === ids) {
    var boutons = rail.querySelectorAll('.item');
    for (var i = 0; i < boutons.length && i < profils.length; i++) majItem(boutons[i], profils[i]);
  } else {
    rail.dataset.ids = ids;
    rail.innerHTML = '';
    profils.forEach(function (p) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'item';
      b.setAttribute('role', 'listitem');
      b.dataset.id = p.id;
      b.innerHTML = '<span class="item-nom"></span><span class="item-etat"></span>';
      b.addEventListener('click', function () {
        profilCourant = p.id;
        rendreRail();
        rendrePage();
      });
      majItem(b, p);
      rail.appendChild(b);
    });
  }
  rendreAvance();
}

function majItem(b, p) {
  var L = ligneProfil(p.id);
  var recruter = L ? (L.a_recruter || 0) : 0;
  var classe = recruter ? 'p-alerte' : (L && L.vivier_actuel ? 'p-fait' : 'p-vide');
  var detail = recruter ? (OF.ent(recruter) + ' à recruter')
    : (!L ? 'aucune ligne' : (L.vivier_actuel ? 'couvert' : 'vivier non saisi'));
  b.querySelector('.item-nom').textContent = OF.texte(p.intitule);
  b.querySelector('.item-etat').innerHTML =
    '<span class="pastille ' + classe + '"></span>' + OF.echappe(detail);
  if (profilCourant === p.id) b.setAttribute('aria-current', 'true');
  else b.removeAttribute('aria-current');
}

function rendreAvance() {
  var P = profilsAnnee(idAnnee);
  var recruter = somme(P, 'a_recruter');
  var candidats = somme(P, 'candidats_a_rechercher');
  var fragiles = P.filter(function (p) {
    return p.heures_requises && (p.vivier_net || 0) < parametre('vivier_minimum');
  }).length;
  var vides = P.filter(function (p) { return p.heures_requises && !p.vivier_actuel; }).length;
  OF.$('avance').innerHTML =
    '<span><b>' + OF.ent(recruter) + '</b> à recruter</span>'
    + '<span><b>' + OF.ent(candidats) + '</b> candidats à chercher</span>'
    + '<span><span class="pastille p-alerte"></span><b>' + fragiles + '</b> sous le seuil</span>'
    + '<span><span class="pastille p-partiel"></span><b>' + vides + '</b> vivier non saisi</span>'
    + '<span class="version" title="Version de charge.html actuellement servie">'
      + VERSION + '</span>';
}

/* ------------------------------------------------------- recrutement --- */
/* Le recrutement se décide par profil : c'est le seul niveau où « combien de
   personnes » a un sens. Les formations n'apparaissent plus que comme ce
   qu'elles sont — l'origine des heures à couvrir. */
function pageRecrutement() {
  var zone = document.createElement('div');
  var annee = OF.parId(OF.table('Annees'))[idAnnee];
  var P = profilsAnnee(idAnnee).filter(function (p) { return p.ressource; });
  var demande = vivierProjete(idAnnee);

  var h1 = document.createElement('h1');
  h1.textContent = 'Pilotage du recrutement — ' + (annee ? annee.annee : '');
  zone.appendChild(h1);

  if (!migreFait()) { zone.appendChild(aMigrer()); return zone; }

  if (!P.length) {
    var v = document.createElement('p');
    v.className = 'alerte-bloc';
    v.textContent = 'Aucune ligne de vivier pour cette année. L\'onglet Vivier permet de les '
      + 'créer — une par profil mobilisé.';
    zone.appendChild(v);
    return zone;
  }

  var seuil = parametre('vivier_minimum');
  var actifs = P.filter(function (p) { return p.heures_requises; });
  var requis = somme(actifs, 'heures_requises');
  var couvert = somme(actifs, 'heures_couvertes');
  var manque = somme(actifs, 'heures_manquantes');
  var recruter = somme(P, 'a_recruter');
  var candidats = somme(P, 'candidats_a_rechercher');
  var cible = somme(actifs, 'vivier_cible');
  var tendus = actifs.filter(function (p) { return p.a_recruter; });
  var fragiles = actifs.filter(function (p) { return (p.vivier_net || 0) < seuil; });
  var nonDecrits = demande.filter(function (v) { return !v.intervenants_par_session; });

  /* le verdict, en une phrase */
  var verdict = document.createElement('p');
  verdict.className = 'verdict' + (recruter ? ' tendu' : '');
  verdict.innerHTML = recruter
    ? '<b>' + OF.plur(recruter, 'intervenant') + ' à recruter</b> sur '
      + OF.plur(tendus.length, 'profil') + ', '
      + (manque
         ? 'pour couvrir ' + OF.ent(manque) + ' h non couvertes sur ' + OF.ent(requis) + ' h'
         : 'non pour couvrir des heures — elles le sont — mais pour sortir du seuil de '
           + 'robustesse de ' + OF.plur(seuil, 'intervenant'))
      + '. Environ <b>' + OF.plur(candidats, 'candidat') + '</b> à rechercher.'
    : 'Le vivier déclaré couvre le prévisionnel ' + (annee ? annee.annee : '')
      + (fragiles.length ? '. Reste à surveiller ' + OF.plur(fragiles.length, 'profil')
        + ' sous le seuil de robustesse.' : '.');
  zone.appendChild(verdict);

  /* les indicateurs */
  var h2 = document.createElement('h2');
  h2.textContent = 'Où nous en sommes';
  zone.appendChild(h2);
  var inds = document.createElement('div');
  inds.className = 'indicateurs';
  var taux = requis ? couvert / requis : 1;
  var fCouv = OF.feu(taux < 0.9, taux < 1);
  inds.appendChild(indicateur(fCouv, 'Couverture des heures par le vivier net',
    OF.pourcent(couvert, requis), 'cible 100 %'));
  inds.appendChild(indicateur(fCouv, 'Heures d\'animation non couvertes', OF.ent(manque) + ' h', 'cible 0'));
  inds.appendChild(indicateur(
    OF.feu(tendus.length > actifs.length / 2, tendus.length > 0),
    'Profils à renforcer', tendus.length + ' sur ' + actifs.length, 'cible 0'));
  inds.appendChild(indicateur(OF.feu(fragiles.length > 0, false),
    'Profils sous le seuil de ' + OF.plur(seuil, 'intervenant'), String(fragiles.length),
    'règle S01-PO1'));
  inds.appendChild(indicateur('', 'Vivier nécessaire au total',
    OF.plur(cible, 'intervenant'), 'toutes formations confondues'));
  var cap = somme(OF.table('Charge').filter(function (c) { return c.annee === idAnnee; }),
    'capacite_heures');
  inds.appendChild(cap
    ? indicateur(OF.feu(requis > cap * 1.1, requis > cap), 'Heures d\'animation à couvrir',
        OF.ent(requis) + ' h sur ' + OF.ent(cap) + ' h', OF.pourcent(requis, cap))
    : indicateur('', 'Heures d\'animation à couvrir', OF.ent(requis) + ' h',
        'capacité non renseignée'));
  if (nonDecrits.length) {
    inds.appendChild(indicateur(OF.feu(false, true), 'Profils absents de Intervenants_formation',
      String(nonDecrits.length), 'cible 0'));
  }
  zone.appendChild(inds);

  /* par profil, en jauges : ce qui est couvert, ce qui manque */
  zone.appendChild(titre('Couverture par profil'));
  var barres = document.createElement('div');
  barres.className = 'barres';
  actifs.slice().sort(function (a, b) {
    return (b.a_recruter || 0) - (a.a_recruter || 0)
      || (b.heures_requises || 0) - (a.heures_requises || 0);
  }).forEach(function (p) {
    var part = Math.min(100, Math.round(100 * (p.taux_couverture || 0)));
    var ligne = document.createElement('div');
    ligne.className = 'barre-ligne';
    ligne.innerHTML = '<span>' + OF.echappe(nom('Intervenants', p.ressource, 'Profil non renseigné'))
      + '</span><span class="jauge"><span class="' + (part < 80 ? 'grave' : (part < 100 ? 'tendu' : ''))
      + '" style="width:' + part + '%"></span></span>'
      + '<span class="calcul">' + part + ' %'
      + (p.a_recruter ? ' · <b class="negatif">' + OF.ent(p.a_recruter) + ' à recruter</b>' : '')
      + '</span>';
    barres.appendChild(ligne);
  });
  zone.appendChild(barres);

  /* les priorités */
  if (tendus.length) {
    zone.appendChild(titre('Priorités de recrutement'));
    var ol = document.createElement('ol');
    ol.className = 'rangs';
    tendus.slice().sort(function (a, b) {
      return (b.a_recruter || 0) - (a.a_recruter || 0)
        || (b.heures_manquantes || 0) - (a.heures_manquantes || 0);
    }).forEach(function (p, i) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="rang">' + (i + 1) + '</span>'
        + '<span>' + OF.echappe(nom('Intervenants', p.ressource, 'Profil non renseigné'))
        + '<span class="rang-detail"><br>'
        + OF.ent(p.heures_manquantes) + ' h non couvertes sur ' + OF.ent(p.heures_requises)
        + ', réparties sur ' + OF.plur(p.formations_concernees, 'formation')
        + '</span></span>'
        + '<span class="rang-val">' + OF.ent(p.a_recruter) + ' à recruter<br>'
        + '<span class="rang-detail">' + OF.ent(p.candidats_a_rechercher) + ' candidats</span></span>';
      ol.appendChild(li);
    });
    zone.appendChild(ol);
  }

  /* les dépendances à une personne */
  if (fragiles.length) {
    zone.appendChild(titre('Risque de dépendance à une personne'));
    var pf = document.createElement('p');
    pf.className = 'note';
    pf.textContent = 'Après turn-over, ces profils reposent sur moins de '
      + OF.plur(seuil, 'intervenant') + ' : une absence suffit à annuler des sessions.';
    zone.appendChild(pf);
    var ul = document.createElement('ul');
    ul.className = 'rangs';
    fragiles.slice().sort(function (a, b) {
      return (a.vivier_net || 0) - (b.vivier_net || 0)
        || (b.sessions_concernees || 0) - (a.sessions_concernees || 0);
    }).forEach(function (p) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="rang">·</span><span>'
        + OF.echappe(nom('Intervenants', p.ressource, 'Profil non renseigné'))
        + '<span class="rang-detail"><br>' + OF.plur(p.sessions_concernees, 'session') + ' '
        + OF.accord(p.sessions_concernees, 'projetée', 'projetées') + ' sur '
        + OF.plur(p.formations_concernees, 'formation') + '</span></span>'
        + '<span class="rang-val negatif">vivier net ' + OF.dec(p.vivier_net) + '</span>';
      ul.appendChild(li);
    });
    zone.appendChild(ul);
  }

  /* la trajectoire du recrutement, par année et par profil */
  trajectoireRecrutement(zone);

  /* ce qui bloque */
  var aFaire = [];
  var declares = {};
  demande.forEach(function (v) { declares[v.formation + ':' + (v.ressource || 0)] = 1; });
  var oublies = {};
  OF.table('Projections').concat(OF.table('Ventes_intra')).forEach(function (pr) {
    if (pr.annee !== idAnnee || !pr.formation || !pr.nb_sessions) return;
    OF.table('Intervenants_formation').forEach(function (i) {
      if (i.formation === pr.formation && i.ressource && !declares[pr.formation + ':' + i.ressource]) {
        oublies[nom('Formations', pr.formation, '?') + ' / ' + nom('Intervenants', i.ressource, '?')] = 1;
      }
    });
  });
  if (Object.keys(oublies).length) {
    aFaire.push('<b>Déclarer la demande</b> de ' + OF.plur(Object.keys(oublies).length, 'couple')
      + ' ' + OF.accord(Object.keys(oublies).length, 'projeté', 'projetés') + ' : '
      + OF.echappe(Object.keys(oublies).sort().join(', ')) + '.');
  }
  if (nonDecrits.length) {
    aFaire.push('<b>Décrire les intervenants</b> dans Intervenants_formation pour : '
      + OF.echappe(nonDecrits.map(couple).sort().join(', ')) + '.');
  }
  var vides = actifs.filter(function (p) { return !p.vivier_actuel; });
  if (vides.length) {
    aFaire.push('<b>Saisir le vivier actuel</b> de ' + OF.plur(vides.length, 'profil')
      + ' : le besoin y est calculé comme si aucun intervenant n\'était autorisé — '
      + OF.echappe(vides.map(function (p) {
          return nom('Intervenants', p.ressource, '?');
        }).sort().join(', ')) + '.');
  }
  if (!parametre('heures_par_intervenant_an')) {
    aFaire.push('<b>Renseigner le paramètre</b> <code>heures_par_intervenant_an</code> : '
      + 'sans lui, la capacité d\'un intervenant est nulle et tout le besoin apparaît '
      + 'comme à recruter.');
  }
  if (!cap) {
    aFaire.push('<b>Renseigner la capacité</b> dans la table Charge, pour confronter les heures '
      + 'd\'animation à ce que l\'organisme peut absorber.');
  }
  if (aFaire.length) {
    zone.appendChild(titre('Ce qui bloque le pilotage'));
    var ul3 = document.createElement('ul');
    ul3.className = 'a-faire';
    ul3.innerHTML = aFaire.map(function (t) { return '<li>' + t + '</li>'; }).join('');
    zone.appendChild(ul3);
  }

  var note = document.createElement('p');
  note.className = 'aide';
  note.textContent = 'Un intervenant compte une fois, dans son profil : les totaux ci-dessus '
    + 'comptent des personnes, pas des autorisations. La capacité d\'un intervenant se mesure '
    + 'en heures d\'animation par an, pour que les formations longues et les demi-journées '
    + 'ne pèsent pas pareil.';
  zone.appendChild(note);
  return zone;
}

/* Quand recruter, et de quel profil : une barre empilée par année. */
function trajectoireRecrutement(zone) {
  var annees = anneesAffichees();
  if (annees.length < 2) return;

  var parProfil = {};
  annees.forEach(function (a) {
    profilsAnnee(a.id).forEach(function (p) {
      if (!p.a_recruter || !p.ressource) return;
      (parProfil[p.ressource] = parProfil[p.ressource] || {})[a.id] =
        (parProfil[p.ressource][a.id] || 0) + p.a_recruter;
    });
  });
  var profils = Object.keys(parProfil);
  if (!profils.length) return;

  profils.sort(function (x, y) {
    var sx = 0, sy = 0;
    annees.forEach(function (a) { sx += parProfil[x][a.id] || 0; sy += parProfil[y][a.id] || 0; });
    return sy - sx;
  });

  var noms = profils.map(function (k) { return nom('Intervenants', +k, 'Profil non renseigné'); });
  var series = profils.map(function (k, s) {
    return { nom: noms[s],
      valeur: OF.ent(annees.reduce(function (n, a) { return n + (parProfil[k][a.id] || 0); }, 0))
        + ' au total' };
  });
  var groupes = annees.map(function (a) {
    var parts = profils.map(function (k) { return parProfil[k][a.id] || 0; });
    var total = parts.reduce(function (n, v) { return n + v; }, 0);
    return {
      libelle: String(a.annee), parts: parts,
      bulle: '<b>' + a.annee + '</b> — ' + OF.plur(total, 'intervenant') + ' à recruter'
        + noms.map(function (n, s) {
          return parts[s] ? '<span class="second">' + OF.echappe(n)
            + ' : ' + OF.ent(parts[s]) + '</span>' : '';
        }).join('')
    };
  });

  zone.appendChild(titre('Quand recruter, et de quel profil'));
  G.figure(zone, {
    titre: 'Intervenants à recruter par année',
    sous: 'Un intervenant compte une fois, dans son profil : ces totaux sont des personnes.',
    haut: 200,
    series: series,
    chiffres: G.chiffres('Les chiffres',
      ['Profil'].concat(annees.map(function (a) { return String(a.annee); })),
      profils.map(function (k, s) {
        return [series[s].nom].concat(annees.map(function (a) {
          return parProfil[k][a.id] ? OF.ent(parProfil[k][a.id]) : '—';
        }));
      })),
    dessin: function (larg, haut) {
      return G.empilees({
        larg: larg, haut: haut, groupes: groupes, series: series,
        formatY: OF.ent, formatVal: OF.ent, total: true,
        unite: 'intervenants',
        description: 'Intervenants à recruter par année, répartis par profil.'
      });
    }
  });
}

/* ------------------------------------------------------------ salles --- */
/* Le document calcule déjà tout : jours requis d'après les besoins déclarés
   sur les formations et les sessions projetées à l'OF, capacité théorique
   d'après les salles détenues et les jours d'ouverture, taux d'occupation,
   salles nécessaires, et même une phrase de lecture. On affiche, on ne
   recalcule pas. La seule saisie est le nombre de jours réellement
   disponibles, quand il diffère de la capacité théorique. */
function pageSalles() {
  var zone = document.createElement('div');
  var annee = OF.parId(OF.table('Annees'))[idAnnee];

  var h1 = document.createElement('h1');
  h1.textContent = 'Occupation des salles — ' + (annee ? annee.annee : '');
  zone.appendChild(h1);

  var lignes = OF.table('Salles').filter(function (s) { return s.annee === idAnnee; })
    .sort(function (a, b) { return (b.jours_requis || 0) - (a.jours_requis || 0); });

  if (!OF.table('Types_salles').length) {
    var vide = document.createElement('p');
    vide.className = 'alerte-bloc';
    vide.textContent = 'La table Types_salles est vide : il n\'y a pas de type de salle à '
      + 'suivre. C\'est elle qui porte aussi le nombre de salles détenues par l\'organisme.';
    zone.appendChild(vide);
    return zone;
  }
  if (!lignes.length) {
    var sans = document.createElement('p');
    sans.className = 'alerte-bloc';
    sans.textContent = 'Aucune ligne dans la table Salles pour ' + (annee ? annee.annee : '')
      + '. Il en faut une par type de salle et par année pour que le document calcule les '
      + 'jours requis. Le tableau ci-dessous permet de les créer.';
    zone.appendChild(sans);
  }

  var requis = somme(lignes, 'jours_requis');
  var depassees = lignes.filter(function (s) { return (s.taux_occupation || 0) > 1; });
  var tendues = lignes.filter(function (s) {
    return (s.taux_occupation || 0) > 0.85 && (s.taux_occupation || 0) <= 1;
  });
  var inconnues = lignes.filter(function (s) {
    return s.jours_requis && !(s.jours_disponibles || s.capacite_theorique);
  });

  if (lignes.length) {
    var t = document.createElement('div');
    t.className = 'tuiles';
    t.appendChild(tuile('Jours de salle à couvrir', OF.dec(requis),
      OF.plur(lignes.length, 'type') + ' de salle', ''));
    t.appendChild(tuile('Capacité dépassée', OF.ent(depassees.length),
      depassees.length ? depassees.map(function (s) {
        return nom('Types_salles', s.type_salle, '?');
      }).join(', ') : 'aucun type en dépassement',
      depassees.length ? 'negatif' : 'positif'));
    t.appendChild(tuile('Sous tension', OF.ent(tendues.length), 'au-delà de 85 % d\'occupation',
      tendues.length ? 'negatif' : ''));
    if (inconnues.length) {
      t.appendChild(tuile('Capacité inconnue', OF.ent(inconnues.length),
        'ni jours disponibles, ni salles détenues'));
    }
    zone.appendChild(t);
  }

  /* l'occupation par type, en jauges — la lecture la plus rapide */
  var avecTaux = lignes.filter(function (s) { return s.jours_requis; });
  if (avecTaux.length) {
    zone.appendChild(titre('Taux d\'occupation par type de salle'));
    var barres = document.createElement('div');
    barres.className = 'barres';
    avecTaux.forEach(function (s) {
      var pc = Math.round(100 * (s.taux_occupation || 0));
      var l = document.createElement('div');
      l.className = 'barre-ligne';
      l.innerHTML = '<span>' + OF.echappe(nom('Types_salles', s.type_salle, 'Type non renseigné'))
        + '</span><span class="jauge"><span class="'
        + (pc > 100 ? 'grave' : (pc > 85 ? 'tendu' : ''))
        + '" style="width:' + Math.min(100, pc) + '%"></span></span>'
        + '<span class="calcul">' + (s.taux_occupation ? pc + ' %' : 'capacité inconnue')
        + ' · ' + OF.dec(s.jours_requis) + ' j requis</span>';
      barres.appendChild(l);
    });
    zone.appendChild(barres);

    var lectures = document.createElement('ul');
    lectures.className = 'rangs';
    avecTaux.forEach(function (s) {
      if (!OF.texte(s.lecture)) return;
      var li = document.createElement('li');
      li.innerHTML = '<span class="rang">·</span><span>'
        + OF.echappe(nom('Types_salles', s.type_salle, 'Type non renseigné'))
        + '<span class="rang-detail"><br>' + OF.echappe(s.lecture) + '</span></span>'
        + '<span class="rang-val' + (OF.texte(s.alerte) ? ' negatif' : '') + '">'
        + OF.echappe(OF.texte(s.alerte) || '') + '</span>';
      lectures.appendChild(li);
    });
    if (lectures.children.length) {
      zone.appendChild(titre('Ce que dit le document, type par type'));
      zone.appendChild(lectures);
    }
  }

  /* le détail, modifiable : seuls les jours disponibles se saisissent */
  zone.appendChild(titre('Le détail de ' + (annee ? annee.annee : 'l\'année')));
  var colonnes = [
    { col: 'type_salle', libelle: 'Type de salle', type: 'ref', ref: 'Types_salles' },
    { col: 'jours_disponibles', libelle: 'Jours disponibles', type: 'num',
      placeholder: 'théorique' }
  ];
  [['jours_requis', 'Jours requis', OF.dec],
   ['capacite_theorique', 'Capacité théorique', OF.dec],
   ['salles_detenues', 'Salles détenues', OF.ent],
   ['salles_necessaires', 'Salles nécessaires', OF.dec]
  ].forEach(function (c) {
    if (lignes.length && lignes[0][c[0]] === undefined) return;
    colonnes.push({ col: c[0], libelle: c[1], type: 'calcul', format: c[2] });
  });
  colonnes.push({ col: 'taux_occupation', libelle: 'Occupation', type: 'calcul',
    format: function (v) { return Math.round(100 * (v || 0)) + ' %'; } });

  zone.appendChild(defilant(OF.sousTable({
    table: 'Salles',
    lignes: lignes,
    colonnes: colonnes,
    nouveau: { annee: idAnnee },
    relire: ['Salles', 'Types_salles'],
    apres: rendreTout,
    libelleAjout: 'Ajouter un type de salle pour cette année',
    vide: 'Une ligne par type de salle et par année : c\'est elle qui porte les jours requis.'
  })));

  /* la trajectoire : combien de jours de salle chaque année réclame */
  trajectoireSalles(zone);

  var n = document.createElement('p');
  n.className = 'aide';
  n.textContent = 'Les jours requis viennent des besoins en salles déclarés sur chaque '
    + 'formation, multipliés par les sessions projetées — et seulement celles qui se '
    + 'déroulent à l\'OF : une session à l\'extérieur n\'occupe pas nos salles. La capacité '
    + 'théorique est le nombre de salles détenues multiplié par les jours d\'ouverture de '
    + 'l\'année. Renseigner les jours disponibles la remplace, quand une salle est partagée '
    + 'ou indisponible une partie de l\'année.';
  zone.appendChild(n);
  return zone;
}

function trajectoireSalles(zone) {
  var annees = OF.anneesTriees();
  if (annees.length < 2) return;
  var types = OF.table('Types_salles').filter(function (t) { return t.actif !== false; });
  var parType = {};
  var total = 0;
  types.forEach(function (ty) {
    parType[ty.id] = {};
    annees.forEach(function (a) {
      var l = OF.table('Salles').filter(function (s) {
        return s.annee === a.id && s.type_salle === ty.id;
      })[0];
      var j = (l && l.jours_requis) || 0;
      parType[ty.id][a.id] = j;
      total += j;
    });
  });
  if (!total) return;

  var retenus = types.filter(function (ty) {
    return annees.some(function (a) { return parType[ty.id][a.id]; });
  }).sort(function (x, y) {
    var sx = 0, sy = 0;
    annees.forEach(function (a) { sx += parType[x.id][a.id]; sy += parType[y.id][a.id]; });
    return sy - sx;
  });
  if (!retenus.length) return;

  var series = retenus.map(function (ty) {
    return { nom: OF.texte(ty.intitule) || 'Type non nommé',
      valeur: OF.dec(annees.reduce(function (n, a) { return n + parType[ty.id][a.id]; }, 0))
        + ' j au total' };
  });
  var groupes = annees.map(function (a) {
    var parts = retenus.map(function (ty) { return parType[ty.id][a.id]; });
    var somme2 = parts.reduce(function (n, v) { return n + v; }, 0);
    return {
      libelle: String(a.annee), parts: parts,
      bulle: '<b>' + a.annee + '</b> — ' + OF.dec(somme2) + ' jours de salle'
        + retenus.map(function (ty, i) {
          return parts[i] ? '<span class="second">' + OF.echappe(series[i].nom) + ' : '
            + OF.dec(parts[i]) + ' j</span>' : '';
        }).join('')
    };
  });

  zone.appendChild(titre('Jours de salle requis, année par année'));
  G.figure(zone, {
    titre: 'Besoin en jours de salle, par type',
    sous: 'Sessions projetées à l\'OF uniquement : une session à l\'extérieur n\'occupe pas '
      + 'nos salles.',
    haut: 210,
    series: series,
    chiffres: G.chiffres('Les chiffres',
      ['Type de salle'].concat(annees.map(function (a) { return String(a.annee); })),
      retenus.map(function (ty, i) {
        return [series[i].nom].concat(annees.map(function (a) {
          return parType[ty.id][a.id] ? OF.dec(parType[ty.id][a.id]) : '—';
        }));
      })),
    dessin: function (larg, haut) {
      return G.empilees({
        larg: larg, haut: haut, groupes: groupes, series: series,
        formatY: OF.dec, formatVal: OF.dec, total: true, unite: 'jours de salle',
        description: 'Jours de salle requis par année, répartis par type de salle.'
      });
    }
  });
}

/* ---------------------------------------------------------------- page -- */
function rendreTout() {
  rendreRail();
  rendrePage();
}

/* Le rail des profils n'a de sens que dans la vue Vivier ; les deux autres
   occupent toute la largeur. */
function rendrePage() {
  var page = OF.$('page');
  if (G && G.oublier) G.oublier();
  page.innerHTML = '';
  var annee = OF.parId(OF.table('Annees'))[idAnnee];

  var railVisible = vue === 'vivier';
  OF.$('rail').style.display = railVisible ? '' : 'none';
  OF.$('recherche').style.display = railVisible ? '' : 'none';
  OF.$('amorcer').style.display = railVisible ? '' : 'none';

  if (vue === 'recrutement') {
    page.appendChild(pageRecrutement());
    if (G && G.redessiner) G.redessiner();
    rendreAvance();
    return;
  }
  if (vue === 'salles') {
    page.appendChild(pageSalles());
    if (G && G.redessiner) G.redessiner();
    rendreAvance();
    return;
  }

  if (!migreFait()) { page.appendChild(aMigrer()); return; }

  if (!profilCourant) {
    page.appendChild(synthese(annee));
    return;
  }
  var profil = OF.parId(OF.table('Intervenants'))[profilCourant];
  var P = ligneProfil(profilCourant);
  var lignes = demandeDe(profilCourant).sort(function (a, b) {
    return (b.heures_animation || 0) - (a.heures_animation || 0)
      || OF.texte(nom('Formations', a.formation, '')).localeCompare(
           OF.texte(nom('Formations', b.formation, '')), 'fr');
  });

  var h1 = document.createElement('h1');
  h1.textContent = OF.texte(profil && profil.intitule);
  page.appendChild(h1);

  if (!P) {
    var v = document.createElement('p');
    v.className = 'alerte-bloc';
    v.textContent = 'Aucune ligne de vivier pour ce profil en ' + annee.annee
      + '. Le bouton « Compléter les lignes » la crée — une seule, pour le profil : '
      + 'le vivier ne se saisit plus formation par formation.';
    page.appendChild(v);
    return;
  }

  var sous = document.createElement('p');
  sous.className = 'sous';
  sous.textContent = P.a_recruter
    ? ('Recruter ' + OF.plur(P.a_recruter, 'intervenant') + ' de ce profil en ' + annee.annee
       + ', soit environ ' + OF.plur(P.candidats_a_rechercher, 'candidat') + ' à rechercher pour '
       + OF.plur(P.heures_requises, 'heure') + ' d\'animation sur '
       + OF.plur(P.formations_concernees, 'formation') + '.')
    : (P.vivier_actuel
       ? ('Le vivier couvre les ' + OF.plur(P.heures_requises, 'heure')
          + ' d\'animation de ce profil en ' + annee.annee + '.')
       : ('Vivier non saisi : il faudrait ' + OF.plur(P.vivier_cible, 'intervenant')
          + ' de ce profil pour couvrir les ' + OF.plur(P.heures_requises, 'heure')
          + ' d\'animation de ' + annee.annee + '.'));
  page.appendChild(sous);

  page.appendChild(saisieProfil(P));
  page.appendChild(titre('Comment on arrive à ce chiffre'));
  page.appendChild(derivation(P));
  page.appendChild(titre('D\'où vient le besoin'));
  page.appendChild(defilant(demande(lignes, P)));
  page.appendChild(aide());
}

/* ----------------------------------------------- saisie, au niveau profil */
function saisieProfil(P) {
  var d = document.createElement('div');
  d.className = 'tuiles';
  d.appendChild(champTuile(P, 'vivier_actuel', 'Vivier actuel',
    'intervenants de ce profil aujourd\'hui autorisés', false,
    !!P.heures_requises && !P.vivier_actuel));
  d.appendChild(champTuile(P, 'departs_connus', 'Départs connus',
    'déjà identifiés pour l\'année', false, false));
  d.appendChild(champTuile(P, 'heures_par_intervenant', 'Heures / an par intervenant',
    'vide = le paramètre général', true, false));
  return d;
}

function champTuile(P, colonne, libelle, contexte, vide, manquant) {
  var d = document.createElement('div');
  d.className = 'tuile';
  var lib = document.createElement('div');
  lib.className = 'tuile-lib';
  lib.textContent = libelle;
  d.appendChild(lib);
  var zone = document.createElement('div');
  zone.className = 'tuile-val';
  zone.appendChild(champVivier(P, colonne, vide, manquant, libelle));
  d.appendChild(zone);
  var ctx = document.createElement('div');
  ctx.className = 'tuile-ctx';
  ctx.textContent = contexte;
  d.appendChild(ctx);
  return d;
}

/* La dérivation : les mêmes chiffres, mais dans l'ordre où on les obtient.
   Sans elle, « 157 à recruter » est un verdict qu'on ne peut pas discuter. */
function derivation(P) {
  var t = document.createElement('table');
  t.className = 'matrice derivation';
  var corps = document.createElement('tbody');
  var indispo = parametre('indisponibilite_intervenants');
  var turnover = parametre('turnover_vivier');
  var tauxNouveau = parametre('capacite_nouvel_intervenant');
  var seuil = parametre('vivier_minimum');

  var etapes = [
    { libelle: 'Heures d\'animation à couvrir',
      detail: OF.plur(P.formations_concernees, 'formation') + ', '
        + OF.plur(P.sessions_concernees, 'session') + ', '
        + OF.plur(P.interventions_requises, 'intervention'),
      valeur: OF.ent(P.heures_requises) + ' h', fort: true },
    { libelle: 'Ce qu\'un intervenant peut animer dans l\'année',
      detail: OF.ent((P.heures_par_intervenant || parametre('heures_par_intervenant_an')))
        + ' h par an, moins ' + Math.round(100 * indispo) + ' % d\'indisponibilité',
      valeur: OF.dec(P.capacite_intervenant) + ' h' },
    { libelle: 'Vivier nécessaire au total',
      detail: OF.ent(P.heures_requises) + ' h ÷ ' + OF.dec(P.capacite_intervenant)
        + ' h, arrondi à l\'intervenant supérieur',
      valeur: OF.ent(P.vivier_cible) + ' ' + OF.accord(P.vivier_cible, 'intervenant', 'intervenants'),
      fort: true },
    { libelle: 'Vivier net, après turn-over',
      detail: OF.plur(P.vivier_actuel, 'autorisé') + ' moins la plus grande des deux pertes : '
        + OF.plur(P.departs_connus, 'départ connu', 'départs connus') + ' ou '
        + Math.round(100 * turnover) + ' % de turn-over',
      valeur: OF.dec(P.vivier_net),
      classe: P.heures_requises && (P.vivier_net || 0) < seuil ? 'negatif' : '' },
    { libelle: 'Heures couvertes par ce vivier',
      detail: OF.dec(P.vivier_net) + ' × ' + OF.dec(P.capacite_intervenant) + ' h, plafonné au besoin',
      valeur: OF.ent(P.heures_couvertes) + ' h  ·  '
        + Math.round(100 * (P.taux_couverture || 0)) + ' %',
      classe: (P.taux_couverture || 0) >= 1 ? 'positif' : 'negatif' },
  ];
  if (P.heures_manquantes) {
    etapes.push({ libelle: 'Heures manquantes',
      detail: OF.ent(P.heures_requises) + ' h − ' + OF.ent(P.heures_couvertes) + ' h',
      valeur: OF.ent(P.heures_manquantes) + ' h', classe: 'negatif' });
  }
  if (P.a_recruter) {
    /* Deux raisons de recruter, et il faut dire laquelle : couvrir les heures
       qui manquent, ou simplement ne pas reposer sur une seule personne. La
       seconde arrive souvent sur les petits profils, dont les heures sont
       couvertes — sans cette ligne, le chiffre serait inexplicable. */
    var parCharge = P.heures_manquantes && P.capacite_intervenant && tauxNouveau
      ? Math.ceil(P.heures_manquantes / (P.capacite_intervenant * tauxNouveau)) : 0;
    etapes.push(parCharge >= P.a_recruter
      ? { libelle: 'Intervenants à recruter',
          detail: OF.ent(P.heures_manquantes) + ' h ÷ ('
            + OF.dec(P.capacite_intervenant) + ' h × ' + Math.round(100 * tauxNouveau)
            + ' %) — une recrue accompagnée ne compte que pour une fraction la première année',
          valeur: OF.ent(P.a_recruter), fort: true, classe: 'negatif' }
      : { libelle: 'Intervenants à recruter',
          detail: 'les heures sont couvertes, mais le vivier net (' + OF.dec(P.vivier_net)
            + ') reste sous le seuil de ' + OF.plur(seuil, 'intervenant')
            + ' : il faut le remonter pour qu\'une absence n\'annule pas de session',
          valeur: OF.ent(P.a_recruter), fort: true, classe: 'negatif' });
    etapes.push({ libelle: 'Candidats à rechercher',
      detail: OF.ent(P.a_recruter) + ' ÷ '
        + Math.round(100 * parametre('taux_selection_candidats')) + ' % de sélection',
      valeur: OF.ent(P.candidats_a_rechercher) });
  }

  etapes.forEach(function (e) {
    var tr = document.createElement('tr');
    var td = document.createElement('td');
    td.className = 'gauche libelle';
    td.textContent = e.libelle;
    if (e.fort) td.style.fontWeight = '600';
    if (e.detail) {
      var s = document.createElement('div');
      s.className = 'second';
      s.textContent = e.detail;
      td.appendChild(s);
    }
    tr.appendChild(td);
    var tdv = document.createElement('td');
    tdv.className = 'calcul calcule';
    if (e.fort) { tdv.style.fontWeight = '600'; tdv.style.color = 'var(--encre)'; }
    if (e.classe) {
      tdv.style.color = e.classe === 'positif' ? 'var(--fait)' : 'var(--alerte)';
      tdv.style.fontWeight = '600';
    }
    tdv.textContent = e.valeur;
    tr.appendChild(tdv);
    corps.appendChild(tr);
  });
  t.appendChild(corps);
  return t;
}

/* La demande, formation par formation : en lecture seule, parce qu'elle est
   calculée par le document à partir des sessions projetées et des
   intervenants décrits. On la montre pour qu'on sache d'où viennent les
   heures, pas pour la corriger ici. */
function demande(lignes, P) {
  var t = document.createElement('table');
  t.className = 'matrice';
  t.innerHTML = '<thead><tr>'
    + '<th class="gauche">Formation</th>'
    + '<th class="calcule">Sessions</th><th>Par session</th><th>Interventions</th>'
    + '<th>Heures</th><th>Part du besoin</th><th>Recrues imputées</th></tr></thead>';
  var corps = document.createElement('tbody');

  lignes.forEach(function (v, i) {
    var tr = document.createElement('tr');
    tr.dataset.ligne = i;
    var td = document.createElement('td');
    td.className = 'gauche libelle';
    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'lien';
    bouton.textContent = nom('Formations', v.formation, 'Formation inconnue');
    bouton.addEventListener('click', function () {
      /* ouvrir la formation dans le document quand le widget y est lié ;
         sinon il ne se passe rien, et c'est très bien */
      try { window.grist.setCursorPos({ tableId: 'Formations', rowId: v.formation }); }
      catch (e) { /* widget non lié */ }
    });
    td.appendChild(bouton);
    var ent = nom('Gestionnaire', v.entite, '');
    if (ent) {
      var s = document.createElement('div');
      s.className = 'second';
      s.textContent = ent;
      td.appendChild(s);
    }
    tr.appendChild(td);

    var part = P && P.heures_requises ? (v.heures_animation || 0) / P.heures_requises : 0;
    [[OF.dec(v.nb_sessions), true], [OF.dec(v.intervenants_par_session), false],
     [OF.dec(v.interventions_requises), false], [OF.ent(v.heures_animation), false],
     [Math.round(100 * part) + ' %', false],
     [v.recrues_imputees ? OF.dec(v.recrues_imputees) : '—', false]
    ].forEach(function (c) {
      var tdc = document.createElement('td');
      tdc.className = 'calcul' + (c[1] ? ' calcule' : '');
      tdc.textContent = c[0];
      tr.appendChild(tdc);
    });
    corps.appendChild(tr);
  });

  if (P) {
    var pied = document.createElement('tr');
    pied.className = 'total';
    pied.innerHTML = '<td class="gauche libelle" style="font-weight:600">Total</td>'
      + '<td class="calcul calcule">' + OF.dec(P.sessions_concernees) + '</td>'
      + '<td class="calcul">—</td>'
      + '<td class="calcul">' + OF.dec(P.interventions_requises) + '</td>'
      + '<td class="calcul" style="font-weight:600">' + OF.ent(P.heures_requises) + '</td>'
      + '<td class="calcul">100 %</td>'
      + '<td class="calcul" style="font-weight:600">' + OF.ent(P.a_recruter) + '</td>';
    corps.appendChild(pied);
  }
  t.appendChild(corps);
  return t;
}

/* --------------------------------------------------- champ de Vivier_profils */
function champVivier(P, colonne, vide, manquant, etiquette, iLigne, iCol) {
  var el = document.createElement('input');
  el.className = 'champ' + (manquant ? ' vide-attendu' : '');
  el.inputMode = 'decimal';
  el.placeholder = vide ? 'défaut' : '—';
  el.value = (P[colonne] || P[colonne] === 0) && !(vide && !P[colonne]) ? OF.dec(P[colonne]) : '';
  el.dataset.rec = P.id;
  el.dataset.colonne = colonne;
  el.dataset.vide = vide ? '1' : '0';
  if (iLigne !== undefined) { el.dataset.ligne = iLigne; el.dataset.col = iCol; }
  el.setAttribute('aria-label', (etiquette || colonne) + ' — '
    + nom('Intervenants', P.ressource, ''));
  var origine = el.value;
  var cle = 'vivier:' + P.id + ':' + colonne;
  var enregistrer = function () {
    var val = el.value.trim() === '' ? (vide ? null : 0) : OF.nombre(el.value);
    if (val !== null && val < 0) {
      el.classList.add('erreur');
      OF.signaler('Un nombre négatif n\'a pas de sens ici', true);
      return;
    }
    var champs = {};
    champs[colonne] = val;
    OF.appliquer([['UpdateRecord', 'Vivier_profils', P.id, champs]], RELIRE, rafraichir)
      .catch(function () { el.classList.add('erreur'); });
  };
  el.addEventListener('input', function () {
    el.classList.remove('erreur');
    OF.differer(cle, enregistrer);
  });
  el.addEventListener('blur', function () { if (OF.forcer(cle)) enregistrer(); });
  el.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { el.value = origine; el.blur(); return; }
    if (ev.key === 'ArrowDown' || ev.key === 'Enter') { ev.preventDefault(); deplacer(el, 1); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); deplacer(el, -1); }
  });
  return el;
}

function deplacer(el, pas) {
  var cible = OF.$('page').querySelector(
    '.champ[data-ligne="' + (+el.dataset.ligne + pas) + '"][data-col="' + el.dataset.col + '"]');
  if (cible) { cible.focus(); cible.select(); } else el.blur();
}

/* ------------------------------------------------------------ synthèse -- */
/* La grille de saisie : une ligne par profil, pas par formation × profil.
   Dix lignes au lieu de trente et une, et surtout une seule case par profil
   — les mêmes personnes n'y sont plus comptées huit fois. */
function synthese(annee) {
  var zone = document.createElement('div');
  var P = profilsAnnee(idAnnee);
  var seuil = parametre('vivier_minimum');
  var h1 = document.createElement('h1');
  h1.textContent = 'Plan de charge ' + (annee ? annee.annee : '');
  zone.appendChild(h1);

  var p = document.createElement('p');
  p.className = 'sous';
  p.textContent = 'Le vivier se saisit ici, profil par profil : un formateur GSU est habilité '
    + 'au GSU, pas à une formation en particulier. Les besoins des formations s\'y additionnent. '
    + 'Cliquez sur un profil pour voir d\'où vient son besoin.';
  zone.appendChild(p);

  if (!P.length) {
    var al = document.createElement('p');
    al.className = 'alerte-bloc';
    al.textContent = 'Aucune ligne de vivier pour cette année. Le bouton « Compléter les lignes » '
      + 'en crée une par profil mobilisé, d\'après les intervenants décrits sur les formations '
      + 'projetées.';
    zone.appendChild(al);
    return zone;
  }

  var t = document.createElement('table');
  t.className = 'matrice';
  t.innerHTML = '<thead><tr><th class="gauche">Profil</th>'
    + '<th>Vivier actuel</th><th>Départs</th><th>Heures / an</th>'
    + '<th class="calcule">Formations</th><th>Heures à couvrir</th>'
    + '<th>Vivier net</th><th>Nécessaire</th><th>À recruter</th><th>Candidats</th>'
    + '<th class="gauche">Situation</th></tr></thead>';
  var corps = document.createElement('tbody');

  P.slice().sort(function (a, b) {
    return (b.a_recruter || 0) - (a.a_recruter || 0)
      || (b.heures_requises || 0) - (a.heures_requises || 0)
      || OF.texte(nom('Intervenants', a.ressource, '')).localeCompare(
           OF.texte(nom('Intervenants', b.ressource, '')), 'fr');
  }).forEach(function (L, i) {
    var tr = document.createElement('tr');
    tr.dataset.ligne = i;
    var tdN = document.createElement('td');
    tdN.className = 'gauche libelle';
    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'lien';
    bouton.textContent = nom('Intervenants', L.ressource, 'Profil non renseigné');
    bouton.addEventListener('click', function () {
      profilCourant = L.ressource; rendreRail(); rendrePage();
    });
    tdN.appendChild(bouton);
    if (OF.texte(L.alerte)) {
      var a = document.createElement('div');
      a.className = 'second negatif';
      a.textContent = OF.texte(L.alerte);
      tdN.appendChild(a);
    }
    tr.appendChild(tdN);

    [['vivier_actuel', false, !!L.heures_requises && !L.vivier_actuel],
     ['departs_connus', false, false], ['heures_par_intervenant', true, false]
    ].forEach(function (c, k) {
      var td = document.createElement('td');
      td.appendChild(champVivier(L, c[0], c[1], c[2],
        OF.colonne('Vivier_profils', c[0]).libelle, i, k));
      tr.appendChild(td);
    });

    [['formations_concernees', OF.ent, true], ['heures_requises', OF.ent],
     ['vivier_net', OF.dec], ['vivier_cible', OF.ent],
     ['a_recruter', OF.ent], ['candidats_a_rechercher', OF.ent]
    ].forEach(function (c) {
      var td = document.createElement('td');
      td.className = 'calcul' + (c[2] ? ' calcule' : '');
      td.dataset.rec = L.id;
      td.dataset.colonne = c[0];
      td.dataset.ent = c[1] === OF.ent ? '1' : '0';
      var val = L[c[0]];
      td.textContent = (val || val === 0) ? c[1](val) : '—';
      /* .calcul impose sa couleur sourde à la même spécificité que .negatif :
         on la surcharge ici plutôt que de jouer à qui arrive en dernier */
      if (c[0] === 'a_recruter' && val) {
        td.style.fontWeight = '600'; td.style.color = 'var(--alerte)';
      }
      if (c[0] === 'vivier_net' && L.heures_requises && (val || 0) < seuil) {
        td.style.color = 'var(--alerte)';
        td.title = 'Sous le seuil de ' + OF.plur(seuil, 'intervenant') + ' : une absence suffit '
          + 'à annuler des sessions';
      }
      tr.appendChild(td);
    });

    var tds = document.createElement('td');
    tds.className = 'gauche second';
    tds.dataset.rec = L.id;
    tds.dataset.colonne = 'situation';
    tds.dataset.texte = '1';
    tds.textContent = OF.texte(L.situation);
    tr.appendChild(tds);
    corps.appendChild(tr);
  });

  var tot = document.createElement('tr');
  tot.className = 'total';
  tot.innerHTML = '<td class="gauche libelle" style="font-weight:600">Total</td>'
    + '<td class="calcul">' + OF.ent(somme(P, 'vivier_actuel')) + '</td>'
    + '<td class="calcul">' + OF.ent(somme(P, 'departs_connus')) + '</td>'
    + '<td class="calcul">—</td>'
    + '<td class="calcul calcule">—</td>'
    + '<td class="calcul" style="font-weight:600">' + OF.ent(somme(P, 'heures_requises')) + '</td>'
    + '<td class="calcul">' + OF.dec(somme(P, 'vivier_net')) + '</td>'
    + '<td class="calcul">' + OF.ent(somme(P, 'vivier_cible')) + '</td>'
    + '<td class="calcul" style="font-weight:600">' + OF.ent(somme(P, 'a_recruter')) + '</td>'
    + '<td class="calcul">' + OF.ent(somme(P, 'candidats_a_rechercher')) + '</td>'
    + '<td></td>';
  corps.appendChild(tot);
  t.appendChild(corps);
  zone.appendChild(defilant(t));
  zone.appendChild(aide());

  var sans = profilsSansLigne().length;
  if (sans) {
    var av = document.createElement('p');
    av.className = 'alerte-bloc';
    av.style.marginTop = '20px';
    av.textContent = OF.plur(sans, 'profil') + ' ' + OF.accord(sans, 'est mobilisé', 'sont mobilisés')
      + ' en ' + annee.annee + ' sans ligne de vivier : leur besoin est invisible. '
      + 'Le bouton « Compléter les lignes » les ajoute.';
    zone.appendChild(av);
  }
  var n = manquants().length;
  if (n) {
    var av2 = document.createElement('p');
    av2.className = 'alerte-bloc';
    av2.style.marginTop = '12px';
    av2.textContent = OF.plur(n, 'couple') + ' formation × profil '
      + OF.accord(n, 'est projeté', 'sont projetés') + ' sans ligne de demande : les heures de '
      + OF.accord(n, 'cette formation', 'ces formations') + ' ne comptent pas encore. '
      + 'Le même bouton les ajoute.';
    zone.appendChild(av2);
  }
  return zone;
}

/* Le widget ne peut rien faire tant que la table n'existe pas : il le dit
   une fois, clairement, plutôt que d'afficher des colonnes vides. */
function aMigrer() {
  var d = document.createElement('div');
  var h1 = document.createElement('h1');
  h1.textContent = 'Le vivier doit remonter au profil';
  d.appendChild(h1);
  var p = document.createElement('p');
  p.className = 'alerte-bloc';
  p.innerHTML = 'La table <b>Vivier_profils</b> n\'existe pas encore dans ce document. '
    + 'Tant qu\'elle manque, le vivier se saisirait formation par formation — '
    + 'c\'est-à-dire en répartissant une seule population sur plusieurs lignes, '
    + 'ce qu\'aucune répartition ne rend juste.';
  d.appendChild(p);
  var q = document.createElement('p');
  q.className = 'note';
  q.innerHTML = 'Le script <code>vivier_par_profil_grist.js</code> crée la table, reprend les '
    + 'viviers déjà saisis, et passe la capacité d\'un intervenant en heures par an plutôt '
    + 'qu\'en sessions. Il se colle dans la console du navigateur, sur la page du document, '
    + 'et démarre en essai à blanc.';
  d.appendChild(q);
  var r = document.createElement('p');
  r.className = 'note';
  r.textContent = 'Les deux autres onglets, Recrutement et Salles, fonctionnent sans lui — '
    + 'le recrutement affichera simplement des zéros tant que la table manque.';
  d.appendChild(r);
  return d;
}

function aide() {
  var p = document.createElement('p');
  p.className = 'aide';
  p.innerHTML = 'Deux colonnes à saisir : les intervenants de ce profil aujourd\'hui autorisés, '
    + 'et les départs déjà connus. La troisième ne sert que si ce profil s\'écarte du nombre '
    + 'd\'heures que le paramètre général prête à un intervenant. Tout le reste est calculé par '
    + 'le document. <kbd>↑</kbd> <kbd>↓</kbd> passent d\'un profil à l\'autre dans la même '
    + 'colonne, <kbd>Échap</kbd> annule la frappe.';
  return p;
}

/* ----------------------------------------- rafraîchissement sans re-rendu */
/* Chaque case porte le récord qu'elle affiche : on la retrouve par son
   identifiant et non par sa position, donc l'ordre peut changer sans que la
   frappe en cours se retrouve ailleurs. */
function rafraichir() {
  var page = OF.$('page'), actif = document.activeElement;
  var champs = page.querySelectorAll('[data-rec]');
  if (!champs.length) { rendrePage(); rendreRail(); return; }
  var parId = OF.parId(OF.table('Vivier_profils'));
  Array.prototype.forEach.call(champs, function (el) {
    var r = parId[+el.dataset.rec];
    if (!r || el === actif) return;
    var val = r[el.dataset.colonne];
    if (el.classList.contains('champ')) {
      el.value = (val || val === 0) && !(el.dataset.vide === '1' && !val) ? OF.dec(val) : '';
      el.classList.toggle('vide-attendu',
        el.dataset.colonne === 'vivier_actuel' && !!r.heures_requises && !r.vivier_actuel);
      return;
    }
    if (el.dataset.texte === '1') { el.textContent = OF.texte(val); return; }
    el.textContent = (val || val === 0) ? (el.dataset.ent === '1' ? OF.ent(val) : OF.dec(val)) : '—';
    if (el.dataset.colonne === 'a_recruter') {
      el.style.color = val ? 'var(--alerte)' : '';
      el.style.fontWeight = val ? '600' : '';
    }
    if (el.dataset.colonne === 'vivier_net') {
      el.style.color = r.heures_requises && (val || 0) < parametre('vivier_minimum')
        ? 'var(--alerte)' : '';
    }
  });
  /* la dérivation et le pied de tableau tiennent des chiffres dérivés qu'on
     ne peut pas remettre à jour case par case : on les redessine */
  if (profilCourant) {
    var P = ligneProfil(profilCourant);
    var anc = page.querySelector('table.derivation');
    if (P && anc) anc.parentNode.replaceChild(derivation(P), anc);
  }
  rendreRail();
}

/* ----------------------------------------------- compléter les lignes --- */
/* Deux choses à compléter, et il faut les distinguer : les lignes de demande
   (une par formation × profil, calculées) et les lignes de vivier (une par
   profil, saisies). */
function completer() {
  var demandes = manquants();
  var profils = profilsSansLigne();
  if (!demandes.length && !profils.length) {
    OF.signaler('Rien à compléter : toutes les lignes existent');
    return;
  }
  var actions = demandes.map(function (m) {
    return ['AddRecord', 'Vivier', null,
      { annee: idAnnee, formation: m.formation, ressource: m.ressource }];
  }).concat(profils.map(function (r) {
    return ['AddRecord', 'Vivier_profils', null, { annee: idAnnee, ressource: r }];
  }));
  OF.appliquer(actions, RELIRE, function () {
    rendreRail(); rendrePage();
    var dit = [];
    if (profils.length) dit.push(OF.plur(profils.length, 'ligne') + ' de vivier');
    if (demandes.length) dit.push(OF.plur(demandes.length, 'ligne') + ' de demande');
    OF.signaler(dit.join(' et ') + ' ' + OF.accord(actions.length, 'ajoutée', 'ajoutées'));
  });
}

/* ------------------------------------------------------------- montage -- */
['vivier', 'recrutement', 'salles'].forEach(function (v) {
  OF.$('t-' + v).addEventListener('click', function () {
    vue = v;
    ['vivier', 'recrutement', 'salles'].forEach(function (w) {
      OF.$('t-' + w).setAttribute('aria-selected', String(w === v));
    });
    rendrePage();
  });
});

OF.$('recherche').addEventListener('input', function (ev) { filtre = ev.target.value; rendreRail(); });
OF.$('amorcer').addEventListener('click', completer);
OF.$('annee').addEventListener('change', function (ev) {
  idAnnee = +ev.target.value;
  rendreRail();
  rendrePage();
});

function demarrer() {
  var annees = OF.anneesTriees();
  if (!annees.length) { OF.echouer('Aucune année dans la table Annees.'); return; }
  if (!OF.table('Vivier').length && !OF.table('Intervenants_formation').length) {
    OF.echouer('Ni vivier ni intervenants décrits : commencez par attacher des profils aux '
      + 'formations dans la table Intervenants_formation.');
    return;
  }
  var pilotee = OF.anneePilotee();
  idAnnee = pilotee ? pilotee.id : annees[0].id;
  OF.$('annee').innerHTML = annees.map(function (a) {
    return '<option value="' + a.id + '"' + (a.id === idAnnee ? ' selected' : '') + '>'
      + a.annee + '</option>';
  }).join('');
  rendreRail();
  rendrePage();
}

if (typeof window.TEST_SANS_DEMARRAGE === 'undefined') OF.initialiser(TABLES, demarrer);
window.__charge = { demarrer: function () { OF.initialiser(TABLES, demarrer); },
  rendrePage: rendrePage, completer: completer, manquants: manquants };
</script>
